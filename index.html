              <PageHeader icon={meta[0]} title={cur.label} subtitle={meta[1]} tint={meta[2]} right={curCat && curCat.contacts && curCat.contacts.length ? (
                <div className="hidden sm:flex items-center gap-1.5 text-[12px] text-slate-500" data-testid="board-contacts">
                  <span className="text-slate-400">문의</span>
                  {curCat.contacts.slice(0, 2).map((c) => <a key={c.email} href={`mailto:${c.email}`} title={c.email} className="inline-flex items-center gap-1.5 h-8 pl-1 pr-2.5 rounded-full border border-slate-200 bg-white hover:border-slate-300 hover:shadow-sm"><span className="w-6 h-6 rounded-full flex items-center justify-center text-[10.5px] font-bold text-white" style={{ background: curCat.color }}>{String(c.name || c.email).slice(0, 1).toUpperCase()}</span><span className="text-slate-700 max-w-[110px] truncate">{c.name}</span></a>)}
                  {curCat.contacts.length > 2 && <button onClick={() => setContactOpen(true)} className="h-8 px-2.5 rounded-full border border-slate-200 bg-white text-slate-500 hover:text-slate-800">+{curCat.contacts.length - 2}</button>}
                </div>) : null} />
            )}
            {showSetup && <SetupNotice status={listStatus} infoToo={tab === "overview" || T365_ADMIN_TABS.includes(tab)} />}
            {!showSetup && postsErr && (
              <div className="rounded-xl border px-4 py-3 mb-5 text-sm bg-amber-50 border-amber-200 text-amber-900 flex items-center gap-2" data-testid="board-unavailable"><AlertTriangle size={16} className="text-amber-500 shrink-0" />게시판을 준비하고 있습니다. 잠시 후 다시 확인해 주세요.</div>
            )}
            {!hasLoadedOnce ? (
              <div className="bg-white rounded-xl border border-slate-200 py-16 text-center text-slate-400 text-sm"><div className="w-6 h-6 mx-auto mb-2 rounded-full border-2 border-slate-200 animate-spin" style={{ borderTopColor: BRAND.accent }}></div>불러오는 중...</div>
            ) : !tabAllowed(tab) ? (
              <div className="bg-white rounded-xl border p-10 text-center"><ShieldCheck size={28} className="mx-auto text-slate-300 mb-2" /><div className="text-slate-500 text-sm">이 화면에 대한 접근 권한이 없습니다.</div></div>
            ) : (
              <>
                {tab === "overview" && <OverviewTab ctx={ctx} openPost={(p) => setTab("overview", String(p.id))} openId={openPostId} setOpenId={setOpenId} setTab={(t) => { if (tabAllowed(t)) setTab(t); }} onSearch={openSearch} banners={parseBanners(bannerRows)} onManageBanners={canEditMenu("categories") ? () => setTab("categories") : null} />}
                {(tab === "all" || tab.startsWith("cat:")) && <BoardTab ctx={ctx} catKey={tab === "all" ? null : tab.slice(4)} openId={openPostId} setOpenId={setOpenId} seed={tab === "all" ? boardSeed : null} onSeedUsed={() => setBoardSeed(null)} />}
                {tab === "status" && <ConfirmStatusTab ctx={ctx} openPost={openPost} />}
                {tab === "users" && <UsersTab ctx={ctx} users={users} bootstrap={boot.isBootAdmin} accessRows={accessRows} listStatus={listStatus} reload={reload} />}
                {tab === "categories" && <CategoriesTab ctx={ctx} catRows={catRows} bannerRows={bannerRows} listStatus={listStatus} reload={reload} />}
                {tab === "access" && <AccessLogTab ctx={ctx} />}
                {tab === "activity" && <ActivityLogTab />}
              </>
            )}
            <div className="text-center mt-10 pt-5 border-t border-slate-200 text-[11px] text-slate-400 leading-relaxed">
              <div>© 2026 Star Truck Korea · Training365</div>
              <div>This system is internally developed by Star Truck Korea IT Dept. Unauthorized access is strictly prohibited.</div>
            </div>
          </div>
        </main>
      </div>
      {contactOpen && <ContactModal ctx={ctx} onClose={() => setContactOpen(false)} />}
      {!contactOpen && <HelpFab ctx={ctx} />}
      {loading && hasLoadedOnce && <div className="fixed top-3 left-1/2 -translate-x-1/2 z-[80] bg-slate-800 text-white text-xs px-3 py-1.5 rounded-full shadow-lg" role="status">새로 불러오는 중...</div>}
    </div>
  );
}

// 권한 없음 — MKQR · SSC 와 같은 카드. 등록되지 않은 계정은 관리자에게 등록 요청, 목록을 못 읽으면 다시 시도
// 권한 없음 화면 — ICS · MKQR 과 같은 카드(아이콘 · 이름 · 부제 · 「🔒 접근 권한 없음」 상자 · ITSM 안내 · 문의 메일 · 📬 돌아가기)
function AccessDenied({ ident, reason, contact }) {
  const retry = reason === "users-error";
  const internal = ident && !ident.isGuest && !isExternalEmail(ident.email);
  const mail = contact || t365ItMail();
  const btn = { textDecoration: "none", display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 10, background: "#0078d4", color: "#fff", border: "none", borderRadius: 10, padding: "15px 44px", fontSize: "1.05rem", fontWeight: 700, cursor: "pointer", fontFamily: "inherit", boxShadow: "0 4px 14px rgba(0,120,212,.25)" };
  const lead = reason === "inactive" ? <>이 계정은 <strong>사용 중지</strong> 상태입니다.</>
    : <>Training365 는 <strong>허가받은 Sales Agent 와 본사 담당자</strong>만 접근 가능합니다.</>;
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "center", minHeight: "100vh", padding: 16, boxSizing: "border-box", background: "linear-gradient(145deg,#0f2744 0%,#0078d4 100%)" }} data-testid="access-denied" data-reason={reason}>
      <div style={{ background: "#fff", borderRadius: 24, padding: "64px 56px 52px", textAlign: "center", boxShadow: "0 24px 60px rgba(0,0,0,.22)", maxWidth: 500, width: "100%", boxSizing: "border-box" }}>
        <div style={{ fontSize: "3.6rem", lineHeight: 1, marginBottom: 26 }}>📚</div>
        <div style={{ fontSize: "1.55rem", fontWeight: 800, color: "#0f2744", marginBottom: 12, letterSpacing: "-.01em" }}>Training365</div>
        <div style={{ fontSize: "1rem", color: "#0078d4", fontWeight: 600, marginBottom: 28 }}>Sales Training Portal · Star Truck Korea</div>
        <div style={{ background: "#f8faff", borderRadius: 14, padding: "24px 26px", marginBottom: 30, textAlign: "left", border: "1px solid #e0eaff" }}>
          <div style={{ fontSize: "1.08rem", fontWeight: 700, color: "#1e3a5f", marginBottom: 12 }}>{retry ? "⚠️ 권한 확인 실패" : "🔒 접근 권한 없음"}</div>
          <div style={{ fontSize: ".98rem", color: "#374151", lineHeight: 1.85, wordBreak: "keep-all" }}>
            {retry ? <>권한 정보를 불러오지 못했습니다.<br />잠시 후 다시 시도해 주세요.</> : <>
              {lead}<br /><br />
              권한 신청은 아래 시스템을 이용해 주세요.<br />
              <a href={T365_ITSM_URL} target="_blank" rel="noopener noreferrer" style={{ color: "#0078d4", fontWeight: 600, textDecoration: "none" }} data-testid="denied-itsm">{T365_ITSM_URL.replace(/^https:\/\//, "")}</a>
            </>}
          </div>
        </div>
        <div style={{ fontSize: ".95rem", color: "#94a3b8", marginBottom: 26 }}>문의: <a href={`mailto:${mail}`} style={{ color: "#0078d4", textDecoration: "none" }} data-testid="denied-contact">{mail}</a></div>
        {retry ? <button onClick={() => window.location.reload()} style={btn}>🔄 다시 시도</button>
          : internal ? <a href="https://aps.startruckkorea.com/" target="_self" style={btn} data-testid="denied-back"><span style={{ fontSize: "1.15rem", lineHeight: 1 }}>📬</span><span>돌아가기</span></a>
          : <button onClick={t365Logout} style={btn} data-testid="denied-back" title="로그아웃하고 처음 화면으로"><span style={{ fontSize: "1.15rem", lineHeight: 1 }}>📬</span><span>돌아가기</span></button>}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* 시작 — 로그인 → 「권한 확인」 화면 → /me · 사이트 · 설정 · 사용자 목록 → 판정 → 통과한 계정에만 앱    */
/* 판정 전에는 아무 내용도 보이지 않는다(SSC · MKQR 과 같음). 판정 규칙(fail-closed):                       */
/*  · training365_Users 에 등록 · 사용 중 · 역할이 4개 중 하나여야만. 목록을 못 읽으면 막는다                */
/*  · 설정 파일은 문의 메일(TRAINING365_CONTACT)만 읽는다 · 목록에 관리자가 없을 때만 비상 관리자          */
/* ------------------------------------------------------------------ */
async function t365Boot(account) {
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("loading").style.display = "flex";
  let me = null;
  try { me = await apiGet("/me?$select=mail,userPrincipalName,otherMails,userType,displayName"); } catch (e) { console.warn("[Training365] /me 조회 실패:", e.message); }
  const ident = buildIdentity(account, me);
  _tLogUser = { email: ident.email, name: ident.shortName };
  try {
    const site = await apiGet(`/sites/${SITE_PATH}`);
    _siteId = site.id;
  } catch (e) {
    document.getElementById("loading").style.display = "none";
    document.getElementById("login-screen").style.display = "flex";
    showLoginErr("연결에 실패했습니다 — 권한이 없거나 네트워크 오류입니다. 계속되면 " + T365_IT_MAIL + " 로 문의해 주세요.");
    return;
  }
  const wrap = (pr) => pr.then((v) => ({ v }), (e) => ({ e }));
  const [usersR, contactR] = await Promise.all([wrap(tListAll(T365_LISTS.users)), wrap(loadContactMail())]);
  if (contactR.e) console.warn("[Training365] 문의 메일(TRAINING365_CONTACT · TRAINING365_IT) 읽기 실패 — 기본 IT 메일로 대신:", contactR.e.message);
  else Object.assign(T365_MAILS, contactR.v);
  const users = usersR.v || [];
  // 비상 관리자 — 목록을 읽었고 사용 중인 「관리자」 가 아무도 없을 때만(목록을 못 읽으면 fail-closed)
  const listHasAdmin = users.some((u) => u.Role === "관리자" && u.Active !== false && normEmail(u.Email));
  const isBootAdmin = !usersR.e && !listHasAdmin && ident.ids.some((id) => T365_BOOTSTRAP_ADMINS.includes(id));
  const mine = users.filter((u) => ident.ids.includes(normEmail(u.Email)));
  const myRow = mine.find((u) => u.Active !== false) || mine[0] || null;
  let role = null, reason = "";
  if (isBootAdmin) role = "관리자";
  else if (usersR.e) reason = "users-error";
  else if (!myRow) reason = "not-registered";
  else if (myRow.Active === false) reason = "inactive";
  else if (!T365_ROLES.includes(myRow.Role)) reason = "no-role";
  else role = myRow.Role;
  const email = myRow ? normEmail(myRow.Email) : ident.email;
  const company = (myRow && myRow.Company) || "";
  _tLogUser = { email, name: (myRow && myRow.Title) || ident.shortName };
  // 접속 기록 — 통과 · 차단 모두. 기록 실패(목록 없음 · 권한)는 화면을 막지 않는다
  try { await T365Session.start({ email, name: (myRow && myRow.Title) || ident.shortName, role: role || "", company }); }
  catch (e) { console.warn("[Training365] 접속 기록 실패:", e.message); }
  const loadingEl = document.getElementById("loading"); if (loadingEl) loadingEl.remove();
  const root = createRoot(document.getElementById("root"));
  if (!role) { root.render(<AccessDenied ident={{ ...ident, email }} reason={reason} contact={T365_MAILS.contact} />); return; }
  T365Session.startTimers();
  root.render(<App boot={{ me: { ...ident, email, name: (myRow && myRow.Title) || ident.shortName, company }, role, isBootAdmin, users, usersLoaded: !usersR.e, myRow }} />);
}

// 확인 · 알림 창(DialogHost)은 앱 · 권한 없음 화면과 따로 한 번만 붙인다 — 어느 화면에서든 uiConfirm/uiAlert 가 같은 모양으로 뜬다
(function mountDialogs() { const el = document.createElement("div"); el.id = "t365-dialogs"; document.body.appendChild(el); createRoot(el).render(<><DialogHost /><ToastHost /></>); })();

// 시험용 — 테스트 하네스가 window.T365_TEST_HOOKS 를 켰을 때만 쓰기 함수를 노출(편집 권한 없는 강제 쓰기가 막히는지 확인)
if (window.T365_TEST_HOOKS) window.__t365 = { tCreate, tUpdate, tDelete, tUploadFile };

(async function initMsal() {
  const btn = document.getElementById("btn-login");
  try {
    await msalApp.initialize();
    const resp = await msalApp.handleRedirectPromise();
    if (resp && resp.account) { msalApp.setActiveAccount(resp.account); await t365Boot(resp.account); return; }
    const accounts = msalApp.getAllAccounts();
    if (accounts.length) { msalApp.setActiveAccount(accounts[0]); await t365Boot(accounts[0]); return; }
    if (btn) { btn.disabled = false; btn.textContent = "Microsoft 365 계정으로 로그인"; }
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = "Microsoft 365 계정으로 로그인"; }
    showLoginErr(e.message);
  }
})();

document.getElementById("btn-login").onclick = async () => {
  try {
    if (window !== window.top) { window.open(window.location.href, "_blank"); return; }
    await msalApp.loginRedirect({ scopes: MSAL_SCOPES, prompt: "select_account" });
  } catch (e) { showLoginErr(e.message); }
};
</script>
