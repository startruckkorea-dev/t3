            <h1 className="text-[18px] md:text-[20px] font-bold text-slate-900 leading-[1.4] tracking-[-0.015em] break-words" data-testid="post-title">{post.Title}</h1>
            {/* 작성자 카드 + 오른쪽 숫자 칩 */}
            <div className="mt-4 flex items-center gap-3 flex-wrap" data-testid="meta-bar">
              <span className="w-9 h-9 rounded-full flex items-center justify-center text-[14px] font-bold text-white shrink-0 ring-2 ring-white shadow-sm" style={{ background: cat ? cat.color : BRAND.accent }}>{String(post.AuthorName || "?").trim().slice(0, 1).toUpperCase()}</span>
              <div className="min-w-0 leading-tight">
                <div className="text-[13.5px] font-semibold text-slate-800">{post.AuthorName || "-"}</div>
                <div className="text-[11.5px] text-slate-500 tabular-nums mt-0.5">{fmtDate(post.PublishedAt || post._created)}{post.UpdatedAt && <span className="text-slate-400"> · 수정 {fmtDate(post.UpdatedAt)}</span>}</div>
              </div>
              <div className="sm:ml-auto flex items-center gap-1.5 flex-wrap">
                <span className="inline-flex items-center gap-1 h-7 px-2.5 rounded-full bg-white border border-slate-200 text-[12px] text-slate-600 tabular-nums" title="열어 본 횟수의 합 — 같은 사람이 다시 열어도 1씩 늘어납니다"><Eye size={13} className="text-slate-400" />조회 <b className="text-slate-800" data-testid="meta-views">{vs.views}</b></span>
                {files.length > 0 && <button onClick={() => { const el = scrollRef.current && scrollRef.current.querySelector("[data-testid=attachments]"); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }} className="inline-flex items-center gap-1 h-7 px-2.5 rounded-full bg-white border border-slate-200 text-[12px] text-slate-600 hover:border-[#9CCBC8] hover:text-[#2F7B7A]" data-testid="meta-files"><Paperclip size={13} className="text-slate-400" />첨부 <b className="text-slate-800">{files.length}</b></button>}
                {ctx.isAgent && (post.RequireConfirm || confirmed) && <span className={`inline-flex items-center gap-1 h-7 px-2.5 rounded-full text-[12px] font-semibold ${confirmed ? "bg-emerald-50 text-emerald-700 border border-emerald-200" : "bg-orange-50 text-orange-700 border border-orange-200"}`} data-testid="meta-mine">{confirmed ? <><CheckCircle2 size={13} />확인 완료</> : <><BellRing size={12} />확인 필요</>}</span>}
              </div>
            </div>
          </header>

          {/* 본문 */}
          <section className="flex-1 px-5 md:px-10 py-6 md:py-7 min-h-[180px]">
            <div className="max-w-[760px]" data-testid="post-body"><RichText text={post.Body} /></div>
            {(vurl || vfile) && (
              <div className="max-w-[760px] mt-7">
                {yt ? (
                  <div className="aspect-video w-full rounded-xl overflow-hidden bg-black shadow-sm" data-testid="video-frame">
                    <iframe className="w-full h-full" src={`https://www.youtube-nocookie.com/embed/${yt}`} title="동영상" allow="encrypted-media; picture-in-picture; fullscreen" allowFullScreen referrerPolicy="strict-origin-when-cross-origin"></iframe>
                  </div>
                ) : vurl ? (
                  <a href={vurl} target="_blank" rel="noopener noreferrer" className="flex items-center gap-3 px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-sm text-slate-700">
                    <span className="w-9 h-9 rounded-lg flex items-center justify-center shrink-0 bg-white border border-slate-200"><PlayCircle size={18} style={{ color: BRAND.accent }} /></span>
                    <span className="min-w-0 flex-1"><span className="block font-medium truncate">동영상 보기</span><span className="block text-[11.5px] text-slate-400 truncate">{new URL(vurl).hostname}</span></span>
                    <ExternalLink size={14} className="text-slate-400 shrink-0" />
                  </a>
                ) : null}
                {vfile && (videoSrc ? (
                  <video src={videoSrc} controls className="w-full aspect-video rounded-xl bg-black mt-2" preload="metadata"></video>
                ) : (
                  <button onClick={playVideo} className="mt-2 w-full aspect-video rounded-xl bg-slate-900 text-white flex flex-col items-center justify-center gap-2 hover:bg-slate-800">
                    <PlayCircle size={42} className="text-white/90" /><span className="text-[13px] text-white/80 px-4 truncate max-w-full">{vfile.name} · {fmtSize(vfile.size)}</span>
                  </button>
                ))}
              </div>
            )}
          </section>

          {/* 첨부 — 머리 줄이 있는 상자 + 파일 한 줄씩(옅은 선) */}
          {files.length > 0 && (
            <section className="px-5 md:px-10 pt-1 pb-4" data-testid="attachments">
              <div className="rounded-xl border border-slate-200 overflow-hidden bg-white">
                <div className="px-4 h-10 flex items-center gap-2 bg-slate-50 border-b border-slate-200 text-[12.5px]">
                  <Paperclip size={14} className="text-slate-500" /><span className="font-semibold text-slate-700">첨부파일</span>
                  <span className="text-[11px] font-bold px-1.5 rounded-full leading-[18px] text-white tabular-nums" style={{ background: BRAND.accent }}>{files.length}</span>
                  <span className="ml-auto text-slate-400 tabular-nums">{fmtSize(totalSize)}</span>
                </div>
                <ul>
                  {files.map((f) => { const k = fileKind(f.name); return (
                    <li key={f.itemId} className="border-t border-slate-100 first:border-t-0">
                      <button onClick={() => tDownload(f)} title={`${f.name} 내려받기`} className="group w-full flex items-center gap-3 px-4 h-11 hover:bg-[#F3F8F8] text-left min-w-0" data-file={f.itemId}>
                        <span className="w-7 h-7 rounded-md flex items-center justify-center shrink-0" style={{ background: k.bg }}><k.Icon size={14} style={{ color: k.c }} /></span>
                        <span className="min-w-0 flex-1 truncate text-[13px] text-slate-700 group-hover:text-slate-900">{f.name}</span>
                        <span className="shrink-0 text-[11.5px] text-slate-400 tabular-nums">{fileExt(f.name).toUpperCase() || "FILE"} · {fmtSize(f.size)}</span>
                        <span className="shrink-0 inline-flex items-center gap-1 h-7 px-2.5 rounded-md text-[12px] text-slate-500 border border-slate-200 group-hover:text-white group-hover:border-transparent group-hover:bg-[#2F7B7A] transition-colors"><Download size={12} />받기</span>
                      </button>
                    </li>
                  ); })}
                </ul>
              </div>
            </section>
          )}

          {/* 조회확인 현황(본사 · 관리) — 한 줄, 누르면 명단 */}
          {showRate && <section className="px-5 md:px-10 pt-1 pb-5"><ConfirmPanel ctx={ctx} post={post} /></section>}

          {/* 이전글 · 다음글 */}
          {(newer || older) && <nav className="border-t border-slate-200 text-[13px]" data-testid="prev-next">
            {[["다음글", newer, ChevronUp], ["이전글", older, ChevronDown]].filter((x) => x[1]).map(([label, p, I]) => (
              <button key={label} disabled={!p} onClick={() => p && onOpen(p.id)} data-nav-post={label} title={p ? p.Title : undefined} className="w-full flex items-center gap-3 px-5 md:px-10 h-10 border-t border-slate-100 first:border-t-0 text-left hover:bg-slate-50 disabled:hover:bg-white disabled:cursor-default min-w-0">
                <span className="inline-flex items-center gap-1 text-slate-400 w-14 shrink-0 text-[12px]"><I size={13} />{label}</span>
                {p ? <><span className="truncate flex-1 text-slate-700">{p.Title}</span><PostMarks p={p} compact /><span className="text-[11.5px] text-slate-400 tabular-nums shrink-0 hidden sm:inline">{fmtDay(p.PublishedAt || p._created).slice(2).replace(/-/g, ".")}</span></>
                  : <span className="text-slate-300 flex-1 text-[12.5px]">{label === "다음글" ? "다음 글이 없습니다" : "이전 글이 없습니다"}</span>}
              </button>
            ))}
          </nav>}
        </article>
      </div>

      {/* 아래 띠 — Agent 의 조회확인 필수 글은 열면 자동 확인(상태만 보여 줌), 그 밖은 목록 단추만 */}
      {(() => {
        const showState = ctx.isAgent && (post.RequireConfirm || confirmed);
        const tone = !showState ? "bg-slate-50/80 border-slate-100" : confirmed ? "bg-emerald-50/70 border-emerald-100" : autoState === "error" ? "bg-red-50/70 border-red-100" : "bg-orange-50/70 border-orange-100";
        return (
          <div className={`shrink-0 px-4 md:px-6 py-3 border-t flex items-center gap-3 ${tone}`} data-testid={ctx.isAgent ? "confirm-box" : "post-footer"}>
            {showState ? (confirmed ? (
              <div className="flex items-center gap-2.5 min-w-0 flex-1">
                <CheckCircle2 size={20} className="text-emerald-600 shrink-0" />
                <div className="min-w-0"><div className="text-[13.5px] font-semibold text-emerald-800" data-testid="confirmed-label">조회확인 완료</div><div className="text-[11.5px] text-emerald-700/80 tabular-nums truncate">{fmtDate(mine.ConfirmedAt)} 에 확인되었습니다</div></div>
              </div>
            ) : autoState === "error" ? (
              <div className="flex items-center gap-2.5 min-w-0 flex-1">
                <AlertTriangle size={18} className="text-red-500 shrink-0" />
                <div className="min-w-0"><div className="text-[13.5px] font-semibold text-red-700">조회확인을 기록하지 못했습니다</div><div className="text-[11.5px] text-red-600/80 truncate">네트워크를 확인한 뒤 「다시 기록」을 눌러 주세요.</div></div>
              </div>
            ) : (
              <div className="flex items-center gap-2.5 min-w-0 flex-1 text-orange-800">
                <span className="w-4 h-4 rounded-full border-2 border-orange-200 border-t-orange-600 animate-spin shrink-0"></span>
                <span className="text-[13px] font-medium">조회확인을 기록하고 있습니다...</span>
              </div>
            )) : <span className="flex-1"></span>}
            <button onClick={onBack} className={`${btnCls} shrink-0`} data-testid="btn-list"><LayoutList size={14} /> 목록</button>
            {showState && !confirmed && autoState === "error" && (
              <button onClick={confirmRead} disabled={busy} data-testid="btn-confirm" className="h-10 px-4 rounded-xl text-[14px] font-semibold text-white shadow-sm disabled:opacity-60 inline-flex items-center gap-1.5 shrink-0" style={{ background: "#C2410C" }}>
                <CheckCircle2 size={16} /> {busy ? "저장 중..." : "다시 기록"}
              </button>
            )}
          </div>
        );
      })()}
      {deleting && <BlockingOverlay message="삭제하고 있습니다..." />}
    </PostModalShell>
  );
}

// 게시물 하나의 조회확인 현황(접기) — 대상은 Agent 역할 사용자만(회의록: 본사 제외). 열람한 사람은 역할과 관계없이 따로
function ConfirmPanel({ ctx, post }) {
  const s = confirmStats(post, ctx.readIdx, ctx.agents);
  const [openP, setOpenP] = useState(false);
  const [view, setView] = useState(post.RequireConfirm ? "pending" : "all");
  const [q, setQ] = useState("");
  const [showViewers, setShowViewers] = useState(false);
  const qq = q.trim().toLowerCase();
  const uMap = new Map(ctx.users.map((u) => [normEmail(u.Email), u]));
  const viewers = [...((ctx.readIdx.get(String(post.id)) || new Map()).values())].map((r) => { const u = uMap.get(normEmail(r.UserEmail)) || {}; return { ...r, name: r.UserName || u.Title || r.UserEmail, role: u.Role || r.Role || "", company: r.Company || u.Company || "" }; })
    .sort((a, b) => String(b.LastViewedAt || "").localeCompare(String(a.LastViewedAt || "")));
  const rows = s.rows
    .filter((x) => view === "all" ? true : view === "done" ? !!x.confirmedAt : !x.confirmedAt)
    .filter((x) => !qq || [x.user.Title, x.user.Email, x.user.Company].some((v) => String(v || "").toLowerCase().includes(qq)))
    .sort((a, b) => (a.confirmedAt ? 0 : 1) - (b.confirmedAt ? 0 : 1) || String(a.confirmedAt).localeCompare(String(b.confirmedAt)) || String(a.user.Company || "").localeCompare(String(b.user.Company || "")) || String(a.user.Title || "").localeCompare(String(b.user.Title || "")));
  function exportExcel() {
    const data = s.rows.map((x, i) => ({ 번호: i + 1, 이름: x.user.Title || "", 메일: x.user.Email || "", "회사/지점": x.user.Company || "", 조회확인: x.confirmedAt ? "확인" : "미확인", "확인 시각(KST)": x.confirmedAt ? fmtDate(x.confirmedAt) : "", "첫 열람(KST)": x.viewedAt ? fmtDate(x.viewedAt) : "" }));
    const vw = viewers.map((v, i) => ({ 번호: i + 1, 이름: v.name, 메일: v.UserEmail, 역할: v.role, "회사/지점": v.company, "첫 열람(KST)": fmtDate(v.FirstViewedAt), "마지막 열람(KST)": fmtDate(v.LastViewedAt), "열람 횟수": Number(v.ViewCount) || 1, 조회확인: v.ConfirmedAt ? fmtDate(v.ConfirmedAt) : "" }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(data.length ? data : [{ 안내: "확인 대상 Agent 가 없습니다" }]), "조회확인");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(vw.length ? vw : [{ 안내: "열람 기록이 없습니다" }]), "열람한 사람");
    XLSX.writeFile(wb, `Training365_조회확인_${post.id}_${kstToday()}.xlsx`);
    t365Log("조회확인", "Excel 내보내기", post.Title, { info: { 확인: `${s.done}/${s.total}`, 열람: viewers.length } });
  }
  return (
    <section className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden" data-testid="confirm-panel">
      <button onClick={() => setOpenP((v) => !v)} aria-expanded={openP} className="w-full px-4 py-3 flex items-center gap-4 text-left hover:bg-slate-50/70 transition-colors" data-testid="confirm-toggle" title="조회확인은 Agent 역할만 대상입니다 — 본사 · 관리자는 열람한 사람에만 보입니다">
        {/* 왼쪽 — 확인율 고리 */}
        <span className="relative w-11 h-11 shrink-0" aria-hidden="true">
          <svg viewBox="0 0 36 36" className="w-11 h-11 -rotate-90"><circle cx="18" cy="18" r="15.5" fill="none" stroke="#E2E8F0" strokeWidth="3.5" />
            {s.total > 0 && <circle cx="18" cy="18" r="15.5" fill="none" stroke={pctColor(s.pct)} strokeWidth="3.5" strokeLinecap="round" strokeDasharray={`${(s.pct / 100) * 97.4} 97.4`} />}</svg>
          <span className="absolute inset-0 flex items-center justify-center">{s.total ? <span className="text-[10.5px] font-bold tabular-nums" style={{ color: pctColor(s.pct) }}>{s.pct}%</span> : <CheckCircle2 size={15} className="text-slate-300" />}</span>
        </span>
        <span className="min-w-0 flex-1" data-testid="confirm-rate">
          <span className="block text-[13.5px] font-semibold text-slate-800">조회확인 현황</span>
          <span className="block text-[12px] text-slate-500 mt-0.5">{s.total
            ? <>Agent <b className="tabular-nums" style={{ color: pctColor(s.pct) }}>{s.done}</b><span className="tabular-nums"> / {s.total}명 확인</span>{s.total - s.done > 0 && <span className="text-orange-700"> · 미확인 {s.total - s.done}명</span>}</>
            : "이 글은 조회확인 대상 Agent 가 없습니다"}</span>
        </span>
        {/* 오른쪽 — 열람 */}
        <span className="shrink-0 hidden sm:flex flex-col items-end leading-tight pl-4 border-l border-slate-200">
          <span className="text-[15px] font-bold text-slate-800 tabular-nums inline-flex items-center gap-1"><Eye size={13} className="text-slate-400" />{viewers.length}<span className="text-[11px] font-normal text-slate-400">명</span></span>
          <span className="text-[10.5px] text-slate-400">열람 · 조회 {viewers.reduce((a, v) => a + (Number(v.ViewCount) || 1), 0)}회</span>
        </span>
        <span className="shrink-0 inline-flex items-center gap-1 h-7 px-2.5 rounded-full border border-slate-200 bg-white text-[11.5px] text-slate-500">{openP ? "접기" : "명단"}<ChevronDown size={13} className={`transition-transform ${openP ? "rotate-180" : ""}`} /></span>
      </button>
      {openP && (
        <div className="border-t border-slate-100">
          {s.total > 0 ? (
            <>
              <div className="px-4 py-2.5 flex items-center gap-2 flex-wrap">
                <div className="flex items-center rounded-lg border border-slate-300 overflow-hidden h-8">
                  {[["pending", `미확인 ${s.total - s.done}`], ["done", `확인 ${s.done}`], ["all", `전체 ${s.total}`]].map(([k, label], i) => (
                    <button key={k} onClick={() => setView(k)} data-view={k} className={`px-3 h-full text-[12.5px] whitespace-nowrap ${i ? "border-l border-slate-300" : ""} ${view === k ? "text-white" : "text-slate-600 bg-white hover:bg-slate-50"}`} style={view === k ? { background: BRAND.accent } : undefined}>{label}</button>
                  ))}
                </div>
                <div className="relative flex-1 min-w-[150px] max-w-xs">
                  <Search size={14} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400" />
                  <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="이름 · 메일 · 회사 검색" className="h-8 w-full border border-slate-300 rounded-lg text-[12.5px] bg-white pl-8 pr-3 focus:outline-none focus:ring-2 focus:ring-[#2F7B7A]/40" />
                </div>
                <button onClick={exportExcel} className={`${btnCls} h-8 ml-auto`}><Download size={13} /> Excel</button>
              </div>
              <div className="overflow-x-auto max-h-[360px] overflow-y-auto border-t border-slate-100">
                <table className="w-full text-[12.5px]" style={{ minWidth: 560 }}>
                  <thead className="bg-slate-50 text-slate-500 text-[11.5px] sticky top-0">
                    <tr>{["이름", "회사/지점", "조회확인", "확인 시각", "첫 열람"].map((h) => <th key={h} className="px-4 py-2 font-medium text-left whitespace-nowrap border-b border-slate-200">{h}</th>)}</tr>
                  </thead>
                  <tbody>
                    {rows.length ? rows.map((x) => (
                      <tr key={x.user.id || x.user.Email} className="border-t border-slate-100 first:border-t-0">
                        <td className="px-4 py-2"><div className="text-slate-800 font-medium">{x.user.Title || "-"}</div><div className="text-[11px] text-slate-400">{x.user.Email}</div></td>
                        <td className="px-4 py-2 text-slate-600">{x.user.Company || "-"}</td>
                        <td className="px-4 py-2">{x.confirmedAt ? <span className="inline-flex items-center gap-1 text-emerald-700 font-medium"><CheckCircle2 size={13} />확인</span> : <span className="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-orange-50 text-orange-700">미확인</span>}</td>
                        <td className="px-4 py-2 text-slate-600 tabular-nums whitespace-nowrap">{x.confirmedAt ? fmtDate(x.confirmedAt) : "-"}</td>
                        <td className="px-4 py-2 text-slate-400 tabular-nums whitespace-nowrap">{x.viewedAt ? fmtDate(x.viewedAt) : "열람 안 함"}</td>
                      </tr>
                    )) : <tr><td colSpan={5} className="text-center text-slate-400 py-8">조회 결과가 없습니다.</td></tr>}
                  </tbody>
                </table>
              </div>
            </>
          ) : (
            <div className="px-4 md:px-5 py-3 text-[12.5px] text-slate-500 flex items-center gap-2 flex-wrap">
              <Users size={14} className="text-slate-300" />확인 대상(Agent)이 없습니다.
              <button onClick={exportExcel} className={`${btnCls} h-8 ml-auto`}><Download size={13} /> Excel</button>
            </div>
          )}
          <div className="border-t border-slate-100">
            <button onClick={() => setShowViewers((v) => !v)} aria-expanded={showViewers} className="w-full px-4 md:px-5 h-10 flex items-center gap-2 text-[12.5px] text-slate-600 hover:bg-slate-50 text-left" data-testid="viewers-toggle">
              <Eye size={14} className="text-slate-400" /><span>열람한 사람 <b className="tabular-nums">{viewers.length}</b>명</span><span className="text-slate-400">· 역할과 관계없이 모두 · 조회 {viewers.reduce((a, v) => a + (Number(v.ViewCount) || 1), 0)}회</span>
              <ChevronDown size={14} className={`ml-auto text-slate-400 transition-transform ${showViewers ? "rotate-180" : ""}`} />
            </button>
            {showViewers && (
              <div className="overflow-x-auto max-h-[320px] overflow-y-auto border-t border-slate-100" data-testid="viewers">
                <table className="w-full text-[12.5px]" style={{ minWidth: 640 }}>
                  <thead className="bg-slate-50 text-slate-500 text-[11.5px] sticky top-0"><tr>{["이름", "역할", "첫 열람", "마지막 열람", "횟수", "조회확인"].map((h) => <th key={h} className="px-4 py-2 font-medium text-left whitespace-nowrap border-b border-slate-200">{h}</th>)}</tr></thead>
                  <tbody>
                    {viewers.length ? viewers.map((v) => (
                      <tr key={v.UserEmail} className="border-t border-slate-100 first:border-t-0" data-viewer={v.UserEmail}>
                        <td className="px-4 py-2"><div className="text-slate-800 font-medium">{v.name}</div><div className="text-[11px] text-slate-400">{v.UserEmail}{v.company ? ` · ${v.company}` : ""}</div></td>
                        <td className="px-4 py-2"><RoleBadge role={v.role} small /></td>
                        <td className="px-4 py-2 text-slate-500 tabular-nums whitespace-nowrap">{fmtDate(v.FirstViewedAt)}</td>
                        <td className="px-4 py-2 text-slate-500 tabular-nums whitespace-nowrap">{fmtDate(v.LastViewedAt)}</td>
                        <td className="px-4 py-2 text-slate-500 tabular-nums">{Number(v.ViewCount) || 1}</td>
                        <td className="px-4 py-2">{v.ConfirmedAt ? <span className="inline-flex items-center gap-1 text-emerald-700"><CheckCircle2 size={12} />{fmtDate(v.ConfirmedAt).slice(5)}</span> : <span className="text-slate-300">{v.role === "Agent" ? "미확인" : "대상 아님"}</span>}</td>
                      </tr>
                    )) : <tr><td colSpan={6} className="text-center text-slate-400 py-6">아직 열람한 사람이 없습니다.</td></tr>}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      )}
    </section>
  );
}

/* ------------------------------------------------------------------ */
/* 글쓰기 · 수정                                                        */
/* ------------------------------------------------------------------ */
// 글쓰기 창 — 왼쪽: 카테고리 · 제목 · 본문(도구 · 쓰기/미리 보기/나란히), 오른쪽: 게시 옵션 · 첨부(끌어 놓기) · 목록 미리보기 · 작성 안내.
// Ctrl+Enter = 게시, Esc · ✕ · 바깥 = 닫기(쓴 내용이 있으면 확인). 휴대폰은 위아래로 쌓인다. 동영상 입력은 없앴다(10-12) — 기존 글의 동영상은 보기에서 그대로 재생.
const T365_TITLE_MAX = 200, T365_BODY_MAX = 60000, T365_FILES_MAX = 10;
function PostEditor({ ctx, post, defaultCat, onClose, onSaved }) {
  const writable = ctx.cats.filter((c) => ctx.canWrite(c.key));
  const isEdit = !!(post && post.id);
  const init = isEdit ? post.Category : (defaultCat && ctx.canWrite(defaultCat) ? defaultCat : (writable[0] || {}).key || "");
  const [cat, setCat] = useState(init);
  const [title, setTitle] = useState(isEdit ? post.Title || "" : "");
  const [body, setBody] = useState(isEdit ? post.Body || "" : "");
  const [pinned, setPinned] = useState(isEdit ? !!post.IsPinned : false);
  const [reqConfirm, setReqConfirm] = useState(isEdit ? !!post.RequireConfirm : !!(ctx.catMap[init] && ctx.catMap[init].required));
  const [files, setFiles] = useState(isEdit ? parseFiles(post.AttachmentsJson) : []);
  const [newFiles, setNewFiles] = useState([]);
  const [mode, setMode] = useState("write");
  const [saving, setSaving] = useState("");
  const [drag, setDrag] = useState(false);
  const ta = useRef(null);
  const touchedReq = useRef(isEdit);
  const hasOldVideo = isEdit && !!(safeHttpsUrl(post.VideoUrl) || parseFiles(post.VideoFileJson).length);
  useEffect(() => { if (!touchedReq.current) setReqConfirm(!!(ctx.catMap[cat] && ctx.catMap[cat].required)); }, [cat]);
  useEffect(() => { const t = setTimeout(() => { const el = document.querySelector("[data-testid=ed-title]"); if (el && !isEdit) el.focus(); }, 60); return () => clearTimeout(t); }, []);

  function wrap(before, after, placeholder) {
    const el = ta.current; if (!el) return;
    const s = el.selectionStart, e = el.selectionEnd; const sel = body.slice(s, e) || placeholder;
    setBody(body.slice(0, s) + before + sel + after + body.slice(e));
    setTimeout(() => { el.focus(); el.setSelectionRange(s + before.length, s + before.length + sel.length); }, 0);
  }
  function linePrefix(prefix) {
    const el = ta.current; if (!el) return;
    const s = el.selectionStart, e = el.selectionEnd;
    const ls = body.lastIndexOf("\n", s - 1) + 1;
    const seg = body.slice(ls, e).split("\n").map((l, i) => (prefix === "1. " ? `${i + 1}. ` : prefix) + l.replace(/^(#{1,3}|[-*•]|\d{1,3}[.)]|>)\s+/, "")).join("\n");
    setBody(body.slice(0, ls) + seg + body.slice(e));
    setTimeout(() => el.focus(), 0);
  }
  async function addLink() {
    const u = await uiPrompt("연결할 주소를 입력하세요 (https:// 로 시작)", "https://", { title: "링크 넣기", okText: "넣기" });
    if (u == null) return;
    if (!safeHttpsUrl(u)) { uiAlert("https:// 로 시작하는 주소만 넣을 수 있습니다."); return; }
    wrap("[", `](${safeHttpsUrl(u)})`, "링크 글자");
  }
  function addFiles(list) {
    list = Array.from(list || []);
    const bad = list.filter((f) => T365_BLOCKED_EXT.includes(fileExt(f.name)));
    const big = list.filter((f) => f.size > T365_ATTACH_MAX);
    if (bad.length) uiAlert(`실행 파일 · 웹 문서 형식은 올릴 수 없습니다: ${bad.map((f) => f.name).join(", ")}`);
    if (big.length) uiAlert(`파일 하나는 ${fmtSize(T365_ATTACH_MAX)} 까지 올릴 수 있습니다: ${big.map((f) => f.name).join(", ")}`);
    const ok = list.filter((f) => !bad.includes(f) && !big.includes(f));
    if (files.length + newFiles.length + ok.length > T365_FILES_MAX) { uiAlert(`첨부는 한 게시물에 ${T365_FILES_MAX}개까지입니다.`); return; }
    setNewFiles((prev) => [...prev, ...ok]);
  }
  const savingRef = useRef(false);
  async function save() {
    if (savingRef.current) return;
    const t = title.trim();
    if (!cat || !ctx.canWrite(cat)) { uiAlert("글을 쓸 수 있는 카테고리를 골라 주세요."); return; }
    if (!t) { uiAlert("제목을 입력해 주세요."); return; }
    if (t.length > T365_TITLE_MAX) { uiAlert(`제목은 ${T365_TITLE_MAX}자까지 입력할 수 있습니다.`); return; }
    if (!body.trim() && !files.length && !newFiles.length) { uiAlert("본문을 입력하거나 파일을 첨부해 주세요."); return; }
    if (body.length > T365_BODY_MAX) { uiAlert("본문이 너무 깁니다(6만 자까지). 긴 자료는 파일로 첨부해 주세요."); return; }
    savingRef.current = true;
    const failed = [];
    const upAll = async (postId) => {
      const out = [];
      for (let i = 0; i < newFiles.length; i++) {
        setSaving(`파일을 올리는 중입니다 (${i + 1}/${newFiles.length})...`);
        try { out.push(await tUploadFile(newFiles[i], postId, cat, (r) => setSaving(`파일을 올리는 중입니다 (${i + 1}/${newFiles.length}) ${Math.round(r * 100)}%`))); }
        catch (e) { if (e && e.code === "NO_EDIT") throw e; failed.push(`${newFiles[i].name} — ${e.message}`); }
      }
      return out;
    };
    try {
      const now = new Date().toISOString();
      const fields = { Title: t, Category: cat, Body: body, IsPinned: !!pinned, RequireConfirm: !!reqConfirm };
      let id;
      if (isEdit) {
        id = post.id;
        const uploaded = await upAll(id);
        setSaving("저장하고 있습니다...");
        const allFiles = [...files, ...uploaded];
        await tUpdate(T365_LISTS.posts, id, { ...fields, AttachmentsJson: JSON.stringify(allFiles), UpdatedAt: now, UpdatedBy: ctx.me.name }, { prevCat: post.Category });
        const labels = { Title: "제목", Category: "카테고리", IsPinned: "중요", RequireConfirm: "조회확인 필수" };
        const changes = {};
        Object.keys(labels).forEach((k) => { if (String(post[k] == null ? "" : post[k]) !== String(fields[k])) changes[labels[k]] = [post[k] == null ? "" : post[k], fields[k]]; });
        if ((post.Body || "") !== body) changes["본문"] = ["(이전 본문)", "(수정됨)"];
        const before = parseFiles(post.AttachmentsJson).length;
        if (before !== allFiles.length || uploaded.length) changes["첨부"] = [`${before}개`, `${allFiles.length}개`];
        t365Log("게시물", "수정", t, { changes, info: { 게시물ID: id, ...(uploaded.length ? { "첨부 위치": `${T365_ATTACH_LIB}/${T365_ATTACH_ROOT}/${id}` } : {}) } });
      } else {
        setSaving("저장하고 있습니다...");
        // APS 와 같은 순서 — 글(번호)을 먼저 만들고, 그 번호 폴더에 첨부를 올린 뒤 첨부 정보를 붙인다
        const row = await tCreate(T365_LISTS.posts, { ...fields, AttachmentsJson: "[]", AuthorEmail: ctx.me.email, AuthorName: ctx.me.name, PublishedAt: now });
        id = row.id;
        const uploaded = await upAll(id);
        if (uploaded.length) { setSaving("첨부 정보를 저장하고 있습니다..."); await tUpdate(T365_LISTS.posts, id, { AttachmentsJson: JSON.stringify(uploaded), Category: cat }); }
        t365Log("게시물", "등록", t, { info: { 카테고리: (ctx.catMap[cat] || {}).label || cat, 게시물ID: id, 첨부: `${uploaded.length}개`, ...(uploaded.length ? { "첨부 위치": `${T365_ATTACH_LIB}/${T365_ATTACH_ROOT}/${id}` } : {}), 중요: !!pinned, "조회확인 필수": !!reqConfirm } });
      }
      setSaving(""); savingRef.current = false;
      if (failed.length) uiAlert(`게시물은 저장됐지만 첨부 ${failed.length}개를 올리지 못했습니다 — 「수정」에서 다시 첨부해 주세요.\n\n${failed.join("\n")}`);
      onSaved(id, cat);   // 고른 게시판(cat)을 함께 — 다른 게시판에 올렸으면 그 게시판으로 가서 연다
    } catch (e) { setSaving(""); savingRef.current = false; uiAlert(e.message); }
  }
  const closingRef = useRef(false);
  async function requestClose() {
    if (saving || closingRef.current) return;
    const touched = isEdit ? (title !== (post.Title || "") || body !== (post.Body || "") || newFiles.length || files.length !== parseFiles(post.AttachmentsJson).length) : (title.trim() || body.trim() || newFiles.length);
    if (!touched) { onClose(); return; }
    closingRef.current = true;
    const ok = await uiConfirm("작성 중인 내용을 닫을까요? 저장하지 않은 내용은 사라집니다.", { title: "작성 중인 글 닫기", okText: "닫기", cancelText: "계속 쓰기", danger: true });
    closingRef.current = false;
    if (ok) onClose();
  }
  // Ctrl+Enter(맥은 ⌘+Enter) = 게시
  useEffect(() => {
    const k = (e) => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter" && !document.querySelector("[data-testid=ui-dialog]")) { e.preventDefault(); save(); } };
    window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k);
  });

  const curCat = ctx.catMap[cat];
  const CatIcon = (curCat && curCat.icon) || FileText;
  const allCount = files.length + newFiles.length;
  const totalSize = files.reduce((a, f) => a + (Number(f.size) || 0), 0) + newFiles.reduce((a, f) => a + f.size, 0);
  const tb = "w-8 h-8 rounded-md flex items-center justify-center text-slate-500 hover:bg-white hover:text-slate-900 hover:shadow-sm";
  const Switch = ({ on, onChange, testid, label, desc, tint }) => (
    <label className="flex items-start gap-3 cursor-pointer select-none py-2">
      <input type="checkbox" checked={on} onChange={(e) => onChange(e.target.checked)} className="sr-only peer" data-testid={testid} />
      <span className="mt-0.5 w-9 h-5 rounded-full relative shrink-0 transition-colors peer-focus-visible:ring-2 peer-focus-visible:ring-[#2F7B7A]/40" style={{ background: on ? (tint || BRAND.accent) : "#CBD5E1" }}>
        <span className="absolute top-0.5 w-4 h-4 rounded-full bg-white shadow transition-all" style={{ left: on ? 18 : 2 }}></span>
      </span>
      <span className="min-w-0"><span className="block text-[13px] font-medium text-slate-800">{label}</span><span className="block text-[11.5px] text-slate-500 leading-snug mt-0.5">{desc}</span></span>
    </label>
  );
  const Card = ({ title: t2, icon: I, right, children }) => (
    <section className="bg-white rounded-xl border border-slate-200">
      <div className="px-3.5 h-10 flex items-center gap-2 border-b border-slate-100"><I size={14} className="text-slate-400" /><span className="text-[12.5px] font-semibold text-slate-700">{t2}</span><span className="ml-auto">{right}</span></div>
      <div className="px-3.5 py-2.5">{children}</div>
    </section>
  );
  const FileRow = ({ f, isNew, onRemove }) => { const k = fileKind(f.name); return (
    <div className="flex items-center gap-2.5 py-1.5">
      <span className="w-7 h-7 rounded-md flex items-center justify-center shrink-0" style={{ background: k.bg }}><k.Icon size={14} style={{ color: k.c }} /></span>
      <span className="min-w-0 flex-1"><span className="block text-[12.5px] text-slate-700 truncate" title={f.name}>{f.name}</span><span className="block text-[10.5px] text-slate-400">{fmtSize(f.size)}{isNew && <span className="ml-1.5 text-emerald-600 font-medium">새 파일</span>}</span></span>
      <button onClick={onRemove} className="w-6 h-6 rounded-md flex items-center justify-center text-slate-300 hover:text-red-600 hover:bg-red-50 shrink-0" aria-label={`첨부 빼기 ${f.name}`}><X size={13} /></button>
    </div>
  ); };
  const preview = (
    <div className="t365-body max-w-none"><RichText text={body} /></div>
  );

  return (
    <PostModalShell onClose={requestClose} label={isEdit ? "게시물 수정" : "글쓰기"} zClass="z-[60]" panelClass="md:max-w-[1180px] md:h-[min(92vh,900px)]" testid="editor" suspended={!!saving}>
      {/* 머리 */}
      <div className="shrink-0 h-1 transition-colors duration-300" style={{ background: curCat ? `linear-gradient(90deg, ${curCat.color}, ${curCat.color}55)` : BRAND.accent }} aria-hidden="true"></div>
      <div className="shrink-0 h-14 px-4 md:px-6 flex items-center gap-3 border-b border-slate-100">
        <span className="w-9 h-9 rounded-xl flex items-center justify-center shrink-0 transition-colors duration-300" style={{ background: curCat ? curCat.soft : BRAND.accentSoft }} data-testid="ed-head-icon"><CatIcon size={17} style={{ color: curCat ? curCat.color : BRAND.accent }} /></span>
        <div className="min-w-0 flex-1 leading-tight">
          <div className="text-[15px] font-semibold text-slate-800">{isEdit ? "게시물 수정" : "글쓰기"}</div>
          <div className="text-[11.5px] text-slate-400 truncate hidden sm:block">{isEdit ? `${post.AuthorName || ""} · ${fmtDate(post.PublishedAt || post._created)} 게시` : (curCat ? `${curCat.label} 게시판에 올립니다 — 제목 · 본문을 쓰고 「게시」를 누르세요` : "게시판 · 제목 · 본문을 쓰고 「게시」를 누르세요")}</div>
        </div>
        <button onClick={requestClose} aria-label="닫기" title="닫기 (Esc)" className="w-9 h-9 rounded-lg flex items-center justify-center text-slate-400 hover:text-slate-800 hover:bg-slate-100"><X size={19} /></button>
      </div>

      <div className="flex-1 min-h-0 flex flex-col md:flex-row overflow-y-auto md:overflow-hidden">
        {/* 왼쪽 — 본문 */}
        <div className="flex-1 min-w-0 flex flex-col p-4 md:p-6 gap-4 md:overflow-y-auto">
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div className="sm:col-span-2">
              <label className="block text-[12px] font-medium text-slate-500 mb-1.5">게시판 <span className="text-red-500">*</span></label>
              <div className="flex flex-wrap gap-1.5" role="radiogroup" aria-label="게시판" data-testid="ed-cat">
                {writable.map((c) => { const on = c.key === cat; const I = c.icon || FileText; return (
                  <button key={c.key} type="button" role="radio" aria-checked={on} onClick={() => setCat(c.key)} data-ed-cat={c.key}
                    className={`h-9 pl-1.5 pr-3 rounded-full border inline-flex items-center gap-2 text-[13px] transition-all ${on ? "font-semibold shadow-sm" : "border-slate-200 text-slate-600 hover:border-slate-300 hover:bg-slate-50"}`}
                    style={on ? { background: c.soft, borderColor: c.color, color: c.color } : undefined}>
                    <span className="w-6 h-6 rounded-full flex items-center justify-center" style={{ background: on ? "#fff" : c.soft }}><I size={13} style={{ color: c.color }} /></span>{c.label}
                  </button>
                ); })}
              </div>
            </div>
            <div className="sm:col-span-2">
              <label className="flex items-center text-[12px] font-medium text-slate-500 mb-1">제목 <span className="text-red-500 ml-0.5">*</span><span className={`ml-auto tabular-nums text-[11px] ${title.length > T365_TITLE_MAX * 0.9 ? "text-amber-600" : "text-slate-400"}`} data-testid="ed-title-count">{title.length} / {T365_TITLE_MAX}</span></label>
              <input value={title} onChange={(e) => setTitle(e.target.value)} maxLength={T365_TITLE_MAX} className={`${inputCls} h-10 text-[15px] font-medium`} placeholder="예: 기프트 세트 링크 접속 방법" data-testid="ed-title" />
            </div>
          </div>
          <div className="flex-1 min-h-[340px] flex flex-col border border-slate-300 rounded-xl overflow-hidden focus-within:ring-2 focus-within:ring-[#2F7B7A]/30 focus-within:border-[#2F7B7A]/50">
            <div className="flex items-center gap-0.5 px-1.5 py-1 border-b border-slate-200 bg-slate-50 flex-wrap">
              <button type="button" className={tb} title="굵게 (**글자**)" onClick={() => wrap("**", "**", "굵은 글자")}><Bold size={15} /></button>
              <button type="button" className={tb} title="소제목 (## )" onClick={() => linePrefix("## ")}><Heading2 size={15} /></button>
              <button type="button" className={tb} title="목록 (- )" onClick={() => linePrefix("- ")}><List size={15} /></button>
              <button type="button" className={tb} title="번호 목록 (1. )" onClick={() => linePrefix("1. ")}><ListOrdered size={15} /></button>
              <button type="button" className={tb} title="안내 상자 (> )" onClick={() => linePrefix("> ")}><Quote size={15} /></button>
              <button type="button" className={tb} title="링크(https)" onClick={addLink}><Link2 size={15} /></button>
              <div className="ml-auto flex items-center rounded-lg border border-slate-200 overflow-hidden h-7 text-[12px] bg-white">
                {[["write", "쓰기"], ["split", "나란히"], ["preview", "미리 보기"]].map(([k, l], i) => <button key={k} onClick={() => setMode(k)} data-mode={k} className={`px-2.5 h-full ${i ? "border-l border-slate-200" : ""} ${k === "split" ? "hidden lg:block" : ""} ${mode === k ? "bg-slate-800 text-white" : "text-slate-600 hover:bg-slate-50"}`}>{l}</button>)}
              </div>
            </div>
            <div className={`flex-1 min-h-0 flex ${mode === "split" ? "divide-x divide-slate-200" : ""}`}>
              {mode !== "preview" && (
                <textarea ref={ta} value={body} onChange={(e) => setBody(e.target.value)} className="flex-1 min-w-0 w-full px-4 py-3 text-[14.5px] leading-[1.8] focus:outline-none resize-none block min-h-[300px]" data-testid="ed-body"
                  placeholder={"내용을 입력하세요.\n\n예)\n## 접속 방법\n1. CRM 에 로그인합니다\n2. 메뉴에서 **기프트 세트** 를 누릅니다\n> 권한이 없으면 담당자에게 요청해 주세요"}></textarea>
              )}
              {mode !== "write" && <div className="flex-1 min-w-0 overflow-y-auto px-5 py-4 bg-white min-h-[300px]" data-testid="ed-preview">{body.trim() ? preview : <p className="text-[13px] text-slate-300">미리 볼 내용이 없습니다.</p>}</div>}
            </div>
            <div className="flex items-center gap-3 px-3 h-8 border-t border-slate-100 bg-slate-50/70 text-[11px] text-slate-400">
              <span className="hidden sm:inline truncate">## 소제목 · - 목록 · 1. 번호 · **굵게** · &gt; 안내 · [글자](https://주소)</span>
              <span className={`ml-auto tabular-nums shrink-0 ${body.length > T365_BODY_MAX ? "text-red-600 font-semibold" : ""}`} data-testid="ed-body-count">{body.length.toLocaleString()} / {T365_BODY_MAX.toLocaleString()}자</span>
            </div>
          </div>
        </div>

        {/* 오른쪽 — 설정 */}
        <aside className="md:w-[340px] shrink-0 bg-slate-50/80 border-t md:border-t-0 md:border-l border-slate-200 p-4 space-y-3 md:overflow-y-auto">
          <Card title="게시 옵션" icon={Tags}>
            <Switch on={pinned} onChange={setPinned} testid="ed-pin" label="중요 · 상단 고정" desc="목록 맨 위와 Overview 「공지 · 필수」 에 보입니다" tint="#D97706" />
            <div className="border-t border-slate-100"></div>
            <Switch on={reqConfirm} onChange={(v) => { touchedReq.current = true; setReqConfirm(v); }} testid="ed-req" label="조회확인 필수" desc="Agent 의 「확인 대기」 목록에 올라가고 확인율을 집계합니다" tint="#C2410C" />
          </Card>
          <Card title="첨부파일" icon={Paperclip} right={<span className="text-[11px] text-slate-400 tabular-nums">{allCount} / {T365_FILES_MAX}{allCount ? ` · ${fmtSize(totalSize)}` : ""}</span>}>
            <label onDragOver={(e) => { e.preventDefault(); setDrag(true); }} onDragLeave={() => setDrag(false)} onDrop={(e) => { e.preventDefault(); setDrag(false); addFiles(e.dataTransfer.files); }}

/* 조회확인 현황 — 게시물별 확인율 한눈에(본사 · 작성자 · 관리자)              */

  const [page, setPage] = useState(1);
  useEffect(() => { setPage(1); }, [onlyReq, catF, q, sort]);
  const PAGE_SIZE = 20;
  const qq = q.trim().toLowerCase();
  const rows = posts.filter((p) => catMap[p.Category])
    .filter((p) => !onlyReq || p.RequireConfirm).filter((p) => !catF || p.Category === catF)
    .filter((p) => !qq || String(p.Title || "").toLowerCase().includes(qq))
    .map((p) => ({ p, s: confirmStats(p, readIdx, agents) }))
    .sort((a, b) => sort === "rate" ? a.s.pct - b.s.pct || (Date.parse(b.p.PublishedAt) || 0) - (Date.parse(a.p.PublishedAt) || 0) : (Date.parse(b.p.PublishedAt) || 0) - (Date.parse(a.p.PublishedAt) || 0));
  const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
  const pageSafe = Math.min(page, totalPages);
  const done = rows.reduce((a, x) => a + x.s.done, 0), total = rows.reduce((a, x) => a + x.s.total, 0);
  function exportExcel() {
    const ord = new Map([...posts].sort((a, b) => (Date.parse(a.PublishedAt || a._created || 0) || 0) - (Date.parse(b.PublishedAt || b._created || 0) || 0) || Number(a.id) - Number(b.id)).map((p, i) => [p.id, i + 1]));   // 번호 = 게시 순서(가장 먼저 올린 글이 1 · APS 공통)
    const sum = rows.map((x) => ({ 번호: ord.get(x.p.id), 카테고리: (catMap[x.p.Category] || {}).label || x.p.Category, 제목: x.p.Title, "게시일(KST)": fmtDate(x.p.PublishedAt || x.p._created), "조회확인 필수": x.p.RequireConfirm ? "예" : "아니요", 대상: x.s.total, 확인: x.s.done, 미확인: x.s.total - x.s.done, "확인율(%)": x.s.pct, "열람(전 역할)": x.s.viewers }));
    const matrix = agents.map((u) => {
      const o = { 이름: u.Title || "", 메일: u.Email || "", "회사/지점": u.Company || "" };
      rows.forEach((x, i) => { const r = (readIdx.get(String(x.p.id)) || new Map()).get(normEmail(u.Email)); o[`${i + 1}. ${String(x.p.Title).slice(0, 40)}`] = r && r.ConfirmedAt ? fmtDate(r.ConfirmedAt) : "미확인"; });
      return o;
    });
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sum), "게시물별");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(matrix.length ? matrix : [{ 안내: "등록된 Agent 가 없습니다" }]), "Agent별");
    XLSX.writeFile(wb, `Training365_조회확인현황_${kstToday()}.xlsx`);
    t365Log("조회확인", "Excel 내보내기", "조회확인 현황", { info: { 게시물: rows.length, Agent: agents.length } });
  }
  const ctrl = "h-9 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-[#2F7B7A]/40";
  return (
    <div className="w-full">
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-4">
        {[["대상 게시물", rows.length, "건"], ["등록 Agent", agents.length, "명"], ["확인 / 대상", `${done} / ${total}`, ""], ["평균 확인율", total ? Math.round((done / total) * 100) : "–", total ? "%" : ""]].map(([l, v, s]) => (
          <div key={l} className="bg-white rounded-xl border border-slate-200 shadow-sm px-4 py-3"><div className="text-[11.5px] text-slate-500">{l}</div><div className="text-xl font-bold text-slate-800 tabular-nums mt-0.5">{v}<span className="text-sm font-normal text-slate-400">{s}</span></div></div>
        ))}
      </div>
      <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <div className="px-4 py-3 border-b border-slate-100 flex items-center gap-2 flex-wrap">
          <label className="inline-flex items-center gap-2 text-sm text-slate-600 cursor-pointer mr-1"><input type="checkbox" checked={onlyReq} onChange={(e) => setOnlyReq(e.target.checked)} className="w-4 h-4" />조회확인 필수만</label>
          <select value={catF} onChange={(e) => setCatF(e.target.value)} className={`${ctrl} px-3 w-full sm:w-44`}><option value="">전체 카테고리</option>{cats.map((c) => <option key={c.key} value={c.key}>{c.label}</option>)}</select>
          <select value={sort} onChange={(e) => setSort(e.target.value)} className={`${ctrl} px-3 w-full sm:w-36`}><option value="rate">확인율 낮은 순</option><option value="date">최신 순</option></select>
          <div className="relative w-full sm:w-56"><Search size={15} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400" /><input value={q} onChange={(e) => setQ(e.target.value)} placeholder="제목 검색" className={`${ctrl} pl-8 pr-3 w-full`} /></div>
          <button onClick={exportExcel} disabled={!rows.length} className={`${btnCls} sm:ml-auto`}><Download size={14} /> Excel 내보내기</button>
        </div>
        <div className="overflow-x-auto">
          <table className="w-full table-fixed" style={{ minWidth: 820 }}>
            <colgroup><col style={{ width: 150 }} /><col /><col style={{ width: 104 }} /><col style={{ width: 92 }} /><col style={{ width: 200 }} /></colgroup>
            <thead className="bg-slate-50 text-slate-500 text-[11.5px]"><tr>{["카테고리", "제목", "게시일", "확인 / 대상", "확인율"].map((h) => <th key={h} className="px-3 py-2 font-medium text-left whitespace-nowrap border-b border-slate-200">{h}</th>)}</tr></thead>
            <tbody>
              {rows.length ? rows.slice((pageSafe - 1) * PAGE_SIZE, pageSafe * PAGE_SIZE).map(({ p, s }) => (
                <tr key={p.id} onClick={() => openPost(p)} className="border-t border-slate-100 first:border-t-0 hover:bg-slate-50 cursor-pointer" data-post={p.id}>
                  <td className="px-3 py-2.5"><CatChip cat={catMap[p.Category]} /></td>
                  <td className="px-3 py-2.5 text-[13px] text-slate-800 truncate">{p.IsPinned && <Pin size={11} className="inline mr-1 text-amber-500 -mt-0.5" />}{p.Title}</td>
                  <td className="px-3 py-2.5 text-[12px] text-slate-500 tabular-nums">{fmtDay(p.PublishedAt || p._created)}</td>
                  <td className="px-3 py-2.5 text-[12.5px] text-slate-600 tabular-nums">{s.done} / {s.total}</td>
                  <td className="px-3 py-2.5"><div className="flex items-center gap-2"><div className="flex-1"><ProgressBar pct={s.pct} color={pctColor(s.pct)} /></div><span className="text-[12px] font-semibold tabular-nums w-10 text-right" style={{ color: pctColor(s.pct) }}>{s.total ? `${s.pct}%` : "–"}</span></div></td>
                </tr>
              )) : <tr><td colSpan={5} className="text-center text-slate-400 text-sm py-12">조회 결과가 없습니다.</td></tr>}
            </tbody>
          </table>
        </div>
        <div className="px-4 py-2.5 border-t border-slate-100 flex items-center justify-between gap-3 text-xs text-slate-500">
          <span>총 <b className="text-slate-700 font-semibold">{rows.length}</b>건 · 대상은 사용 중인 Agent 전원</span>
          <Pager page={pageSafe} total={totalPages} onPage={setPage} />
        </div>
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* 사용자 · 역할 관리 — MKQR 「카테고리 접근 권한」 과 같은 방식                */
/* 표에서 바꾼 값은 노란색으로 표시만 하고 「반영」을 눌러야 저장 · 이력에 남는다   */
/* ------------------------------------------------------------------ */
function catKeysOf(s) { return String(s || "").split(/[,;\s]+/).map((x) => x.trim()).filter((x) => T365_DEFAULT_CATEGORIES.some((c) => c.key === x)); }
// 사용자 표(간단히) — 메뉴 권한 한 줄 요약: 역할 기본값 + 다른 칸만(+ 켬 / − 끔)
function UsersTab({ ctx, users, bootstrap, accessRows, listStatus, reload }) {
  const [q, setQ] = useState("");
  const [roleF, setRoleF] = useState("");
  const [overrides, setOverrides] = useState({});   // { 메일: { Role?, Company?, Active?, Perm?: {메뉴: n|v|e} } } — 「반영」 전까지 화면에만
  const [selected, setSelected] = useState(() => new Set());
  const [bulkRole, setBulkRole] = useState("Agent");
  const [bulkItem, setBulkItem] = useState("cat:required");
  const [bulkLevel, setBulkLevel] = useState("v");
  const [saving, setSaving] = useState("");
  const [savedPopup, setSavedPopup] = useState(null);
  const [add, setAdd] = useState({ email: "", name: "", company: "", role: "Agent" });
  const [importRows, setImportRows] = useState(null);
  const [page, setPage] = useState(1);
  const [justAdded, setJustAdded] = useState(() => new Set());
  const [showLegend, setShowLegend] = useState(false);
  // 직원 명부 대조(ICS · MKQR 카테고리 접근 권한과 같은 방식) — 보기: 전체 · 권한 있음(등록) · 명부에만 있음 · 명부 없음
  const [dir, setDir] = useState({ status: "loading", list: [], error: "" });
  const [view, setView] = useState("registered");   // 기본은 권한 있는 사람만 — 명부 직원은 「명부 직원」 보기에서 골라 등록
  const showMatrix = true;   // ICS · MKQR 처럼 메뉴별 보기 · 편집 체크박스 표 하나로(간단히 보기 없앰)
  const [showHelp, setShowHelp] = useState(false);
  const [showAdd, setShowAdd] = useState(false);
  useEffect(() => { let alive = true; loadEmployeeDirectory().then((list) => alive && setDir({ status: "ok", list, error: "" }), (e) => alive && setDir({ status: "error", list: [], error: e.message })); return () => { alive = false; }; }, []);
  useEffect(() => { setPage(1); }, [q, roleF, view]);
  const PAGE_SIZE = 50;
  const me = normEmail(ctx.me.email);
  // 목록에 직원 명부를 통째로 넣어 두고(역할 빈 값 = 로그인 불가) 역할을 주는 방식도 쓰므로, 「권한 있음」 = 역할 있음 · 사용 중
  const hasAccess = (p) => !p.dirOnly && T365_ROLES.includes(p.row.Role) && p.row.Active !== false;
  const canEdit = ctx.canEditMenu("users");   // 보기만이면 표는 읽기 전용 — 추가 · 반영 · 삭제 · 일괄 등록 없음
  // Permissions 열 — 없으면 역할 기본값만(작성자의 게시판 편집은 WriterCategories 로 저장되므로 그 칸만 바꿀 수 있다)
  const usersSt = listStatus && listStatus.users;
  const hasPermCol = !!usersSt && !usersSt.missing && !usersSt.error && !(usersSt.missingCols || []).includes("Permissions");
  const catLabel = (it) => (it.cat ? ((ctx.catMap[it.cat] || T365_DEFAULT_CATEGORIES.find((c) => c.key === it.cat) || {}).label || it.label) : it.label);

  // 메일 하나에 한 사람 — 같은 메일의 행이 여럿이면 첫 행만 쓰고 표시
  const merged = [];
  const dupCount = {};
  users.forEach((r) => {
    const email = normEmail(r.Email); if (!email) return;
    dupCount[email] = (dupCount[email] || 0) + 1;
    if (!merged.some((p) => p.email === email)) merged.push({ email, row: r });
  });
  // 명부 대조 — 등록된 사람에 명부 정보를 붙이고, 명부에만 있는 사람은 역할 없는 행으로 덧붙인다
  const dirOk = dir.status === "ok" && dir.list.length > 0;
  const dirMap = new Map(dir.list.map((d) => [d.email, d]));
  const dirNorm = new Map(); dir.list.forEach((d) => { const k = mailKey(d.email); dirNorm.set(k, dirNorm.has(k) ? null : d); });
  merged.forEach((p) => {
    p.dir = dirMap.get(p.email) || null;
    p.dirStatus = !dirOk ? "" : p.dir ? "in" : dirNorm.get(mailKey(p.email)) ? "alt" : "missing";
    if (p.dirStatus === "alt") p.altDir = dirNorm.get(mailKey(p.email));
    p.extAgent = p.row.Role === "Agent" || isExternalEmail(p.email);
  });
  const regSet = new Set(merged.map((p) => p.email));
  const regNorm = new Set(merged.map((p) => mailKey(p.email)));
  const dirRows = dirOk ? dir.list.filter((d) => !regSet.has(d.email) && !regNorm.has(mailKey(d.email)))
    .map((d) => ({ email: d.email, dirOnly: true, dir: d, dirStatus: "dirOnly", row: { Title: d.name, Email: d.email, Company: d.dept || d.company || "", Role: "", Active: true } })) : [];
  const everyone = merged.concat(dirRows);
  const missingRows = merged.filter((p) => p.dirStatus === "missing" || p.dirStatus === "alt");
  const viewCounts = { all: everyone.length, registered: everyone.filter(hasAccess).length, dirOnly: dirRows.length, missing: missingRows.length };
  const lastLogin = {};
  (accessRows || []).forEach((r) => { const e = normEmail(r.UserEmail); if (r.EndType !== "접근 차단" && (!lastLogin[e] || r.LoginAt > lastLogin[e])) lastLogin[e] = r.LoginAt; });
  const eff = (p, k) => { const o = overrides[p.email]; return o && k in o ? o[k] : k === "Active" ? p.row.Active !== false : String(p.row[k] || ""); };
  const stored = (p) => permsOf({ ...p.row, Active: true });   // 사용 중지는 「사용」 칸으로 따로 보이므로 권한 칸은 역할 · 예외 기준
  // 화면에 보이는 권한 — 바꾼 칸(Perm) > 역할만 바꿨으면 새 역할 기본값 > 저장된 값
  const curPerm = (p) => {
    const o = overrides[p.email];
        if (o && o.Perm) return o.Perm;
    if (o && "Role" in o) return rolePreset(o.Role, catKeysOf(p.row.WriterCategories));
    return stored(p).perms;
  };
  const presetOf = (p) => rolePreset(eff(p, "Role"), catKeysOf(p.row.WriterCategories));
  const qq = q.trim().toLowerCase();
  const filtered = everyone
    .filter((p) => view === "all" || (view === "registered" ? hasAccess(p) : view === "dirOnly" ? p.dirOnly : (p.dirStatus === "missing" || p.dirStatus === "alt")))
    .filter((p) => !roleF || eff(p, "Role") === roleF)
    .filter((p) => !qq || [p.email, p.row.Title, eff(p, "Company"), eff(p, "Role"), p.dir && p.dir.dept, p.dir && p.dir.team, p.dir && p.dir.name].some((v) => String(v || "").toLowerCase().includes(qq)));
  const roleRank = { "관리자": 0, "작성자": 1, "본사": 2, "Agent": 3 };

                    {cols.map((c) => {
                      const lv = cur[c.item.key] || "n"; const on = c.col === "v" ? lv !== "n" : lv === "e";

                          {c.item.locked ? <LockKeyhole size={11} className="mx-auto text-slate-300" />
                            : <input type="checkbox" checked={on} disabled={!editable} data-perm={`${p.email}|${c.item.key}|${c.col}`}

                                className={`w-4 h-4 ${editable ? "cursor-pointer" : "cursor-not-allowed"} ${c.col === "e" ? "accent-[#B45309]" : ""}`} />}

                      );

                    <td className="px-2 py-1.5 border-b border-slate-100" style={{ background: rowBg, borderLeft: "2px solid #CBD5E1" }}><input value={eff(p, "Company")} disabled={!canEdit} onChange={(e) => setField(p, "Company", e.target.value)} className="w-full h-8 px-2 border border-transparent hover:border-slate-200 focus:border-slate-300 rounded-md text-[12.5px] bg-transparent focus:bg-white focus:outline-none disabled:hover:border-transparent" placeholder="-" /></td>
                    <td className="px-3 py-1.5 text-[12px] text-slate-500 tabular-nums whitespace-nowrap border-b border-slate-100" style={{ background: rowBg }}>{lastLogin[p.email] ? fmtDate(lastLogin[p.email]).slice(2) : <span className="text-slate-300">-</span>}</td>
                    {canEdit && p.dirOnly && <td className="px-2 py-1.5 text-center border-b border-slate-100" style={{ background: rowBg }}><button onClick={() => addFromDir(p)} disabled={!!saving} data-add-dir={p.email} title={`바로 등록 — 역할 ${T365_ROLES.includes(role) ? role : "본사"}${o && o.Perm ? " · 고른 권한" : ""}`} className="h-7 px-2.5 inline-flex items-center gap-1 rounded-lg text-[11.5px] font-medium border border-[#9CCBC8] text-[#2F7B7A] bg-white hover:bg-[#E4F1F0] whitespace-nowrap"><UserPlus size={12} />추가</button></td>}
                    {canEdit && !p.dirOnly && <td className="px-2 py-1.5 text-center border-b border-slate-100" style={{ background: rowBg }}><button onClick={() => removeUsers([p])} disabled={!!saving} title="삭제 — 활동 이력에 남습니다" className="w-7 h-7 inline-flex items-center justify-center rounded-lg text-slate-300 hover:text-red-600 hover:bg-red-50"><Trash2 size={14} /></button></td>}
                  </tr>
                );
              }) : <tr><td colSpan={(showMatrix ? 6 : 7) + cols.length} className="text-center text-slate-400 py-10">{merged.length ? "조회 결과가 없습니다." : "등록된 사용자가 없습니다 — 위 「사용자 추가」 또는 「Excel 일괄 등록」으로 등록해 주세요."}</td></tr>}
            </tbody>
          </table>
        </div>
        <div className="px-4 py-2.5 border-t border-slate-100 flex items-center justify-between gap-3 text-xs text-slate-500">
          <span>등록 {merged.length}명{filtered.length !== merged.length && <> · 표시 {filtered.length}명</>} · 관리자 → 작성자 → 본사 → Agent 순</span>
          <Pager page={pageSafe} total={totalPages} onPage={setPage} />
        </div>
      </div>

      {importRows && (
        <Modal title="Excel 일괄 등록 — 미리 보기" onClose={() => setImportRows(null)} xl>
          <div className="flex items-center gap-2 flex-wrap mb-3 text-xs">
            {["신규", "변경", "동일", "오류"].map((s) => <span key={s} className={`px-2 py-0.5 rounded-full font-medium ${s === "오류" ? "bg-red-50 text-red-600" : s === "신규" ? "bg-emerald-50 text-emerald-700" : s === "변경" ? "bg-amber-50 text-amber-700" : "bg-slate-100 text-slate-500"}`}>{s} {importRows.filter((x) => x.status === s).length}</span>)}
            <span className="text-slate-400">오류 · 동일 행은 반영하지 않습니다.</span>
          </div>
          <div className="border border-slate-200 rounded-lg overflow-auto max-h-[50vh]">
            <table className="w-full text-[12.5px]" style={{ minWidth: 680 }}>
              <thead className="bg-slate-50 text-slate-500 text-[11.5px] sticky top-0"><tr>{["행", "상태", "이메일", "이름", "회사/지점", "역할", "비고"].map((h) => <th key={h} className="px-3 py-1.5 text-left font-medium">{h}</th>)}</tr></thead>
              <tbody>{importRows.map((x) => (
                <tr key={x.line} className="border-t border-slate-100">
                  <td className="px-3 py-1.5 text-slate-400">{x.line}</td>

                  <td className="px-3 py-1.5 text-slate-700">{x.email}</td><td className="px-3 py-1.5">{x.name}</td><td className="px-3 py-1.5">{x.company}</td><td className="px-3 py-1.5">{x.role}</td>
                  <td className={`px-3 py-1.5 ${x.status === "오류" ? "text-red-600" : "text-amber-700"}`}>{x.reason}</td>
                </tr>
              ))}</tbody>
            </table>
          </div>
          <div className="flex justify-end gap-2 mt-4">
            <button onClick={() => setImportRows(null)} className="px-4 py-2 text-sm rounded-lg border border-slate-300">닫기</button>
            <button onClick={applyImport} disabled={!importRows.some((x) => x.status === "신규" || x.status === "변경")} className="px-4 py-2 text-sm rounded-lg text-white disabled:opacity-40" style={{ background: BRAND.accent }} data-testid="import-apply">{importRows.filter((x) => x.status === "신규" || x.status === "변경").length}건 반영</button>
          </div>
        </Modal>
      )}
      {saving && <BlockingOverlay message={saving} />}
      {savedPopup != null && (
        <Modal title="반영 완료" onClose={() => setSavedPopup(null)}>
          <div className="text-center py-4"><CheckCircle2 size={32} className="mx-auto text-emerald-500 mb-3" /><div className="text-sm text-slate-600">{savedPopup}명의 변경사항이 저장되었습니다.</div></div>
          <div className="flex justify-end"><button onClick={() => setSavedPopup(null)} className="px-4 py-2 text-sm rounded-lg text-white" style={{ background: BRAND.accent }}>확인</button></div>
        </Modal>
      )}
    </div>
  );
}

/* Overview 배너 — 관리자가 올린 그림을 돌려 보여 준다(6초마다 · 마우스를 올리면 멈춤).        */
/* 배너가 없거나 목록이 없으면 그림 없는 기본 배너(Training365 · Star Truck Korea).            */
/* ------------------------------------------------------------------ */
function BannerImg({ file, className, alt }) {
  const [src, setSrc] = useState("");
  const [err, setErr] = useState(false);
  useEffect(() => {
    let alive = true; setErr(false);
    if (file) tImageUrl(file).then((u) => { if (alive) setSrc(u); }, () => { if (alive) setErr(true); });
    return () => { alive = false; };
  }, [file && file.itemId]);
  if (!file || err) return <div className={`${className || ""} bg-slate-200`} aria-hidden="true"></div>;
  return src ? <img src={src} alt={alt || ""} className={className} draggable={false} /> : <div className={`${className || ""} bg-slate-200 animate-pulse`} aria-hidden="true"></div>;
}
// 배너 아래쪽 게시판 아이콘 줄 — 작성 후 하루(24시간) 안의 새 글 수: 안 읽은 글이 있으면 빨간 숫자(안 읽은 수), 모두 읽었으면 회색 숫자(새 글 수), 하루가 지나면 숫자 없음
const T365_FRESH_MS = 864e5;
function BoardIconStrip({ ctx, onGo }) {
  const { posts, cats, readIdx, me } = ctx;
  const since = Date.now() - T365_FRESH_MS;
  const read = (p) => !!(readIdx.get(String(p.id)) || new Map()).get(normEmail(me.email));
  return (
    <div className="flex items-end gap-1 md:gap-1.5 overflow-x-auto pb-0.5 -mx-1 px-1" data-testid="board-icons">
      {cats.map((c) => {
        const fresh = posts.filter((p) => p.Category === c.key && postTs(p) >= since);
        const unread = fresh.filter((p) => !read(p)).length;
        const n = unread || fresh.length; const red = unread > 0;
        const I = c.icon || FileText;
        return (
          <button key={c.key} onClick={() => onGo(c.key)} data-bicon={c.key} title={`${c.label}${n ? ` — 오늘 새 글 ${fresh.length}건${red ? ` · 안 읽음 ${unread}건` : " · 모두 읽음"}` : ""}`}

/* 카테고리 꾸미기 · 문의 담당자 — 카테고리 관리에서 한 카테고리씩                         */
/* 아이콘(목록에서 고르기 또는 그림 올리기 — 30KB 이하, 큰 그림은 96px 로 줄여 저장) · 색 · 담당자 */

// 올린 그림 → 96px 이하로 줄인 data URL(이미 작으면 그대로). 실패하면 원본 data URL
function shrinkIcon(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("그림을 읽지 못했습니다."));
    fr.onload = () => {
      const raw = String(fr.result || "");
      const img = new window.Image();
      img.onerror = () => reject(new Error("그림 형식을 읽지 못했습니다."));
      img.onload = () => {
        const max = 96, k = Math.min(1, max / Math.max(img.width || 1, img.height || 1));
        if (k >= 1 && file.size <= T365_ICON_IMG_MAX) { resolve(raw); return; }
        const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        let out = c.toDataURL("image/png");
        if (out.length * 0.75 > T365_ICON_IMG_MAX) out = c.toDataURL("image/webp", 0.85);
        resolve(out);
      };
      img.src = raw;
    };
    fr.readAsDataURL(file);
  });
}

const catDraftOf = (c) => ({ key: c.key, label: c.label, desc: c.desc, order: c.order, active: c.active, icon: c.iconKey || "", color: c.colorKey || "", contacts: c.contacts || [] });

  const counts = {}; ctx.posts.forEach((p) => { counts[p.Category] = (counts[p.Category] || 0) + 1; });
  const sameC = (a, b) => JSON.stringify(a || []) === JSON.stringify(b || []);

  const set = (key, k, v) => setDraft((prev) => prev.map((d) => (d.key === key ? { ...d, [k]: v } : d)));
  const sorted = [...draft].sort((a, b) => a.order - b.order || a.key.localeCompare(b.key));
  // 위 · 아래로 — 이웃과 자리를 바꾸고 10 단위로 다시 번호
  const move = (key, dir) => setDraft((prev) => {
    const arr = [...prev].sort((a, b) => a.order - b.order || a.key.localeCompare(b.key));
    const i = arr.findIndex((d) => d.key === key); const j = i + dir;

          <div className="absolute inset-0 flex flex-col items-center justify-center gap-1.5 text-center">
            <ImagePlus size={24} className="text-slate-400" /><span className="text-[13px] font-medium text-slate-600">배너 그림 고르기</span><span className="text-[11px] text-slate-400">PNG · JPG · WEBP · {fmtSize(T365_BANNER_MAX)} 까지 · 권장 1600×400(가로로 긴 그림)</span>
          </div>
        )}
        <span className="absolute top-2 right-2 text-[11px] px-2 py-0.5 rounded-md bg-black/40 text-white">{localUrl || b.image ? "그림 바꾸기" : ""}</span>

        <Field label="부제목"><input value={subtitle} onChange={(e) => setSubtitle(e.target.value)} maxLength={160} className={inputCls} placeholder="예: 사양 변경점과 판매 포인트를 확인하세요" data-testid="bn-sub" /></Field>
        <Field label="링크 (선택)" hint="누르면 새 창으로 엽니다 — https:// 만. 게시물 주소를 붙여도 됩니다"><input value={link} onChange={(e) => setLink(e.target.value)} className={inputCls} placeholder="https://" data-testid="bn-link" /></Field>
        <div className="grid grid-cols-2 gap-x-3">
          <Field label="순서"><input type="number" value={order} onChange={(e) => setOrder(e.target.value)} className={inputCls} /></Field>
          <Field label="사용"><label className="h-[38px] inline-flex items-center gap-2 text-sm text-slate-700 cursor-pointer"><input type="checkbox" checked={active} onChange={(e) => setActive(e.target.checked)} className="w-4 h-4" data-testid="bn-active" /> 게시판 홈에 보이기</label></Field>
        </div>
      </div>
      <div className="flex justify-end gap-2 pt-4 mt-1 border-t border-slate-100">
        <button onClick={onClose} disabled={!!saving} className="px-4 py-2 text-sm rounded-lg border border-slate-300">취소</button>
        <button onClick={save} disabled={!!saving} className="px-5 py-2 text-sm rounded-lg text-white font-medium disabled:opacity-50" style={{ background: BRAND.accent }} data-testid="bn-save">{isEdit ? "수정 저장" : "배너 추가"}</button>
      </div>
      {saving && <BlockingOverlay message={saving} />}
    </Modal>
  );
}
// 기본 7개 + 목록 값(이름 · 설명 · 순서 · 사용). includeInactive=false 면 사용 중인 것만, 순서대로
function mergeCategories(catRows, includeInactive) {
  const out = T365_DEFAULT_CATEGORIES.map((c, i) => {
    const r = (catRows || []).find((x) => String(x.Key || "").trim() === c.key);
    const ic = r ? parseCatIcon(r.Icon) : null;
    const pal = r ? T365_PALETTE.find((x) => x.color.toLowerCase() === String(r.Color || "").trim().toLowerCase()) : null;
    return { ...c, label: (r && String(r.Title || "").trim()) || c.label, desc: r && r.Description != null && String(r.Description).trim() ? String(r.Description).trim() : c.desc,
      order: r && r.SortOrder != null && r.SortOrder !== "" ? Number(r.SortOrder) : (i + 1) * 10, active: r ? r.Active !== false : true,
      defIcon: c.icon, defColor: c.color, ...(ic || { iconKey: "" }), ...(pal ? { color: pal.color, soft: pal.soft, colorKey: pal.color } : { colorKey: "" }),
      contacts: r ? parseContacts(r.Contacts) : [] };
  }).sort((a, b) => a.order - b.order);
  return includeInactive ? out : out.filter((c) => c.active);
}

  const [loading, setLoading] = useState(false);

  const [roleF, setRoleF] = useState("");
  const [statusF, setStatusF] = useState("");

  const [page, setPage] = useState(1);
  const [detail, setDetail] = useState(null);
  const [loaded, setLoaded] = useState("");
  const PAGE_SIZE = 25;
  async function load(f = from, t = to) {
    if (!f || !t || f > t) { uiAlert("조회 기간을 확인해 주세요."); return; }
    if (dayAdd(f, 92) < t) { uiAlert("한 번에 93일까지 조회할 수 있습니다."); return; }
    setLoading(true); setError("");
    const fi = kstDayStartIso(f), ti = kstDayStartIso(dayAdd(t, 1));
    try {
      let list;
      try { list = await tListAll(T365_LISTS.access, `&$filter=fields/LoginAt ge '${fi}' and fields/LoginAt lt '${ti}'`); }
      catch (e) { if (isMissingListError(e)) throw e; list = await tListAll(T365_LISTS.access); }   // LoginAt 인덱스가 없을 때 — 전체를 읽어 화면에서 거른다
      setRows(list.filter((r) => r.LoginAt && r.LoginAt >= fi && r.LoginAt < ti).sort((a, b) => String(b.LoginAt).localeCompare(String(a.LoginAt))));
      setLoaded(`${f} ~ ${t}`); setPage(1);
    } catch (e) { setError(isMissingListError(e) ? "접속 기록 목록이 아직 없습니다 — 관리자 준비 안내를 확인해 주세요." : e.message); setRows([]); }
    setLoading(false);
  }
  useEffect(() => { load(); }, []);
  useEffect(() => { setPage(1); }, [roleF, statusF, q, mode]);
  const now = Date.now();
  const uMap = new Map(ctx.users.map((u) => [normEmail(u.Email), u]));
  const enrich = (r) => { const st = sessionStatus(r, now); const end = st.end ? Date.parse(st.end) : now; return { ...r, st, dur: (end || now) - (Date.parse(r.LoginAt) || now) }; };
  const qq = q.trim().toLowerCase();
  const view = (rows || []).map(enrich)

  const byUser = Object.values(view.reduce((m, r) => {
    const k = normEmail(r.UserEmail); const u = uMap.get(k);
    const o = m[k] || (m[k] = { email: k, name: r.UserName || (u && u.Title) || k, company: r.Company || (u && u.Company) || "", role: r.Role, n: 0, last: null, lastEnd: null, logouts: 0, inferred: 0, total: 0 });
    o.n++; o.total += Math.max(0, r.dur); if (r.st.label === "로그아웃") o.logouts++; if (r.st.inferred) o.inferred++;
    if (!o.last || r.LoginAt > o.last.LoginAt) o.last = r;

  }, {})).sort((a, b) => String(b.last.LoginAt).localeCompare(String(a.last.LoginAt)));
  const list = mode === "user" ? byUser : view;
  const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));

          <Pager page={pageSafe} total={totalPages} onPage={setPage} />

      {detail && (

const T365_LOG_CATS = ["게시물", "사용자", "카테고리", "조회확인", "접속 기록"];
function logCatStyle(c) { return { "게시물": "bg-teal-50 text-teal-700", "사용자": "bg-violet-50 text-violet-700", "카테고리": "bg-blue-50 text-blue-700", "조회확인": "bg-orange-50 text-orange-700", "접속 기록": "bg-slate-100 text-slate-600" }[c] || "bg-slate-100 text-slate-600"; }

function fmtVal(v) { return v === true ? "예" : v === false ? "아니요" : v === "" || v == null ? "(빈 값)" : String(v); }
function logSummary(l) {

}
async function loadActivityLogs(from, to, onProgress) {
  const token = await getGraphToken();
  const d = await tDocDriveId();
  const H = { headers: { Authorization: "Bearer " + token } };
  const all = async (url) => { let out = []; while (url) { const r = await fetch(url, H); if (r.status === 404) return null; if (!r.ok) throw new Error(`이력 폴더 조회 실패 (${r.status})`); const j = await r.json(); out = out.concat(j.value || []); url = j["@odata.nextLink"] || null; } return out; };
  const days = await all(`${GRAPH}/drives/${d}/root:/${T365_LOG_ROOT}:/children?$select=id,name,folder&$top=200`);
  if (!days) return [];
  const files = [];
  for (const day of days.filter((x) => x.folder && /^\d{4}-\d{2}-\d{2}$/.test(x.name) && x.name >= from && x.name <= to)) {
    const ch = (await all(`${GRAPH}/drives/${d}/items/${day.id}/children?$select=id,name,file,content.downloadUrl&$top=200`)) || [];
    ch.filter((c) => c.file && /\.json$/i.test(c.name)).forEach((c) => files.push({ id: c.id, name: c.name, day: day.name, url: c["@microsoft.graph.downloadUrl"] || "" }));
  }
  const out = []; let done = 0; const q = files.slice();
  const read = async (f, n = 0) => { const r = f.url && /^https:\/\//.test(f.url) ? await fetch(f.url, { cache: "no-store" }) : await fetch(`${GRAPH}/drives/${d}/items/${f.id}/content`, H); if ((r.status === 429 || r.status === 503) && n < 3) { await new Promise((ok) => setTimeout(ok, 1200 * (n + 1))); return read(f, n + 1); } if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); };
  const worker = async () => { while (q.length) { const f = q.shift(); try { const j = await read(f); out.push({ ...j, _id: f.id, _file: f.name }); } catch (e) { out.push({ _id: f.id, _file: f.name, timestampKST: `${f.day} ??:??:??`, category: "-", verb: "읽기 실패", target: f.name, detail: { info: { 오류: e.message } } }); } done++; if (onProgress && done % 10 === 0) onProgress(done, files.length); } };
  await Promise.all(Array.from({ length: 6 }, worker));
  return out.sort((a, b) => String(b.timestampKST).localeCompare(String(a.timestampKST)));
}

const T365_ADMIN_TABS = ["users", "categories", "access", "activity"];
function parseHash() {

  if (h[0] === "all") return { tab: "all", post: /^\d+$/.test(h[1] || "") ? h[1] : null };
  if (h[0] === "overview") return { tab: "overview", post: /^\d+$/.test(h[1] || "") ? h[1] : null };   // Overview 위 팝업(#/overview/번호)
  if (["overview", "status", ...T365_ADMIN_TABS].includes(h[0])) return { tab: h[0], post: null };

}
function hashOf(tab, post) {
  if (tab.startsWith("cat:")) return `#/cat/${tab.slice(4)}${post ? "/" + post : ""}`;
  if (tab === "all") return `#/all${post ? "/" + post : ""}`;
  if (tab === "overview" && post) return `#/overview/${post}`;
