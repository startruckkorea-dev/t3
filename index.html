<style>
  /* MKQR · ICS 와 같은 글꼴 · 로그인 카드 · 로딩 · 스크롤 막대(APS 공통) */
  html, body { margin: 0; padding: 0; height: 100%; background: #F5F6F8; font-family: 'Segoe UI', sans-serif; }
  body .font-mono { font-family: 'Segoe UI', sans-serif; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
  #root { height: 100%; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: 'Segoe UI', sans-serif; color: #64748B; font-size: 14px; }
  #login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(145deg,#0f2744 0%,#101B34 100%);font-family:'Segoe UI',sans-serif}
  .login-card{background:#fff;border-radius:16px;padding:40px 36px;width:340px;max-width:calc(100vw - 32px);box-sizing:border-box;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center}
  .login-title{font-size:1.05rem;font-weight:700;color:#101B34;margin-bottom:4px}
  .login-co{font-size:.8rem;color:#8A94A6;margin-bottom:6px}
  .login-guide{font-size:.8rem;color:#8A94A6;margin-bottom:20px;line-height:1.6}
  #loading{align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(145deg,#0f2744 0%,#101B34 100%);font-family:'Segoe UI',sans-serif}
  .loading-card{display:flex;flex-direction:column;align-items:center;gap:16px}
  .loading-spinner{width:40px;height:40px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:#2F7B7A;animation:t365-spin .85s linear infinite}
  .loading-text{color:rgba(255,255,255,.7);font-size:.85rem}
  @keyframes t365-spin{to{transform:rotate(360deg)}}
  .btn-login{background:linear-gradient(135deg,#2F7B7A,#1A2B4C);color:#fff;border:none;border-radius:10px;padding:13px 0;font-size:.92rem;font-weight:600;cursor:pointer;width:100%;font-family:inherit}
  .btn-login:disabled{background:#cbd5e0;cursor:not-allowed}
  #login-err{color:#C1352E;font-size:.78rem;margin-top:10px;display:none}
  .login-page-footer{position:fixed;bottom:0;left:0;right:0;padding:10px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:11px;color:rgba(255,255,255,.55);background:rgba(0,0,0,.18)}
  @media (max-width: 767px){ .login-page-footer{flex-direction:column;align-items:center;text-align:center;gap:2px;padding:8px 16px} }
  input[type=checkbox]{accent-color:#2F7B7A}
  nav.t365-side-nav { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.18) transparent; }
  nav.t365-side-nav::-webkit-scrollbar { width: 6px; }
  nav.t365-side-nav::-webkit-scrollbar-track { background: transparent; }
  nav.t365-side-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 6px; }
  nav.t365-side-nav:hover::-webkit-scrollbar-thumb { background: rgba(255,255,255,.34); }
  aside.t365-side { transition: width .28s cubic-bezier(.4,0,.2,1); }
  /* 게시물 본문 — 사용자가 쓴 글은 React 요소로만 그린다(HTML 해석 없음). 여기서는 간격 · 줄바꿈만 */
  .t365-body { font-size: 14.5px; line-height: 1.85; color: #1E293B; word-break: keep-all; overflow-wrap: anywhere; }
  .t365-body p { margin: 0 0 .85em; white-space: pre-wrap; }
  .t365-body h3 { font-size: 1.05rem; font-weight: 700; color: #101B34; margin: 1.3em 0 .5em; }
  .t365-body > :first-child { margin-top: 0; }
  .t365-body ul, .t365-body ol { margin: 0 0 .9em; padding-left: 1.35em; }
  .t365-body ul { list-style: disc; } .t365-body ol { list-style: decimal; }
  .t365-body li { margin: .15em 0; }
  .t365-body blockquote { margin: 0 0 .9em; padding: .6em .9em; border-left: 3px solid #2F7B7A; background: #F2F8F8; border-radius: 0 8px 8px 0; color: #334155; white-space: pre-wrap; }
  .t365-body a { color: #1D6F8F; text-decoration: underline; text-underline-offset: 2px; }
  .t365-body strong { font-weight: 700; color: #0F172A; }
  .t365-clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

html, * { scrollbar-width: thin; scrollbar-color: #CBD5E1 transparent; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: #94A3B8; background-clip: padding-box; }
</style>

async function tListId(listName) {

// 5,000건 임계 대비 nextLink 를 따라 끝까지(MKQR mkListAll 과 같음)
async function tListAll(listName, extraQuery = "") {
  const token = await getGraphToken();
  const listId = await tListId(listName);
  let items = [];
  let url = `${GRAPH}/sites/${_siteId}/lists/${listId}/items?expand=fields&$top=500${extraQuery}`;
  while (url) {
    const res = await fetch(url, { headers: { Authorization: "Bearer " + token, Prefer: "HonorNonIndexedQueriesWarningMayFailRandomly" } });
    if (!res.ok) { const e = new Error(`${listName} 조회 실패 (${res.status})`); e.status = res.status; throw e; }
    const data = await res.json();
    items = items.concat(data.value || []);
    url = data["@odata.nextLink"] || null;
  }
  return items.map((x) => ({ id: String(x.id), ...x.fields, _created: x.createdDateTime }));
}

let _tDocDriveId = null;
async function tDocDriveId() {

const _tFolders = new Set();
async function tEnsureFolder(driveId, folderPath, token) {
  if (_tFolders.has(folderPath)) return true;
  const parts = folderPath.split("/").filter(Boolean);
  let cur = "";
  for (const part of parts) {
    const next = cur ? `${cur}/${part}` : part;
    const chk = await fetch(`${GRAPH}/drives/${driveId}/root:/${next}`, { headers: { Authorization: "Bearer " + token } });
    if (!chk.ok) {
      const parent = cur ? `${GRAPH}/drives/${driveId}/root:/${cur}:/children` : `${GRAPH}/drives/${driveId}/root/children`;
      const res = await fetch(parent, { method: "POST", headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
        body: JSON.stringify({ name: part, folder: {}, "@microsoft.graph.conflictBehavior": "fail" }) });
      if (!res.ok && res.status !== 409) { console.warn("[Training365] 폴더 생성 실패:", next, res.status); return false; }
    }
    cur = next;
  }
  _tFolders.add(folderPath);
  return true;
}
const T365_BLOCKED_EXT = ["exe", "bat", "cmd", "com", "msi", "scr", "ps1", "vbs", "js", "jse", "wsf", "hta", "html", "htm", "svg", "jar", "dll", "lnk", "reg"];

const T365_VIDEO_MAX = 300 * 1024 * 1024;    // 동영상 300MB
function fileExt(name) { const m = /\.([A-Za-z0-9]+)$/.exec(String(name || "")); return m ? m[1].toLowerCase() : ""; }
function sanitizeFileName(name) { return String(name || "file").replace(/[\\/:*?"<>|#%{}~&\u0000-\u001f]/g, "_").replace(/\s+/g, " ").trim().slice(0, 120) || "file"; }
function fmtSize(n) { n = Number(n) || 0; return n >= 1048576 ? `${(n / 1048576).toFixed(1)}MB` : n >= 1024 ? `${Math.round(n / 1024)}KB` : `${n}B`; }
// 업로드 — 4MB 이하는 한 번에, 넘으면 업로드 세션(5MB 조각). 돌려주는 값만 게시물에 저장한다
async function tUploadFile(file, onProgress) {
  const token = await getGraphToken();
  const driveId = await tDocDriveId();
  const kst = new Date(Date.now() + 9 * 36e5);
  const folder = `${T365_FILE_ROOT}/${kst.getUTCFullYear()}-${String(kst.getUTCMonth() + 1).padStart(2, "0")}`;
  if (!(await tEnsureFolder(driveId, folder, token))) throw new Error("첨부 폴더를 만들 수 없습니다 — 권한을 확인해 주세요.");
  const safe = `${Date.now()}_${sanitizeFileName(file.name)}`;
  const enc = `${folder}/${safe}`.split("/").map(encodeURIComponent).join("/");
  let item;
  if (file.size <= 4 * 1024 * 1024) {
    const res = await fetch(`${GRAPH}/drives/${driveId}/root:/${enc}:/content`, { method: "PUT", headers: { Authorization: "Bearer " + token, "Content-Type": file.type || "application/octet-stream" }, body: file });
    if (!res.ok) throw new Error(`업로드 실패 (${res.status}) — ${file.name}`);
    item = await res.json();
    if (onProgress) onProgress(1);
  } else {
    const s = await fetch(`${GRAPH}/drives/${driveId}/root:/${enc}:/createUploadSession`, { method: "POST", headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
      body: JSON.stringify({ item: { "@microsoft.graph.conflictBehavior": "rename" } }) });
    if (!s.ok) throw new Error(`업로드 준비 실패 (${s.status}) — ${file.name}`);
    const { uploadUrl } = await s.json();
    const CH = 320 * 1024 * 16;
    for (let off = 0; off < file.size; off += CH) {
      const end = Math.min(off + CH, file.size);
      const r = await fetch(uploadUrl, { method: "PUT", headers: { "Content-Range": `bytes ${off}-${end - 1}/${file.size}` }, body: file.slice(off, end) });
      if (!r.ok) throw new Error(`업로드 실패 (${r.status}) — ${file.name}`);
      if (onProgress) onProgress(end / file.size);
      if (end === file.size) item = await r.json();
    }
  }
  return { name: String(file.name).slice(0, 200), size: file.size, type: file.type || "", driveId, itemId: item.id };
}
const T365_ID_RE = /^[A-Za-z0-9!_\-]{1,200}$/;
// 저장된 첨부 정보(JSON) — 형식이 맞는 것만 받는다(게시물 목록을 손으로 고쳐도 경로가 엉뚱한 곳을 가리키지 않게)
function parseFiles(json) {
  let arr = [];
  try { const v = JSON.parse(json || "[]"); arr = Array.isArray(v) ? v : v && typeof v === "object" ? [v] : []; } catch (e) { arr = []; }
  return arr.filter((f) => f && T365_ID_RE.test(String(f.driveId || "")) && T365_ID_RE.test(String(f.itemId || "")))
    .map((f) => ({ name: String(f.name || "파일").slice(0, 200), size: Number(f.size) || 0, type: String(f.type || ""), driveId: String(f.driveId), itemId: String(f.itemId) }));
}
async function tFileUrl(f) {
  if (!T365_ID_RE.test(f.driveId) || !T365_ID_RE.test(f.itemId)) throw new Error("파일 정보가 올바르지 않습니다.");
  const j = await apiGet(`/drives/${f.driveId}/items/${f.itemId}?$select=id,name,@microsoft.graph.downloadUrl`);
  const u = j["@microsoft.graph.downloadUrl"];
  if (!u || !/^https:\/\//i.test(u)) throw new Error("내려받기 주소를 받지 못했습니다.");
  return u;
}
async function tDownload(f) {
  try {
    const url = await tFileUrl(f);
    const a = document.createElement("a");
    a.href = url; a.download = f.name; a.rel = "noopener"; document.body.appendChild(a); a.click(); a.remove();

}

function cfgSeqKeys(cfg, prefix) {

/* ---- 내 신원 — 게스트(B2B) 계정은 mail 이 비거나 UPN 이 x_domain.com#EXT#@tenant 꼴이라 여러 값을 모두 비교(SSC sscMyIds 와 같음) ---- */
function buildIdentity(account, me) {
  const ids = new Set();
  const add = (v) => { v = String(v || "").trim().toLowerCase(); if (v) ids.add(v); };
  add(me && me.mail); add(me && me.userPrincipalName); add(account && account.username);
  ((me && me.otherMails) || []).forEach(add);
  const c = (account && account.idTokenClaims) || {}; add(c.email); add(c.preferred_username); add(c.upn);
  [...ids].forEach((v) => { const m = v.match(/^(.+?)#ext#@/i); if (m) add(m[1].replace(/_([^_]+)$/, "@$1")); });
  const upn = String((me && me.userPrincipalName) || "").toLowerCase();
  const isGuest = String((me && me.userType) || "").toLowerCase() === "guest" || /#ext#@/i.test(upn) || /#ext#@/i.test(String((account && account.username) || ""));
  const list = [...ids].filter((v) => v.includes("@") && !/#ext#@/i.test(v));
  const email = (String((me && me.mail) || "").toLowerCase() || list[0] || String((account && account.username) || "").toLowerCase());
  const rawName = String((account && account.name) || (me && me.displayName) || "");
  const shortName = ((/\(([^()]+)\)\s*$/.exec(rawName) || [])[1] || rawName || email).trim();
  return { ids: [...ids], email, name: rawName || email, shortName, isGuest };
}
const normEmail = (e) => String(e || "").trim().toLowerCase();
function isExternalEmail(e) { const d = normEmail(e).split("@")[1] || ""; return !!d && !/(^|\.)hyosung\.com$|(^|\.)startruckkorea\.com$/.test(d); }

      });

/* ---- 접속 기록(training365_AccessLog) — 로그인 · 활동 신호 · 로그아웃 ----
 * 로그인: 권한 확인을 통과(또는 차단)한 순간 한 행. 같은 탭에서 새로고침하면 같은 세션 행을 이어 쓴다(sessionStorage).
 * 활동 신호: 화면이 보이고 사용자가 움직였을 때만 heartbeatMs 마다 LastActivityAt 갱신, 탭을 닫거나 숨길 때도 한 번(keepalive).
 * 로그아웃: 「로그아웃」 버튼에서 LogoutAt · EndType=로그아웃. 로그아웃 없이 idleEndMs 동안 활동이 없으면 화면에서 「세션 종료(추정)」. */
const T365Session = {
  itemId: null, sid: "", lastActivity: 0, lastBeat: 0, timer: null, info: null, token: "",
  async start(info) {
    this.info = info;
    const now = Date.now();
    this.lastActivity = now;
    let sid = "", itemId = "", prevAct = 0;
    try { sid = sessionStorage.getItem("t365.sid") || ""; itemId = sessionStorage.getItem("t365.sessItem") || ""; prevAct = Number(sessionStorage.getItem("t365.lastAct") || 0); } catch (e) {}
    // 같은 탭의 새로고침 — 같은 사람이고 아직 세션이 살아 있으면(idleEndMs 이내) 그 행을 이어 쓴다
    let resumed = false;
    try {
      if (sid && itemId && sessionStorage.getItem("t365.sessUser") === info.email && prevAct && now - prevAct < T365_TIMING.idleEndMs) {
        await tUpdate(T365_LISTS.access, itemId, { LastActivityAt: new Date(now).toISOString() });
        resumed = true;
      }
    } catch (e) { resumed = false; }
    if (!resumed) {
      sid = `${new Date(now + 9 * 36e5).toISOString().slice(0, 10).replace(/-/g, "")}-${Math.random().toString(36).slice(2, 10)}`;
      const row = await tCreate(T365_LISTS.access, {
        Title: sid, UserEmail: info.email, UserName: info.name, Role: info.role || "권한 없음", Company: info.company || "",
        LoginAt: new Date(now).toISOString(), LastActivityAt: new Date(now).toISOString(), EndType: info.role ? "" : "접근 차단",
        LogoutAt: info.role ? undefined : new Date(now).toISOString(), Device: deviceLabel(navigator.userAgent), UserAgent: String(navigator.userAgent || "").slice(0, 500),
      });
      itemId = row.id;
    }
    this.sid = sid; this.itemId = itemId; this.lastBeat = now;
    this.persist();
    return { resumed, itemId };
  },
  persist() {
    try {
      sessionStorage.setItem("t365.sid", this.sid); sessionStorage.setItem("t365.sessItem", this.itemId || "");
      sessionStorage.setItem("t365.sessUser", (this.info && this.info.email) || ""); sessionStorage.setItem("t365.lastAct", String(this.lastActivity));
    } catch (e) {}
  },
  touch() { this.lastActivity = Date.now(); try { sessionStorage.setItem("t365.lastAct", String(this.lastActivity)); } catch (e) {} },
  async beat(force) {
    if (!this.itemId) return false;

    const at = this.lastActivity;
    try { await tUpdate(T365_LISTS.access, this.itemId, { LastActivityAt: new Date(at).toISOString() }); this.lastBeat = at; return true; }
    catch (e) { console.warn("[Training365] 활동 신호 기록 실패:", e.message); return false; }
  },
  // 탭을 닫거나 숨길 때 — 마지막 활동 시각만(로그아웃으로 적지 않는다: 새로고침 · 탭 전환과 구분할 수 없어서)
  flush() {
    if (!this.itemId || !this.token || this.lastActivity <= this.lastBeat) return;
    const at = this.lastActivity;
    try {
      fetch(`${GRAPH}/sites/${_siteId}/lists/${_tListIds[T365_LISTS.access]}/items/${encodeURIComponent(this.itemId)}/fields`, {
        method: "PATCH", keepalive: true, headers: { Authorization: "Bearer " + this.token, "Content-Type": "application/json" }, body: JSON.stringify({ LastActivityAt: new Date(at).toISOString() }),
      }).catch(() => {});
      this.lastBeat = at;
    } catch (e) {}
  },
  startTimers() {
    if (this.timer) return;
    const act = () => this.touch();
    ["pointerdown", "keydown", "scroll", "touchstart", "mousemove"].forEach((ev) => window.addEventListener(ev, act, { passive: true, capture: true }));
    const refreshToken = () => getGraphToken().then((t) => { this.token = t; }).catch(() => {});

      if (document.visibilityState === "visible") this.beat(false);

  },
  async logout() {
    const now = new Date().toISOString();

        await Promise.race([
          tUpdate(T365_LISTS.access, this.itemId, { LogoutAt: now, LastActivityAt: now, EndType: "로그아웃" }),
          new Promise((ok) => setTimeout(ok, 3000)),
        ]);
      } catch (e) { console.warn("[Training365] 로그아웃 기록 실패:", e.message); }
    }
    try { ["t365.sid", "t365.sessItem", "t365.sessUser", "t365.lastAct"].forEach((k) => sessionStorage.removeItem(k)); } catch (e) {}
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
    this.itemId = null;
  },
};

}
// 접속 상태 — 로그아웃 · 접근 차단 · 세션 종료(추정) · 접속 중

function deviceLabel(ua) {

/* ---- 날짜(UTC → KST, 다른 APS 시스템과 같은 규칙) ---- */
const _p2 = (n) => String(n).padStart(2, "0");
function fmtDate(iso) {
  if (!iso) return "-";
  const t = Date.parse(iso); if (!t) return "-";
  const k = new Date(t + 9 * 36e5);
  return `${k.getUTCFullYear()}-${_p2(k.getUTCMonth() + 1)}-${_p2(k.getUTCDate())} ${_p2(k.getUTCHours())}:${_p2(k.getUTCMinutes())}`;
}
function fmtDay(iso) { return iso ? fmtDate(iso).slice(0, 10) : "-"; }
function kstToday() { const k = new Date(Date.now() + 9 * 36e5); return `${k.getUTCFullYear()}-${_p2(k.getUTCMonth() + 1)}-${_p2(k.getUTCDate())}`; }
function dayAdd(s, n) { const d = new Date(s + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return `${d.getUTCFullYear()}-${_p2(d.getUTCMonth() + 1)}-${_p2(d.getUTCDate())}`; }
function kstDayStartIso(s) { return new Date(Date.parse(s + "T00:00:00Z") - 9 * 36e5).toISOString(); }
function fmtDuration(ms) { if (!(ms >= 0)) return "-"; if (ms < 60e3) return "1분 미만"; const m = Math.round(ms / 60e3); return m < 60 ? `${m}분` : `${Math.floor(m / 60)}시간 ${m % 60}분`; }
function isNewPost(p) { return Date.now() - (Date.parse(p.PublishedAt || p._created || 0) || 0) < 7 * 864e5; }

/* ---- 링크 — https 만 허용 ---- */
function safeHttpsUrl(u) {
  try { const x = new URL(String(u || "").trim()); return x.protocol === "https:" && x.hostname ? x.href : null; } catch (e) { return null; }
}
function youtubeId(u) {
  const s = safeHttpsUrl(u); if (!s) return null;
  try {
    const x = new URL(s); const h = x.hostname.replace(/^www\.|^m\./, "");
    let id = null;
    if (h === "youtu.be") id = x.pathname.slice(1).split("/")[0];
    else if (h === "youtube.com" || h === "youtube-nocookie.com") id = x.searchParams.get("v") || (/^\/(embed|shorts|live)\/([^/]+)/.exec(x.pathname) || [])[2];
    return id && /^[A-Za-z0-9_-]{11}$/.test(id) ? id : null;
  } catch (e) { return null; }
}

/* 게시물 본문 — 간단한 표기(## 제목 · - 목록 · 1. 번호 · **굵게** · > 안내 · [글자](https://…))를 */
/* React 요소로만 그린다. HTML 을 해석하지 않으므로 스크립트 태그 · onerror 같은 값은 글자 그대로 보인다. */
/* 링크는 https 만 — 그 밖의 주소(http · javascript: · data: …)는 링크로 만들지 않는다.            */
/* ------------------------------------------------------------------ */
const T365_INLINE_RE = /(\*\*([^*\n]{1,500})\*\*)|(\[([^\]\n]{1,200})\]\(([^()\s]{1,2000})\))|(https:\/\/[^\s<>"'()\[\]]*[^\s<>"'()\[\].,;:!?])/g;
function renderInline(text, kb) {
  const out = []; let last = 0, m, i = 0;
  const re = new RegExp(T365_INLINE_RE.source, "g");
  while ((m = re.exec(text))) {
    if (m.index > last) out.push(text.slice(last, m.index));
    if (m[1]) out.push(<strong key={`${kb}b${i}`}>{m[2]}</strong>);
    else if (m[3]) { const u = safeHttpsUrl(m[5]); out.push(u ? <a key={`${kb}a${i}`} href={u} target="_blank" rel="noopener noreferrer">{m[4]}</a> : m[0]); }
    else if (m[6]) { const u = safeHttpsUrl(m[6]); out.push(u ? <a key={`${kb}u${i}`} href={u} target="_blank" rel="noopener noreferrer">{m[6]}</a> : m[6]); }
    last = re.lastIndex; i++;
  }
  if (last < text.length) out.push(text.slice(last));
  return out;
}
function parseBlocks(src) {
  const lines = String(src || "").replace(/\r\n?/g, "\n").split("\n");
  const blocks = []; let para = [];
  const flush = () => { if (para.length) { blocks.push({ t: "p", text: para.join("\n") }); para = []; } };
  const last = () => blocks[blocks.length - 1];
  for (const line of lines) {
    let m;
    if (/^\s*$/.test(line)) { flush(); blocks.push({ t: "gap" }); continue; }
    if ((m = /^#{1,3}\s+(.+)$/.exec(line))) { flush(); blocks.push({ t: "h", text: m[1] }); continue; }
    if ((m = /^\s*[-*•]\s+(.+)$/.exec(line))) { flush(); if (last() && last().t === "ul") last().items.push(m[1]); else blocks.push({ t: "ul", items: [m[1]] }); continue; }
    if ((m = /^\s*\d{1,3}[.)]\s+(.+)$/.exec(line))) { flush(); if (last() && last().t === "ol") last().items.push(m[1]); else blocks.push({ t: "ol", items: [m[1]] }); continue; }
    if ((m = /^>\s?(.*)$/.exec(line))) { flush(); if (last() && last().t === "q") last().lines.push(m[1]); else blocks.push({ t: "q", lines: [m[1]] }); continue; }
    para.push(line);
  }
  flush();
  return blocks.filter((b) => b.t !== "gap");
}
function RichText({ text }) {
  const blocks = parseBlocks(text);
  if (!blocks.length) return <p className="text-slate-400">(본문 없음)</p>;
  return (
    <div className="t365-body">
      {blocks.map((b, i) => b.t === "h" ? <h3 key={i}>{renderInline(b.text, i)}</h3>
        : b.t === "ul" ? <ul key={i}>{b.items.map((x, j) => <li key={j}>{renderInline(x, `${i}.${j}`)}</li>)}</ul>
        : b.t === "ol" ? <ol key={i}>{b.items.map((x, j) => <li key={j}>{renderInline(x, `${i}.${j}`)}</li>)}</ol>
        : b.t === "q" ? <blockquote key={i}>{renderInline(b.lines.join("\n"), i)}</blockquote>
        : <p key={i}>{renderInline(b.text, i)}</p>)}
    </div>
  );
}

function plainPreview(src, n = 140) {

/* ------------------------------------------------------------------ */
/* 조회 · 조회확인 기록(training365_Reads) — 사람 × 게시물 한 행           */
/* Title = 「게시물ID|메일」(고유 값). 다시 열면 그 행의 LastViewedAt · ViewCount 만,      */
/* 조회확인은 ConfirmedAt 이 비어 있을 때 한 번만 채운다(두 번 눌러도 · 두 탭에서도 한 행 · 처음 시각 유지). */
/* ------------------------------------------------------------------ */
const readKey = (postId, email) => `${postId}|${normEmail(email)}`;
// 같은 키(게시물 × 사람) 작업은 이 탭 안에서 한 줄로 세운다 — 연타 · 열람과 확인이 겹쳐도 행이 둘 생기지 않게.
// 탭이 여럿이면 Title 「고유 값 적용」 이 막고(409), 그때는 다시 읽어 그 행을 쓴다.
const _readQ = new Map();
function serialRead(key, fn) {
  const prev = _readQ.get(key) || Promise.resolve();
  const p = prev.catch(() => {}).then(fn);
  _readQ.set(key, p);
  p.catch(() => {}).finally(() => { if (_readQ.get(key) === p) _readQ.delete(key); });
  return p;
}
async function tFindRead(key) {
  const rows = await tListAll(T365_LISTS.reads, `&$filter=fields/Title eq '${odq(key)}'`);
  return rows.filter((r) => r.Title === key).sort((a, b) => Number(a.id) - Number(b.id))[0] || null;
}
function t365RecordView(post, me) {
  const key = readKey(post.id, me.email);
  return serialRead(key, async () => {
    const now = new Date().toISOString();
    let row = await tFindRead(key);
    if (row) {
      const f = { LastViewedAt: now, ViewCount: (Number(row.ViewCount) || 0) + 1 };
      await tUpdate(T365_LISTS.reads, row.id, f);
      return { ...row, ...f };
    }
    const fields = { Title: key, PostId: String(post.id), UserEmail: normEmail(me.email), UserName: me.name, Company: me.company || "", Role: me.role, FirstViewedAt: now, LastViewedAt: now, ViewCount: 1 };
    try { return await tCreate(T365_LISTS.reads, fields); }
    catch (e) { row = await tFindRead(key); if (row) return row; throw e; }   // 다른 탭이 먼저 만든 경우(고유 값 제약)
  });
}
function t365Confirm(post, me) {
  if (me.role !== "Agent") return Promise.reject(new Error("조회확인은 Agent 만 할 수 있습니다."));
  const key = readKey(post.id, me.email);
  return serialRead(key, async () => {
    const now = new Date().toISOString();
    let row = await tFindRead(key);
    if (row && row.ConfirmedAt) return row;   // 이미 확인 — 처음 시각을 지우거나 바꾸지 않는다
    if (row) { await tUpdate(T365_LISTS.reads, row.id, { ConfirmedAt: now, LastViewedAt: now }); return { ...row, ConfirmedAt: now, LastViewedAt: now }; }
    const fields = { Title: key, PostId: String(post.id), UserEmail: normEmail(me.email), UserName: me.name, Company: me.company || "", Role: me.role, FirstViewedAt: now, LastViewedAt: now, ViewCount: 1, ConfirmedAt: now };
    try { return await tCreate(T365_LISTS.reads, fields); }
    catch (e) {
      row = await tFindRead(key); if (!row) throw e;
      if (!row.ConfirmedAt) { await tUpdate(T365_LISTS.reads, row.id, { ConfirmedAt: now }); row = { ...row, ConfirmedAt: now }; }
      return row;
    }
  });
}
// 게시물별 · 사람별로 묶기 — 혹시 같은 키의 행이 둘이면(고유 값 제약 전 기록) 가장 이른 확인 시각 · 조회 수 합
function indexReads(reads) {
  const byPost = new Map();
  (reads || []).forEach((r) => {
    const pid = String(r.PostId || String(r.Title || "").split("|")[0] || "");
    const em = normEmail(r.UserEmail || String(r.Title || "").split("|")[1]);
    if (!pid || !em) return;
    if (!byPost.has(pid)) byPost.set(pid, new Map());
    const m = byPost.get(pid);
    const cur = m.get(em);
    if (!cur) { m.set(em, { ...r, UserEmail: em, ViewCount: Number(r.ViewCount) || 1 }); return; }
    const minIso = (a, b) => (!a ? b : !b ? a : Date.parse(a) <= Date.parse(b) ? a : b);
    m.set(em, { ...cur, ConfirmedAt: minIso(cur.ConfirmedAt, r.ConfirmedAt), FirstViewedAt: minIso(cur.FirstViewedAt, r.FirstViewedAt),
      LastViewedAt: [cur.LastViewedAt, r.LastViewedAt].filter(Boolean).sort().pop(), ViewCount: (Number(cur.ViewCount) || 1) + (Number(r.ViewCount) || 1) });
  });
  return byPost;
}
// 확인 대상 = 사용 중인 Agent 전원
function confirmStats(post, readIdx, agents) {
  const m = readIdx.get(String(post.id)) || new Map();
  const rows = agents.map((u) => { const r = m.get(normEmail(u.Email)); return { user: u, confirmedAt: (r && r.ConfirmedAt) || "", viewedAt: (r && r.FirstViewedAt) || "" }; });
  const done = rows.filter((x) => x.confirmedAt).length;
  return { rows, done, total: rows.length, pct: rows.length ? Math.round((done / rows.length) * 100) : 0, viewers: m.size };
}

}

/* ------------------------------------------------------------------ */
/* 게시판(카테고리별 · 전체) — 목록 · 검색 · 필터                            */
/* ------------------------------------------------------------------ */
function BoardTab({ ctx, catKey, openId, setOpenId }) {
  const { posts, catMap, cats, readIdx, me } = ctx;
  const cat = catKey ? catMap[catKey] : null;
  const [q, setQ] = useState("");
  const [filter, setFilter] = useState("all");
  const [catFilter, setCatFilter] = useState("");
  const [page, setPage] = useState(1);
  const [editing, setEditing] = useState(null);   // null | { post?: 게시물 }
  useEffect(() => { setPage(1); }, [q, filter, catFilter, catKey]);
  useEffect(() => { setQ(""); setFilter("all"); setCatFilter(""); }, [catKey]);
  const PAGE_SIZE = 15;
  const myRow = (p) => (readIdx.get(String(p.id)) || new Map()).get(normEmail(me.email));
  const scope = posts.filter((p) => (catKey ? p.Category === catKey : !!catMap[p.Category]));
  const tsOf = (p) => Date.parse(p.PublishedAt || p._created || 0) || 0;
  // 번호 — 게시 순서(가장 먼저 올린 글이 1, APS 공통 표준)
  const numOf = new Map([...scope].sort((a, b) => tsOf(a) - tsOf(b) || Number(a.id) - Number(b.id)).map((p, i) => [p.id, i + 1]));
  const qq = q.trim().toLowerCase();
  const view = scope
    .filter((p) => !catFilter || p.Category === catFilter)
    .filter((p) => filter === "all" ? true : filter === "unread" ? !myRow(p) : filter === "pinned" ? p.IsPinned : filter === "todo" ? (p.RequireConfirm && !(myRow(p) && myRow(p).ConfirmedAt)) : filter === "required" ? p.RequireConfirm : true)
    .filter((p) => !qq || [p.Title, plainPreview(p.Body, 4000), p.AuthorName, ...(parseFiles(p.AttachmentsJson).map((f) => f.name))].some((v) => String(v || "").toLowerCase().includes(qq)))
    .sort((a, b) => (b.IsPinned ? 1 : 0) - (a.IsPinned ? 1 : 0) || tsOf(b) - tsOf(a));
  const totalPages = Math.max(1, Math.ceil(view.length / PAGE_SIZE));
  const pageSafe = Math.min(page, totalPages);
  const pageRows = view.slice((pageSafe - 1) * PAGE_SIZE, pageSafe * PAGE_SIZE);
  const canWriteHere = catKey ? ctx.canWrite(catKey) : cats.some((c) => ctx.canWrite(c.key));
  const open = openId ? posts.find((p) => String(p.id) === String(openId)) : null;

  if (openId) {
    if (!open || (catKey && open.Category !== catKey) || !catMap[open.Category]) return (
      <div className="bg-white rounded-xl border border-slate-200 p-10 text-center">
        <FileText size={28} className="mx-auto text-slate-300 mb-2" />
        <div className="text-slate-500 text-sm mb-4">게시물을 찾을 수 없습니다 — 삭제되었거나 볼 수 없는 카테고리입니다.</div>
        <button onClick={() => setOpenId(null)} className={btnCls}><ChevronLeft size={14} /> 목록으로</button>
      </div>
    );
    return (
      <>
        <PostDetail key={open.id} ctx={ctx} post={open} onBack={() => setOpenId(null)} onEdit={() => setEditing({ post: open })} />
        {editing && <PostEditor ctx={ctx} post={editing.post} defaultCat={catKey} onClose={() => setEditing(null)} onSaved={async () => { setEditing(null); await ctx.reload(); }} />}
      </>
    );
  }

  const filters = [["all", "전체"], ["unread", "안 읽은 글"], ["pinned", "중요"], ctx.isAgent ? ["todo", "확인 필요"] : ["required", "조회확인 필수"]];
  const Status = ({ p }) => {
    if (ctx.isAgent) {
      const r = myRow(p);
      return r && r.ConfirmedAt ? <span className="inline-flex items-center gap-1 text-[11.5px] text-emerald-700"><CheckCircle2 size={13} /> 확인</span>
        : p.RequireConfirm ? <span className="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-orange-50 text-orange-700 whitespace-nowrap">확인 필요</span>
        : <span className="text-[11.5px] text-slate-300">-</span>;
    }
    const s = confirmStats(p, readIdx, ctx.agents);
    if (!s.total) return <span className="text-[11.5px] text-slate-300">-</span>;
    return (
      <div className="w-full">
        <div className="text-[11.5px] tabular-nums mb-0.5" style={{ color: pctColor(s.pct) }}><b>{s.pct}%</b> <span className="text-slate-400">{s.done}/{s.total}</span></div>
        <ProgressBar pct={s.pct} color={pctColor(s.pct)} />
      </div>
    );
  };
  const Flags = ({ p }) => (
    <>
      {p.RequireConfirm && <span className="text-[10px] font-semibold px-1.5 rounded-full leading-[17px] whitespace-nowrap" style={{ background: "#FDEEE6", color: "#C2410C" }}>필수 확인</span>}
      {parseFiles(p.AttachmentsJson).length > 0 && <Paperclip size={12} className="text-slate-400 shrink-0" aria-label="첨부" />}
      {(safeHttpsUrl(p.VideoUrl) || parseFiles(p.VideoFileJson).length > 0) && <Video size={13} className="text-slate-400 shrink-0" aria-label="동영상" />}
      {isNewPost(p) && <span className="text-[9.5px] font-bold text-white rounded px-1 leading-[15px] shrink-0" style={{ background: "#DC2626" }}>N</span>}
    </>
  );

  return (
    <div className="w-full">
      <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <div className="px-4 py-3 border-b border-slate-100 flex items-center gap-2 flex-wrap">
          <div className="flex items-center rounded-lg border border-slate-300 overflow-x-auto h-9 max-w-full shrink-0">
            {filters.map(([k, label], i) => (
              <button key={k} onClick={() => setFilter(k)} data-filter={k}
                className={`px-3 h-full text-sm whitespace-nowrap ${i ? "border-l border-slate-300" : ""} ${filter === k ? "text-white" : "text-slate-600 bg-white hover:bg-slate-50"}`}
                style={filter === k ? { background: BRAND.accent } : undefined}>{label}</button>
            ))}
          </div>
          {!catKey && (
            <select value={catFilter} onChange={(e) => setCatFilter(e.target.value)} className="h-9 border border-slate-300 rounded-lg text-sm bg-white px-3 w-full sm:w-44 focus:outline-none focus:ring-2 focus:ring-[#2F7B7A]/40" aria-label="카테고리">
              <option value="">전체 카테고리</option>{cats.map((c) => <option key={c.key} value={c.key}>{c.label}</option>)}
            </select>
          )}
          <div className="relative w-full sm:w-auto sm:flex-1 sm:max-w-xs">
            <Search size={15} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400" />
            <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="제목 · 내용 · 작성자 · 첨부 이름 검색" className="h-9 w-full border border-slate-300 rounded-lg text-sm bg-white pl-8 pr-3 focus:outline-none focus:ring-2 focus:ring-[#2F7B7A]/40" />
          </div>
          {canWriteHere && (
            <button onClick={() => setEditing({})} className={`${btnPrimaryCls} sm:ml-auto`} style={{ background: BRAND.accent }} data-testid="btn-write"><Pencil size={14} /> 글쓰기</button>
          )}
        </div>

        {/* 넓은 화면 — 표 */}
        <div className="hidden md:block overflow-x-auto">
          <table className="w-full table-fixed" style={{ minWidth: 820 }}>
            <colgroup><col style={{ width: 70 }} /><col /><col style={{ width: 130 }} /><col style={{ width: 104 }} /><col style={{ width: 64 }} /><col style={{ width: 128 }} /></colgroup>
            <thead className="bg-slate-50 text-slate-500 text-[11.5px]">
              <tr>{["번호", "제목", "작성자", "게시일", "조회", ctx.isAgent ? "조회확인" : "확인율"].map((h, i) => <th key={h} className={`px-3 py-2 font-medium whitespace-nowrap border-b border-slate-200 ${i === 1 || i === 2 ? "text-left" : "text-center"}`}>{h}</th>)}</tr>
            </thead>
            <tbody>
              {pageRows.length ? pageRows.map((p) => {
                const unread = !myRow(p); const s = (readIdx.get(String(p.id)) || new Map()).size;
                return (
                  <tr key={p.id} onClick={() => setOpenId(p.id)} data-post={p.id} className={`border-t border-slate-100 first:border-t-0 cursor-pointer ${p.IsPinned ? "bg-amber-50/50 hover:bg-amber-50" : "hover:bg-slate-50"}`}>
                    <td className="px-3 py-2.5 text-center text-[12px] text-slate-400 tabular-nums">{p.IsPinned ? <span className="inline-flex items-center gap-0.5 text-amber-600 font-semibold text-[11px]"><Pin size={11} />중요</span> : numOf.get(p.id)}</td>
                    <td className="px-3 py-2.5 min-w-0">
                      <div className="flex items-center gap-1.5 min-w-0">
                        {!catKey && <span className="shrink-0"><CatChip cat={catMap[p.Category]} /></span>}
                        <span className={`truncate text-[13.5px] ${unread ? "font-semibold text-slate-900" : "text-slate-600"}`}>{p.Title}</span>
                        <Flags p={p} />
                      </div>
                    </td>
                    <td className="px-3 py-2.5 text-[12.5px] text-slate-600 truncate">{p.AuthorName || "-"}</td>
                    <td className="px-3 py-2.5 text-center text-[12px] text-slate-500 tabular-nums">{fmtDay(p.PublishedAt || p._created)}</td>
                    <td className="px-3 py-2.5 text-center text-[12px] text-slate-500 tabular-nums">{s}</td>
                    <td className="px-3 py-2.5 text-center"><Status p={p} /></td>
                  </tr>
                );
              }) : (
                <tr><td colSpan={6} className="text-center text-slate-400 text-sm py-14">{scope.length ? "조회 결과가 없습니다." : "등록된 게시물이 없습니다."}</td></tr>
              )}
            </tbody>
          </table>
        </div>
        {/* 휴대폰 — 카드 */}
        <div className="md:hidden">
          {pageRows.length ? pageRows.map((p) => {
            const unread = !myRow(p);
            return (
              <button key={p.id} onClick={() => setOpenId(p.id)} data-post={p.id} className={`w-full text-left px-4 py-3 border-t border-slate-100 first:border-t-0 ${p.IsPinned ? "bg-amber-50/50" : ""}`}>
                <div className="flex items-center gap-1.5 mb-1 flex-wrap">
                  {p.IsPinned && <span className="inline-flex items-center gap-0.5 text-amber-600 font-semibold text-[11px]"><Pin size={11} />중요</span>}
                  {!catKey && <CatChip cat={catMap[p.Category]} />}
                  <Flags p={p} />
                  <span className="ml-auto"><Status p={p} /></span>
                </div>
                <div className={`text-[14px] leading-snug t365-clamp2 ${unread ? "font-semibold text-slate-900" : "text-slate-600"}`}>{p.Title}</div>
                <div className="text-[11.5px] text-slate-400 mt-1">{p.AuthorName || "-"} · {fmtDay(p.PublishedAt || p._created)} · 조회 {(readIdx.get(String(p.id)) || new Map()).size}</div>
              </button>
            );
          }) : <div className="text-center text-slate-400 text-sm py-12">{scope.length ? "조회 결과가 없습니다." : "등록된 게시물이 없습니다."}</div>}
        </div>

        <div className="px-4 py-2.5 border-t border-slate-100 flex items-center justify-between gap-3 text-xs text-slate-500">
          <span>총 <b className="text-slate-700 font-semibold">{view.length}</b>건{view.length !== scope.length && <> (전체 {scope.length}건 중)</>}</span>
          <Pager page={pageSafe} total={totalPages} onPage={setPage} />
        </div>
      </div>
      {editing && <PostEditor ctx={ctx} post={editing.post} defaultCat={catKey || catFilter} onClose={() => setEditing(null)} onSaved={async (id) => { setEditing(null); await ctx.reload(); if (id) setOpenId(id); }} />}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* 게시물 보기 — 본문 · 동영상 · 첨부 · 조회확인(Agent) / 확인 현황(본사 · 작성자 · 관리자) */
/* ------------------------------------------------------------------ */
function PostDetail({ ctx, post, onBack, onEdit }) {
  const { me, catMap, readIdx } = ctx;
  const cat = catMap[post.Category];
  const mine = (readIdx.get(String(post.id)) || new Map()).get(normEmail(me.email));
  const [busy, setBusy] = useState(false);
  const [deleting, setDeleting] = useState(false);
  const [videoSrc, setVideoSrc] = useState("");
  const files = parseFiles(post.AttachmentsJson);
  const vfile = parseFiles(post.VideoFileJson)[0];
  const vurl = safeHttpsUrl(post.VideoUrl);
  const yt = youtubeId(post.VideoUrl);
  const viewers = (readIdx.get(String(post.id)) || new Map()).size;

  // 열람 기록 — 이 화면을 열 때 한 번(사람 × 게시물 한 행, 다시 열면 그 행의 조회 수만)
  useEffect(() => {
    let alive = true;
    t365RecordView(post, me).then((row) => { if (alive && row) ctx.upsertRead(row); }).catch((e) => console.warn("[Training365] 열람 기록 실패:", e.message));
    return () => { alive = false; };
  }, [post.id]);

  const busyRef = useRef(false);
  async function confirmRead() {
    if (busyRef.current) return;   // 같은 순간 여러 번 눌러도 한 번만(상태 갱신 전 연타 대비)
    busyRef.current = true; setBusy(true);
    try {
      const row = await t365Confirm(post, me);
      if (row) ctx.upsertRead(row);
    } catch (e) { alert(`조회확인을 저장하지 못했습니다 — ${e.message}\n잠시 후 다시 눌러 주세요.`); }
    busyRef.current = false; setBusy(false);
  }
  async function remove() {
    if (!confirm(`「${post.Title}」 게시물을 삭제할까요?\n삭제하면 되돌릴 수 없고, 이 게시물의 조회확인 기록은 확인 현황에서 빠집니다.`)) return;
    setDeleting(true);
    try {
      await tDelete(T365_LISTS.posts, post.id);
      t365Log("게시물", "삭제", post.Title, { info: { 카테고리: cat ? cat.label : post.Category, 게시물ID: post.id, 작성자: post.AuthorName || post.AuthorEmail || "" } });
      onBack();
      await ctx.reload();
    } catch (e) { alert(e.message); }
    setDeleting(false);
  }
  async function playVideo() {
    try { setVideoSrc(await tFileUrl(vfile)); } catch (e) { alert(`동영상을 열 수 없습니다 — ${e.message}`); }
  }

  return (
    <div className="w-full">
      <div className="flex items-center gap-2 mb-3 flex-wrap">
        <button onClick={onBack} className={btnCls} data-testid="btn-back"><ChevronLeft size={15} /> 목록</button>
        <div className="ml-auto flex items-center gap-2">
          {ctx.canEditPost(post) && <button onClick={onEdit} className={btnCls} data-testid="btn-edit"><Pencil size={14} /> 수정</button>}
          {ctx.canEditPost(post) && <button onClick={remove} className={`${btnCls} text-red-600 border-red-200 hover:bg-red-50`} data-testid="btn-delete"><Trash2 size={14} /> 삭제</button>}
        </div>
      </div>
      <article className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
        <div className="h-1" style={{ background: cat ? cat.color : BRAND.accent }}></div>
        <header className="px-5 md:px-8 pt-5 pb-4 border-b border-slate-100">
          <div className="flex items-center gap-1.5 flex-wrap mb-2">
            <CatChip cat={cat} />
            {post.IsPinned && <span className="inline-flex items-center gap-0.5 text-[11px] font-semibold px-2 py-0.5 rounded-full bg-amber-50 text-amber-700"><Pin size={11} />중요</span>}
            {post.RequireConfirm && <span className="text-[11px] font-semibold px-2 py-0.5 rounded-full" style={{ background: "#FDEEE6", color: "#C2410C" }}>조회확인 필수</span>}
          </div>
          <h2 className="text-[19px] md:text-[21px] font-bold text-slate-900 leading-snug break-words" data-testid="post-title">{post.Title}</h2>
          <div className="text-[12px] text-slate-400 mt-2 flex items-center gap-x-3 gap-y-1 flex-wrap">
            <span className="text-slate-600 font-medium">{post.AuthorName || "-"}</span>
            <span className="inline-flex items-center gap-1"><Clock size={12} />게시 {fmtDate(post.PublishedAt || post._created)}</span>
            {post.UpdatedAt && <span>수정 {fmtDate(post.UpdatedAt)}</span>}
            <span className="inline-flex items-center gap-1"><Eye size={12} />조회 {viewers}명</span>
          </div>
        </header>
        <div className="px-5 md:px-8 py-6" data-testid="post-body"><RichText text={post.Body} /></div>

        {(vurl || vfile) && (
          <div className="px-5 md:px-8 pb-6">
            <div className="text-xs font-semibold text-slate-500 mb-2 flex items-center gap-1.5"><Video size={14} /> 동영상</div>
            {yt ? (
              <div className="relative w-full max-w-3xl rounded-xl overflow-hidden bg-black" style={{ paddingTop: "min(56.25%, 432px)" }}>
                <iframe className="absolute inset-0 w-full h-full" src={`https://www.youtube-nocookie.com/embed/${yt}`} title="동영상" allow="encrypted-media; picture-in-picture; fullscreen" allowFullScreen referrerPolicy="strict-origin-when-cross-origin"></iframe>
              </div>
            ) : vurl ? (
              <a href={vurl} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg border border-slate-200 bg-slate-50 hover:bg-slate-100 text-sm text-slate-700 max-w-full">
                <PlayCircle size={18} style={{ color: BRAND.accent }} className="shrink-0" /><span className="truncate">동영상 보기 — {new URL(vurl).hostname}</span><ExternalLink size={13} className="text-slate-400 shrink-0" />
              </a>
            ) : null}
            {vfile && (videoSrc ? (
              <video src={videoSrc} controls className="w-full max-w-3xl rounded-xl bg-black mt-2" preload="metadata"></video>
            ) : (
              <button onClick={playVideo} className="mt-2 inline-flex items-center gap-2 px-4 py-2.5 rounded-lg border border-slate-200 bg-slate-50 hover:bg-slate-100 text-sm text-slate-700 max-w-full">
                <PlayCircle size={18} style={{ color: BRAND.accent }} className="shrink-0" /><span className="truncate">동영상 재생 — {vfile.name}</span><span className="text-xs text-slate-400 shrink-0">{fmtSize(vfile.size)}</span>
              </button>
            ))}
          </div>
        )}

        {files.length > 0 && (
          <div className="px-5 md:px-8 pb-6">
            <div className="text-xs font-semibold text-slate-500 mb-2 flex items-center gap-1.5"><Paperclip size={14} /> 첨부 {files.length}개</div>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2" data-testid="attachments">
              {files.map((f) => (
                <button key={f.itemId} onClick={() => tDownload(f)} className="flex items-center gap-2.5 px-3 py-2.5 rounded-lg border border-slate-200 hover:bg-slate-50 text-left min-w-0">
                  <div className="w-8 h-8 rounded-lg flex items-center justify-center shrink-0 bg-slate-100 text-[10px] font-bold text-slate-500 uppercase">{fileExt(f.name).slice(0, 4) || "file"}</div>
                  <div className="min-w-0 flex-1"><div className="text-[13px] text-slate-700 truncate">{f.name}</div><div className="text-[11px] text-slate-400">{fmtSize(f.size)}</div></div>
                  <Download size={15} className="text-slate-400 shrink-0" />
                </button>
              ))}
            </div>
          </div>
        )}

        {ctx.isAgent && (
          <div className="px-5 md:px-8 py-5 border-t border-slate-100 bg-slate-50/60" data-testid="confirm-box">
            {mine && mine.ConfirmedAt ? (
              <div className="flex items-center gap-3 rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3">
                <CheckCircle2 size={22} className="text-emerald-600 shrink-0" />
                <div className="min-w-0">
                  <div className="text-sm font-semibold text-emerald-800" data-testid="confirmed-label">조회확인 완료</div>
                  <div className="text-xs text-emerald-700/80 tabular-nums">{fmtDate(mine.ConfirmedAt)} 에 확인했습니다</div>
                </div>
              </div>
            ) : (
              <div className="flex items-center gap-4 flex-wrap">
                <div className="min-w-0 flex-1">
                  <div className="text-sm font-semibold text-slate-700">{post.RequireConfirm ? "필수 확인 자료입니다" : "내용을 확인하셨나요?"}</div>
                  <div className="text-xs text-slate-500 mt-0.5">끝까지 읽으셨다면 「조회확인」을 눌러 주세요. 확인한 시각이 본사에 기록됩니다.</div>
                </div>
                <button onClick={confirmRead} disabled={busy} data-testid="btn-confirm"
                  className="h-11 px-6 rounded-xl text-[15px] font-semibold text-white shadow-sm disabled:opacity-60 inline-flex items-center gap-2 w-full sm:w-auto justify-center" style={{ background: BRAND.accent }}>
                  <CheckCircle2 size={18} /> {busy ? "저장 중..." : "조회확인"}
                </button>
              </div>
            )}
          </div>
        )}
      </article>

      {!ctx.isAgent && <ConfirmPanel ctx={ctx} post={post} />}
      {deleting && <BlockingOverlay message="삭제하고 있습니다..." />}
    </div>
  );
}

// 게시물 하나의 확인 현황 — 대상 Agent 중 누가 언제 확인했는지 · 안 했는지 · 확인율
function ConfirmPanel({ ctx, post }) {
  const s = confirmStats(post, ctx.readIdx, ctx.agents);
  const [view, setView] = useState(post.RequireConfirm ? "pending" : "all");
  const [q, setQ] = useState("");
  const qq = q.trim().toLowerCase();
  const rows = s.rows
    .filter((x) => view === "all" ? true : view === "done" ? !!x.confirmedAt : !x.confirmedAt)
    .filter((x) => !qq || [x.user.Title, x.user.Email, x.user.Company].some((v) => String(v || "").toLowerCase().includes(qq)))
    .sort((a, b) => (a.confirmedAt ? 0 : 1) - (b.confirmedAt ? 0 : 1) || String(a.confirmedAt).localeCompare(String(b.confirmedAt)) || String(a.user.Company || "").localeCompare(String(b.user.Company || "")) || String(a.user.Title || "").localeCompare(String(b.user.Title || "")));
  function exportExcel() {
    const data = s.rows.map((x, i) => ({ 번호: i + 1, 이름: x.user.Title || "", 메일: x.user.Email || "", "회사/지점": x.user.Company || "", 조회확인: x.confirmedAt ? "확인" : "미확인", "확인 시각(KST)": x.confirmedAt ? fmtDate(x.confirmedAt) : "", "첫 열람(KST)": x.viewedAt ? fmtDate(x.viewedAt) : "" }));
    const ws = XLSX.utils.json_to_sheet(data); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "조회확인");
    XLSX.writeFile(wb, `Training365_조회확인_${post.id}_${kstToday()}.xlsx`);
    t365Log("조회확인", "Excel 내보내기", post.Title, { info: { 확인: `${s.done}/${s.total}` } });
  }
  return (
    <section className="mt-5 bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden" data-testid="confirm-panel">
      <div className="px-5 pt-4 pb-3 flex items-center gap-4 flex-wrap">
        <div className="w-10 h-10 rounded-xl flex items-center justify-center shrink-0" style={{ background: BRAND.accentSoft }}><BarChart3 size={19} style={{ color: BRAND.accent }} /></div>
        <div className="min-w-0 flex-1">
          <h3 className="font-semibold text-slate-800">조회확인 현황 <span className="text-xs font-normal text-slate-400">· 대상: 사용 중인 Agent {s.total}명</span></h3>
          <p className="text-xs text-slate-400 mt-0.5">Agent 가 「조회확인」을 누른 시각입니다. 본사 · 작성자 · 관리자는 조회확인 대상이 아닙니다. 열람 {s.viewers}명(전 역할).</p>
        </div>
        <div className="text-right shrink-0" data-testid="confirm-rate">
          <div className="text-2xl font-bold tabular-nums" style={{ color: pctColor(s.pct) }}>{s.total ? `${s.pct}%` : "–"}</div>
          <div className="text-[11.5px] text-slate-400 tabular-nums">확인 {s.done} / {s.total}</div>
        </div>
      </div>
      <div className="px-5 pb-3"><ProgressBar pct={s.pct} color={pctColor(s.pct)} /></div>
      <div className="px-4 py-2.5 border-y border-slate-100 flex items-center gap-2 flex-wrap bg-slate-50/50">
        <div className="flex items-center rounded-lg border border-slate-300 overflow-hidden h-8">
          {[["pending", `미확인 ${s.total - s.done}`], ["done", `확인 ${s.done}`], ["all", `전체 ${s.total}`]].map(([k, label], i) => (
            <button key={k} onClick={() => setView(k)} data-view={k} className={`px-3 h-full text-[12.5px] whitespace-nowrap ${i ? "border-l border-slate-300" : ""} ${view === k ? "text-white" : "text-slate-600 bg-white hover:bg-slate-50"}`} style={view === k ? { background: BRAND.accent } : undefined}>{label}</button>
          ))}
        </div>
        <div className="relative flex-1 min-w-[160px] max-w-xs">
          <Search size={14} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400" />
          <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="이름 · 메일 · 회사 검색" className="h-8 w-full border border-slate-300 rounded-lg text-[12.5px] bg-white pl-8 pr-3 focus:outline-none focus:ring-2 focus:ring-[#2F7B7A]/40" />
        </div>
        <button onClick={exportExcel} disabled={!s.total} className={`${btnCls} h-8 ml-auto`}><Download size={13} /> Excel</button>
      </div>
      <div className="overflow-x-auto max-h-[420px] overflow-y-auto">
        <table className="w-full text-[12.5px]" style={{ minWidth: 560 }}>
          <thead className="bg-slate-50 text-slate-500 text-[11.5px] sticky top-0">
            <tr>{["이름", "회사/지점", "조회확인", "확인 시각", "첫 열람"].map((h) => <th key={h} className="px-4 py-2 font-medium text-left whitespace-nowrap border-b border-slate-200">{h}</th>)}</tr>
          </thead>
          <tbody>
            {rows.length ? rows.map((x) => (
              <tr key={x.user.id || x.user.Email} className="border-t border-slate-100 first:border-t-0">
                <td className="px-4 py-2"><div className="text-slate-800 font-medium">{x.user.Title || "-"}</div><div className="text-[11px] text-slate-400">{x.user.Email}</div></td>
                <td className="px-4 py-2 text-slate-600">{x.user.Company || "-"}</td>
                <td className="px-4 py-2">{x.confirmedAt ? <span className="inline-flex items-center gap-1 text-emerald-700 font-medium"><CheckCircle2 size={13} />확인</span> : <span className="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-orange-50 text-orange-700">미확인</span>}</td>
                <td className="px-4 py-2 text-slate-600 tabular-nums whitespace-nowrap">{x.confirmedAt ? fmtDate(x.confirmedAt) : "-"}</td>
                <td className="px-4 py-2 text-slate-400 tabular-nums whitespace-nowrap">{x.viewedAt ? fmtDate(x.viewedAt) : "열람 안 함"}</td>
              </tr>
            )) : <tr><td colSpan={5} className="text-center text-slate-400 py-10">{s.total ? "조회 결과가 없습니다." : "등록된 Agent 가 없습니다 — 사용자 · 역할 관리에서 Agent 를 등록해 주세요."}</td></tr>}
          </tbody>
        </table>
      </div>
    </section>
  );
}

/* ------------------------------------------------------------------ */
/* 글쓰기 · 수정                                                        */
/* ------------------------------------------------------------------ */
function PostEditor({ ctx, post, defaultCat, onClose, onSaved }) {
  const writable = ctx.cats.filter((c) => ctx.canWrite(c.key));
  const isEdit = !!(post && post.id);
  const init = isEdit ? post.Category : (defaultCat && ctx.canWrite(defaultCat) ? defaultCat : (writable[0] || {}).key || "");
  const [cat, setCat] = useState(init);
  const [title, setTitle] = useState(isEdit ? post.Title || "" : "");
  const [body, setBody] = useState(isEdit ? post.Body || "" : "");
  const [pinned, setPinned] = useState(isEdit ? !!post.IsPinned : false);
  const [reqConfirm, setReqConfirm] = useState(isEdit ? !!post.RequireConfirm : !!(ctx.catMap[init] && ctx.catMap[init].required));
  const [videoUrl, setVideoUrl] = useState(isEdit ? post.VideoUrl || "" : "");
  const [videoFile, setVideoFile] = useState(isEdit ? parseFiles(post.VideoFileJson)[0] || null : null);
  const [newVideo, setNewVideo] = useState(null);
  const [files, setFiles] = useState(isEdit ? parseFiles(post.AttachmentsJson) : []);
  const [newFiles, setNewFiles] = useState([]);
  const [mode, setMode] = useState("write");
  const [saving, setSaving] = useState("");
  const ta = useRef(null);
  const touchedReq = useRef(isEdit);
  useEffect(() => { if (!touchedReq.current) setReqConfirm(!!(ctx.catMap[cat] && ctx.catMap[cat].required)); }, [cat]);

  // 표기 넣기 — 고른 글자를 감싸거나 줄 앞에 붙인다
  function wrap(before, after, placeholder) {
    const el = ta.current; if (!el) return;
    const s = el.selectionStart, e = el.selectionEnd; const sel = body.slice(s, e) || placeholder;
    const next = body.slice(0, s) + before + sel + after + body.slice(e);
    setBody(next);
    setTimeout(() => { el.focus(); el.setSelectionRange(s + before.length, s + before.length + sel.length); }, 0);
  }
  function linePrefix(prefix) {
    const el = ta.current; if (!el) return;
    const s = el.selectionStart, e = el.selectionEnd;
    const ls = body.lastIndexOf("\n", s - 1) + 1;
    const seg = body.slice(ls, e).split("\n").map((l, i) => (prefix === "1. " ? `${i + 1}. ` : prefix) + l.replace(/^(#{1,3}|[-*•]|\d{1,3}[.)]|>)\s+/, "")).join("\n");
    setBody(body.slice(0, ls) + seg + body.slice(e));
    setTimeout(() => el.focus(), 0);
  }
  function addLink() {
    const u = prompt("연결할 주소를 입력하세요 (https:// 로 시작)", "https://");
    if (u == null) return;
    if (!safeHttpsUrl(u)) { alert("https:// 로 시작하는 주소만 넣을 수 있습니다."); return; }
    wrap("[", `](${safeHttpsUrl(u)})`, "링크 글자");
  }
  function pickFiles(e) {
    const list = Array.from(e.target.files || []); e.target.value = "";
    const bad = list.filter((f) => T365_BLOCKED_EXT.includes(fileExt(f.name)));
    const big = list.filter((f) => f.size > T365_ATTACH_MAX);
    if (bad.length) alert(`실행 파일 · 웹 문서 형식은 올릴 수 없습니다: ${bad.map((f) => f.name).join(", ")}`);
    if (big.length) alert(`파일 하나는 ${fmtSize(T365_ATTACH_MAX)} 까지 올릴 수 있습니다: ${big.map((f) => f.name).join(", ")}`);
    const ok = list.filter((f) => !bad.includes(f) && !big.includes(f));
    if (files.length + newFiles.length + ok.length > 10) { alert("첨부는 한 게시물에 10개까지입니다."); return; }
    setNewFiles((prev) => [...prev, ...ok]);
  }
  function pickVideo(e) {
    const f = (e.target.files || [])[0]; e.target.value = "";
    if (!f) return;
    if (!T365_VIDEO_EXT.includes(fileExt(f.name))) { alert(`동영상은 ${T365_VIDEO_EXT.join(" · ")} 형식만 올릴 수 있습니다.`); return; }
    if (f.size > T365_VIDEO_MAX) { alert(`동영상은 ${fmtSize(T365_VIDEO_MAX)} 까지 올릴 수 있습니다. 더 큰 영상은 링크로 넣어 주세요.`); return; }
    setNewVideo(f);
  }
  async function save() {
    const t = title.trim();
    if (!cat || !ctx.canWrite(cat)) { alert("글을 쓸 수 있는 카테고리를 골라 주세요."); return; }
    if (!t) { alert("제목을 입력해 주세요."); return; }
    if (t.length > 200) { alert("제목은 200자까지 입력할 수 있습니다."); return; }
    if (!body.trim() && !files.length && !newFiles.length) { alert("본문을 입력하거나 파일을 첨부해 주세요."); return; }
    if (body.length > 60000) { alert("본문이 너무 깁니다(6만 자까지). 긴 자료는 파일로 첨부해 주세요."); return; }
    const vu = videoUrl.trim();
    if (vu && !safeHttpsUrl(vu)) { alert("동영상 링크는 https:// 로 시작하는 주소만 넣을 수 있습니다."); return; }
    if (vu.length > 255) { alert("동영상 링크는 255자까지 넣을 수 있습니다 — 짧은 공유 주소를 써 주세요."); return; }
    try {
      const uploaded = [];
      const all = [...newFiles, ...(newVideo ? [newVideo] : [])];
      for (let i = 0; i < newFiles.length; i++) {
        setSaving(`파일을 올리는 중입니다 (${i + 1}/${all.length})...`);
        uploaded.push(await tUploadFile(newFiles[i], (r) => setSaving(`파일을 올리는 중입니다 (${i + 1}/${all.length}) ${Math.round(r * 100)}%`)));
      }
      let vf = videoFile;
      if (newVideo) {
        setSaving(`동영상을 올리는 중입니다 (${all.length}/${all.length})...`);
        vf = await tUploadFile(newVideo, (r) => setSaving(`동영상을 올리는 중입니다 ${Math.round(r * 100)}%`));
      }
      setSaving("저장하고 있습니다...");
      const now = new Date().toISOString();
      const fields = {
        Title: t, Category: cat, Body: body, IsPinned: !!pinned, RequireConfirm: !!reqConfirm,
        VideoUrl: safeHttpsUrl(vu) || "", VideoFileJson: vf ? JSON.stringify([vf]) : "", AttachmentsJson: JSON.stringify([...files, ...uploaded]),
      };
      let id;
      if (isEdit) {
        await tUpdate(T365_LISTS.posts, post.id, { ...fields, UpdatedAt: now, UpdatedBy: ctx.me.name });
        id = post.id;
        const labels = { Title: "제목", Category: "카테고리", IsPinned: "중요", RequireConfirm: "조회확인 필수", VideoUrl: "동영상 링크" };
        const changes = {};
        Object.keys(labels).forEach((k) => { if (String(post[k] == null ? "" : post[k]) !== String(fields[k])) changes[labels[k]] = [post[k] == null ? "" : post[k], fields[k]]; });
        if ((post.Body || "") !== body) changes["본문"] = ["(이전 본문)", "(수정됨)"];
        const before = parseFiles(post.AttachmentsJson).length, after = files.length + uploaded.length;
        if (before !== after || uploaded.length) changes["첨부"] = [`${before}개`, `${after}개`];
        t365Log("게시물", "수정", t, { changes, info: { 게시물ID: id } });
      } else {
        const row = await tCreate(T365_LISTS.posts, { ...fields, AuthorEmail: ctx.me.email, AuthorName: ctx.me.name, PublishedAt: now });
        id = row.id;
        t365Log("게시물", "등록", t, { info: { 카테고리: (ctx.catMap[cat] || {}).label || cat, 게시물ID: id, 첨부: `${uploaded.length}개`, 중요: !!pinned, "조회확인 필수": !!reqConfirm } });
      }
      setSaving("");
      onSaved(id);
    } catch (e) { setSaving(""); alert(e.message); }
  }

  const tb = "w-8 h-8 rounded-md flex items-center justify-center text-slate-500 hover:bg-slate-100 hover:text-slate-800";
  return (
    <Modal title={isEdit ? "게시물 수정" : "글쓰기"} onClose={() => { if (!saving && confirm("작성 중인 내용을 닫을까요? 저장하지 않은 내용은 사라집니다.")) onClose(); }} xl>
      <div className="grid grid-cols-1 sm:grid-cols-3 gap-x-3">
        <Field label="카테고리" required>
          <select value={cat} onChange={(e) => setCat(e.target.value)} className={inputCls} data-testid="ed-cat">
            {writable.map((c) => <option key={c.key} value={c.key}>{c.label}</option>)}
          </select>
        </Field>
        <div className="sm:col-span-2">
          <Field label="제목" required><input value={title} onChange={(e) => setTitle(e.target.value)} maxLength={200} className={inputCls} placeholder="예: 기프트 세트 링크 접속 방법" data-testid="ed-title" /></Field>
        </div>
      </div>
      <div className="flex items-center gap-x-5 gap-y-2 flex-wrap mb-3.5 text-sm text-slate-700">
        <label className="inline-flex items-center gap-2 cursor-pointer"><input type="checkbox" checked={pinned} onChange={(e) => setPinned(e.target.checked)} className="w-4 h-4" data-testid="ed-pin" /> 중요 · 목록 맨 위에 고정</label>
        <label className="inline-flex items-center gap-2 cursor-pointer"><input type="checkbox" checked={reqConfirm} onChange={(e) => { touchedReq.current = true; setReqConfirm(e.target.checked); }} className="w-4 h-4" data-testid="ed-req" /> 조회확인 필수 <span className="text-xs text-slate-400">(Agent 확인 대기 목록 · 확인율 집계)</span></label>
      </div>
      <div className="mb-3.5">
        <div className="flex items-center justify-between mb-1">
          <label className="block text-xs font-medium text-slate-500">본문</label>
          <div className="flex items-center rounded-lg border border-slate-200 overflow-hidden h-7 text-xs">
            {[["write", "쓰기"], ["preview", "미리 보기"]].map(([k, l], i) => <button key={k} onClick={() => setMode(k)} className={`px-3 h-full ${i ? "border-l border-slate-200" : ""} ${mode === k ? "bg-slate-800 text-white" : "bg-white text-slate-600"}`}>{l}</button>)}
          </div>
        </div>
        {mode === "write" ? (
          <div className="border border-slate-300 rounded-lg overflow-hidden focus-within:ring-2 focus-within:ring-[#2F7B7A]/40">
            <div className="flex items-center gap-0.5 px-1.5 py-1 border-b border-slate-200 bg-slate-50 flex-wrap">
              <button type="button" className={tb} title="굵게" onClick={() => wrap("**", "**", "굵은 글자")}><Bold size={15} /></button>
              <button type="button" className={tb} title="소제목" onClick={() => linePrefix("## ")}><Heading2 size={15} /></button>
              <button type="button" className={tb} title="목록" onClick={() => linePrefix("- ")}><List size={15} /></button>
              <button type="button" className={tb} title="번호 목록" onClick={() => linePrefix("1. ")}><ListOrdered size={15} /></button>
              <button type="button" className={tb} title="안내 상자" onClick={() => linePrefix("> ")}><Quote size={15} /></button>
              <button type="button" className={tb} title="링크(https)" onClick={addLink}><Link2 size={15} /></button>
              <span className="ml-auto text-[11px] text-slate-400 px-2 hidden sm:inline">## 소제목 · - 목록 · **굵게** · &gt; 안내 · [글자](https://주소)</span>
            </div>
            <textarea ref={ta} value={body} onChange={(e) => setBody(e.target.value)} rows={13} className="w-full px-3 py-2.5 text-sm leading-relaxed focus:outline-none resize-y block" placeholder={"내용을 입력하세요.\n\n예)\n## 접속 방법\n1. CRM 에 로그인합니다\n2. 메뉴에서 **기프트 세트** 를 누릅니다\n> 권한이 없으면 담당자에게 요청해 주세요"} data-testid="ed-body"></textarea>
          </div>
        ) : (
          <div className="border border-slate-200 rounded-lg px-4 py-3 min-h-[200px] max-h-[420px] overflow-y-auto bg-white"><RichText text={body} /></div>
        )}
      </div>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-x-4">
        <Field label="첨부 파일" hint={`한 게시물에 10개 · 파일 하나 ${fmtSize(T365_ATTACH_MAX)} 까지 (실행 파일 제외)`}>
          <div className="space-y-1.5">
            {files.map((f) => (
              <div key={f.itemId} className="flex items-center gap-2 text-[13px] px-2.5 py-1.5 rounded-lg bg-slate-50 border border-slate-200">
                <Paperclip size={13} className="text-slate-400 shrink-0" /><span className="truncate flex-1">{f.name}</span><span className="text-[11px] text-slate-400">{fmtSize(f.size)}</span>
                <button onClick={() => setFiles((p) => p.filter((x) => x !== f))} className="text-slate-400 hover:text-red-600" aria-label="첨부 빼기"><X size={14} /></button>
              </div>
            ))}
            {newFiles.map((f, i) => (
              <div key={`n${i}`} className="flex items-center gap-2 text-[13px] px-2.5 py-1.5 rounded-lg bg-emerald-50 border border-emerald-200">
                <Upload size={13} className="text-emerald-600 shrink-0" /><span className="truncate flex-1">{f.name}</span><span className="text-[11px] text-slate-400">{fmtSize(f.size)}</span>
                <button onClick={() => setNewFiles((p) => p.filter((x) => x !== f))} className="text-slate-400 hover:text-red-600" aria-label="첨부 빼기"><X size={14} /></button>
              </div>
            ))}
            <label className={`${btnCls} cursor-pointer`}><Paperclip size={14} /> 파일 선택<input type="file" multiple onChange={pickFiles} className="hidden" data-testid="ed-files" /></label>
          </div>
        </Field>
        <Field label="동영상 (선택)" hint="글로 설명하기 어려운 내용은 영상 링크(https — YouTube 는 화면 안에서 재생) 또는 영상 파일로">
          <input value={videoUrl} onChange={(e) => setVideoUrl(e.target.value)} className={`${inputCls} mb-1.5`} placeholder="https://youtu.be/…" data-testid="ed-video-url" />
          {(newVideo || videoFile) ? (
            <div className="flex items-center gap-2 text-[13px] px-2.5 py-1.5 rounded-lg bg-slate-50 border border-slate-200">
              <Video size={13} className="text-slate-400 shrink-0" /><span className="truncate flex-1">{(newVideo || videoFile).name}</span><span className="text-[11px] text-slate-400">{fmtSize((newVideo || videoFile).size)}</span>
              <button onClick={() => { setNewVideo(null); setVideoFile(null); }} className="text-slate-400 hover:text-red-600" aria-label="동영상 빼기"><X size={14} /></button>
            </div>
          ) : (
            <label className={`${btnCls} cursor-pointer`}><Video size={14} /> 동영상 파일 올리기<input type="file" accept={T365_VIDEO_EXT.map((x) => "." + x).join(",")} onChange={pickVideo} className="hidden" data-testid="ed-video-file" /></label>
          )}
        </Field>
      </div>
      <div className="flex justify-end gap-2 mt-2 pt-4 border-t border-slate-100">
        <button onClick={onClose} disabled={!!saving} className="px-4 py-2 text-sm rounded-lg border border-slate-300">취소</button>

        else if (!role) { status = "오류"; reason = `역할 값(${roleRaw || "빈 값"}) — ${T365_ROLES.join(" / ")}`; }

          status = same ? "동일" : "변경";
        }
        seen.add(email);
        return { line: i + 2, email, name, company, role, wc, status, reason, exist };
      }).filter((x) => x.email || x.name);
