<head>
<meta charset="UTF-8" />

<title>Training365</title>

<script src="https://cdn.tailwindcss.com"></script>
<script type="importmap">

    "react": "https://esm.sh/react@18.3.1",

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.0/lib/msal-browser.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
  /* 글꼴 — 그룹웨어(GW)와 같은 맑은 고딕 하나로(영문 · 숫자 · 한글이 섞여도 같은 글꼴) · 로그인 카드 · 로딩 · 스크롤 막대(APS 공통) */
  html, body { margin: 0; padding: 0; height: 100%; background: #F5F6F8; font-family: 'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
  body, button, input, select, textarea, .font-sans { font-family: 'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
  body .font-mono { font-family: 'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
  #root { height: 100%; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: 'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; color: #64748B; font-size: 14px; }
  #login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(145deg,#0f2744 0%,#101B34 100%);font-family:'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif}
  .login-card{background:#fff;border-radius:16px;padding:40px 36px;width:340px;max-width:calc(100vw - 32px);box-sizing:border-box;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center}
  .login-title{font-size:1.05rem;font-weight:700;color:#101B34;margin-bottom:4px}
  .login-co{font-size:.8rem;color:#8A94A6;margin-bottom:6px}
  .login-guide{font-size:.8rem;color:#8A94A6;margin-bottom:20px;line-height:1.6}
  #loading{align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(145deg,#0f2744 0%,#101B34 100%);font-family:'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif}
  .loading-card{display:flex;flex-direction:column;align-items:center;gap:16px}
  .loading-spinner{width:40px;height:40px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:#2F7B7A;animation:t365-spin .85s linear infinite}
  .loading-text{color:rgba(255,255,255,.7);font-size:.85rem}
  @keyframes t365-spin{to{transform:rotate(360deg)}}
  .btn-login{background:linear-gradient(135deg,#2F7B7A,#1A2B4C);color:#fff;border:none;border-radius:10px;padding:13px 0;font-size:.92rem;font-weight:600;cursor:pointer;width:100%;font-family:inherit}
  .btn-login:disabled{background:#cbd5e0;cursor:not-allowed}
  #login-err{color:#C1352E;font-size:.78rem;margin-top:10px;display:none}
  .login-page-footer{position:fixed;bottom:0;left:0;right:0;padding:10px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:11px;color:rgba(255,255,255,.55);background:rgba(0,0,0,.18)}
  @media (max-width: 767px){ .login-page-footer{flex-direction:column;align-items:center;text-align:center;gap:2px;padding:8px 16px} }
  input[type=checkbox]{accent-color:#2F7B7A}
  nav.t365-side-nav { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.18) transparent; }
  nav.t365-side-nav::-webkit-scrollbar { width: 6px; }
  nav.t365-side-nav::-webkit-scrollbar-track { background: transparent; }
  nav.t365-side-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 6px; }
  nav.t365-side-nav:hover::-webkit-scrollbar-thumb { background: rgba(255,255,255,.34); }
  aside.t365-side { transition: width .28s cubic-bezier(.4,0,.2,1); }
  /* 게시물 본문 — 사용자가 쓴 글은 React 요소로만 그린다(HTML 해석 없음). 여기서는 간격 · 줄바꿈만 */
  .t365-body { font-size: 15.5px; line-height: 1.9; color: #1E293B; word-break: keep-all; overflow-wrap: anywhere; letter-spacing: -.003em; }
  .t365-body p { margin: 0 0 1em; white-space: pre-wrap; }
  .t365-body h3 { font-size: 1.2rem; font-weight: 700; color: #0F172A; margin: 1.7em 0 .6em; line-height: 1.45; letter-spacing: -.01em; }
  .t365-body > :first-child { margin-top: 0; }
  .t365-body ul, .t365-body ol { margin: 0 0 1.1em; padding-left: 1.4em; }
  .t365-body ul { list-style: disc; } .t365-body ol { list-style: decimal; }
  .t365-body li { margin: .25em 0; padding-left: .15em; }
  .t365-body li::marker { color: #94A3B8; }
  .t365-body ol li::marker { color: #2F7B7A; font-weight: 600; }
  .t365-body blockquote { margin: 0 0 1.1em; padding: .75em 1em; border-left: 3px solid #2F7B7A; background: #F2F8F8; border-radius: 0 10px 10px 0; color: #334155; white-space: pre-wrap; }
  .t365-body a { color: #1D6F8F; text-decoration: underline; text-decoration-color: rgba(29,111,143,.35); text-underline-offset: 3px; }
  .t365-body a:hover { text-decoration-color: currentColor; }
  .t365-body strong { font-weight: 700; color: #0F172A; }
  .t365-dlg-in { animation: t365-dlg .16s ease-out; }
  @keyframes t365-dlg { from { opacity: 0; transform: translateY(8px) scale(.985); } to { opacity: 1; transform: none; } }
  /* 게시물 팝업 — 바탕이 흐려지고 창이 살짝 커지며 떠오른다 */
  /* 게시판 홈 상자(포틀릿) — 위쪽 남색 굵은 선 · 흰 머리 · 회색 칸 머리 줄로 상자끼리 · 머리와 목록을 또렷하게 구분 */
  .t365-portlet { border-top: 3px solid #1A2B4C; box-shadow: 0 1px 2px rgba(15,23,42,.05), 0 6px 18px -10px rgba(15,23,42,.18); }
  .t365-portlet-head { display: flex; align-items: center; gap: .5rem; padding: 0 1rem; height: 3rem; background: #fff; border-bottom: 1px solid #E2E8F0; }
  /* 게시판 홈 표 — 칸 사이 옅은 세로선(줄 전체 높이) */
  .t365-cols > * + * { border-left: 1px solid #E9EEF3; padding-left: 12px; }
  @media (max-width: 639px) { .t365-cols > * + * { border-left: 0; padding-left: 0; } }
  .t365-meta > span + span::before { content: ""; display: inline-block; width: 1px; height: 11px; background: #E2E8F0; margin: 0 12px; }
  .t365-pop { animation: t365-pop .22s cubic-bezier(.2,.9,.3,1.15); }
  @keyframes t365-pop { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }
  .t365-fade { animation: t365-fade .18s ease-out; }
  @keyframes t365-fade { from { opacity: 0; } to { opacity: 1; } }
  .t365-clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  /* 게시판 — 제목 앞 작은 표시(공지 · 필수) · 검색어 강조 */
  .t365-pill { display: inline-flex; align-items: center; gap: 2px; flex-shrink: 0; font-size: 10.5px; font-weight: 700; padding: 0 5px; line-height: 18px; border-radius: 4px; white-space: nowrap; }
  /* 게시판 홈 배너 — 기본 배너 무늬 · 그림 천천히 확대 · 글씨 올라오기 · 넘김 진행 막대 */
  .t365-hero { background: radial-gradient(120% 140% at 85% 10%, #1F5C66 0%, rgba(31,92,102,0) 55%), linear-gradient(115deg, #0B1428 0%, #101B34 45%, #17304F 100%); }
  .t365-hero-lines { background: repeating-linear-gradient(115deg, rgba(255,255,255,.035) 0 2px, transparent 2px 26px); mask-image: linear-gradient(90deg, transparent 20%, #000 75%); -webkit-mask-image: linear-gradient(90deg, transparent 20%, #000 75%); }
  .t365-hero-truck { animation: t365-drive 1.1s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes t365-drive { from { opacity: 0; transform: translateX(60px); } to { opacity: 1; transform: none; } }
  .t365-kenburns { animation: t365-kb 7s ease-out both; }
  @keyframes t365-kb { from { transform: scale(1.0); } to { transform: scale(1.07); } }
  .t365-rise { animation: t365-rise .7s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes t365-rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .t365-progress { width: 0; animation: t365-prog 6s linear forwards; }
  @keyframes t365-prog { to { width: 100%; } }
  @media (prefers-reduced-motion: reduce) { .t365-kenburns, .t365-rise, .t365-hero-truck, .t365-progress { animation: none !important; } .t365-progress { width: 100%; } }
  mark.t365-hl { background: #FEF08A; color: inherit; border-radius: 2px; padding: 0 1px; }

html, * { scrollbar-width: thin; scrollbar-color: #CBD5E1 transparent; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: #94A3B8; background-clip: padding-box; }
</style>
</head>

const T365_PERM_GROUPS = [

const T365_PERM_ITEMS = T365_PERM_GROUPS.flatMap((g) => g.items.map((it) => ({ ...it, group: g.key })));

function capLevel(item, lv) { if (item.locked) return "v"; if (lv === "e" && !item.edit) return "v"; return lv === "e" || lv === "v" ? lv : "n"; }
function noPerms() { const o = {}; T365_PERM_ITEMS.forEach((it) => { o[it.key] = it.locked ? "v" : "n"; }); return o; }
function rolePreset(role, writerCats) {

  const wc = new Set(writerCats || []);

    else if (role === "작성자") lv = it.group === "admin" ? "n" : it.group === "boards" && wc.has(it.cat) ? "e" : "v";

function parsePermJson(s) {

    if (!v || typeof v !== "object" || Array.isArray(v)) return { ok: false, map: {} };
    const map = {};
    Object.keys(v).forEach((k) => { if (T365_PERM_KEYS.has(k) && ["n", "v", "e"].includes(v[k])) map[k] = v[k]; });
    return { ok: true, map };

// 한 사용자의 실제 권한 — { perms, source: bootstrap | preset | custom | broken | none }
function permsOf(row, opts) {
  if (opts && opts.bootAdmin) { const o = {}; T365_PERM_ITEMS.forEach((it) => { o[it.key] = capLevel(it, "e"); }); return { perms: o, source: "bootstrap" }; }
  if (!row || row.Active === false || !T365_ROLES.includes(row.Role)) return { perms: noPerms(), source: "none" };
  const base = rolePreset(row.Role, catKeysOf(row.WriterCategories));
  const p = parsePermJson(row.Permissions);

const _tListIds = {};

// 5,000건 임계 대비 nextLink 를 따라 끝까지(MKQR mkListAll 과 같음)
async function tListAll(listName, extraQuery = "") {
  const token = await getGraphToken();
  const listId = await tListId(listName);
  let items = [];
  let url = `${GRAPH}/sites/${_siteId}/lists/${listId}/items?expand=fields&$top=500${extraQuery}`;
  while (url) {
    const res = await fetch(url, { headers: { Authorization: "Bearer " + token, Prefer: "HonorNonIndexedQueriesWarningMayFailRandomly" } });
    if (!res.ok) { const e = new Error(`${listName} 조회 실패 (${res.status})`); e.status = res.status; throw e; }
    const data = await res.json();
    items = items.concat(data.value || []);

/* 조회 · 조회확인 기록(training365_Reads) — 사람 × 게시물 한 행           */
/* Title = 「게시물ID|메일」(고유 값). 다시 열면 그 행의 LastViewedAt · ViewCount 만,      */
/* 조회확인은 ConfirmedAt 이 비어 있을 때 한 번만 채운다(두 번 눌러도 · 두 탭에서도 한 행 · 처음 시각 유지). */
/* ------------------------------------------------------------------ */
const readKey = (postId, email) => `${postId}|${normEmail(email)}`;
// 같은 키(게시물 × 사람) 작업은 이 탭 안에서 한 줄로 세운다 — 연타 · 열람과 확인이 겹쳐도 행이 둘 생기지 않게.
// 탭이 여럿이면 Title 「고유 값 적용」 이 막고(409), 그때는 다시 읽어 그 행을 쓴다.
const _readQ = new Map();
function serialRead(key, fn) {
  const prev = _readQ.get(key) || Promise.resolve();
  const p = prev.catch(() => {}).then(fn);

  return p;
}
async function tFindRead(key) {

  return rows.filter((r) => r.Title === key).sort((a, b) => Number(a.id) - Number(b.id))[0] || null;
}
// opts.confirm — Agent 가 조회확인 필수 글을 열면 열람과 같은 쓰기로 ConfirmedAt 도 채운다(이미 있으면 처음 시각 유지)
function t365RecordView(post, me, opts) {
  const key = readKey(post.id, me.email);
  const confirm = !!(opts && opts.confirm) && me.role === "Agent";
  return serialRead(key, async () => {
    const now = new Date().toISOString();
    let row = await tFindRead(key);
    if (row) {
      const f = { LastViewedAt: now, ViewCount: (Number(row.ViewCount) || 0) + 1, ...(confirm && !row.ConfirmedAt ? { ConfirmedAt: now } : {}) };
      await tUpdate(T365_LISTS.reads, row.id, f);
      return { ...row, ...f };
    }
    const fields = { Title: key, PostId: String(post.id), UserEmail: normEmail(me.email), UserName: me.name, Company: me.company || "", Role: me.role, FirstViewedAt: now, LastViewedAt: now, ViewCount: 1, ...(confirm ? { ConfirmedAt: now } : {}) };
    try { return await tCreate(T365_LISTS.reads, fields); }
    catch (e) {   // 다른 탭이 먼저 만든 경우(고유 값 제약)
      row = await tFindRead(key); if (!row) throw e;
      if (confirm && !row.ConfirmedAt) { await tUpdate(T365_LISTS.reads, row.id, { ConfirmedAt: now }); row = { ...row, ConfirmedAt: now }; }
      return row;
    }
  });
}
function t365Confirm(post, me) {
  if (me.role !== "Agent") return Promise.reject(new Error("조회확인은 Agent 만 할 수 있습니다."));
  const key = readKey(post.id, me.email);
  return serialRead(key, async () => {
    const now = new Date().toISOString();
    let row = await tFindRead(key);
    if (row && row.ConfirmedAt) return row;   // 이미 확인 — 처음 시각을 지우거나 바꾸지 않는다
    if (row) { await tUpdate(T365_LISTS.reads, row.id, { ConfirmedAt: now, LastViewedAt: now }); return { ...row, ConfirmedAt: now, LastViewedAt: now }; }
    const fields = { Title: key, PostId: String(post.id), UserEmail: normEmail(me.email), UserName: me.name, Company: me.company || "", Role: me.role, FirstViewedAt: now, LastViewedAt: now, ViewCount: 1, ConfirmedAt: now };
    try { return await tCreate(T365_LISTS.reads, fields); }
    catch (e) {
      row = await tFindRead(key); if (!row) throw e;
      if (!row.ConfirmedAt) { await tUpdate(T365_LISTS.reads, row.id, { ConfirmedAt: now }); row = { ...row, ConfirmedAt: now }; }
      return row;
    }
  });
}
// 게시물별 · 사람별로 묶기 — 혹시 같은 키의 행이 둘이면(고유 값 제약 전 기록) 가장 이른 확인 시각 · 조회 수 합
function indexReads(reads) {
  const byPost = new Map();
  (reads || []).forEach((r) => {
    const pid = String(r.PostId || String(r.Title || "").split("|")[0] || "");
    const em = normEmail(r.UserEmail || String(r.Title || "").split("|")[1]);
    if (!pid || !em) return;
    if (!byPost.has(pid)) byPost.set(pid, new Map());
    const m = byPost.get(pid);
    const cur = m.get(em);
    if (!cur) { m.set(em, { ...r, UserEmail: em, ViewCount: Number(r.ViewCount) || 1 }); return; }
    const minIso = (a, b) => (!a ? b : !b ? a : Date.parse(a) <= Date.parse(b) ? a : b);
    m.set(em, { ...cur, ConfirmedAt: minIso(cur.ConfirmedAt, r.ConfirmedAt), FirstViewedAt: minIso(cur.FirstViewedAt, r.FirstViewedAt),
      LastViewedAt: [cur.LastViewedAt, r.LastViewedAt].filter(Boolean).sort().pop(), ViewCount: (Number(cur.ViewCount) || 1) + (Number(r.ViewCount) || 1) });
  });

}

  const notice = vis.filter((p) => p.IsPinned || p.RequireConfirm).sort((a, b) => (isTodo(b) ? 1 : 0) - (isTodo(a) ? 1 : 0) || (b.IsPinned ? 1 : 0) - (a.IsPinned ? 1 : 0) || byNewest(a, b));

  const popular = vis.map((p) => ({ p, v: viewStats(readIdx, p.id).views })).filter((x) => x.v > 0).sort((a, b) => b.v - a.v || byNewest(a.p, b.p)).slice(0, 5);
  const [q, setQ] = useState("");
  const [editing, setEditing] = useState(null);
  const open = openId ? vis.find((p) => String(p.id) === String(openId)) : null;
  const searchRef = useRef(null);
  useEffect(() => {
    const k = (e) => { if (e.key === "/" && !isTyping(e) && !e.ctrlKey && !e.metaKey && searchRef.current) { e.preventDefault(); searchRef.current.focus(); } };
    window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k);
  }, []);

  return (
    <div className="w-full">
      <BannerCarousel ctx={ctx} banners={banners || []} onManage={onManageBanners} strip={
        <div className="flex flex-col min-[1400px]:flex-row min-[1400px]:items-end gap-3 min-[1400px]:gap-5">
          <div className="min-w-0 flex-1"><BoardIconStrip ctx={ctx} onGo={(k) => setTab("cat:" + k)} /></div>
          {/* 전체 검색 — 배너 안 오른쪽 아래(유리 느낌) */}
          <form onSubmit={(e) => { e.preventDefault(); onSearch(q.trim()); }} className="flex items-center gap-1.5 w-full lg:max-w-[520px] min-[1400px]:w-[340px] shrink-0 min-[1400px]:mb-2" role="search" data-testid="home-search">
            <div className="relative flex-1">
              <Search size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-white/60" />
              <input ref={searchRef} value={q} onChange={(e) => setQ(e.target.value)} placeholder="게시물 검색" title="모든 게시판의 제목 · 내용 · 첨부 이름에서 찾습니다" aria-label="게시물 검색" className="h-10 w-full rounded-lg text-[13px] pl-9 pr-9 text-white placeholder:text-white/55 bg-white/10 border border-white/25 backdrop-blur focus:bg-white focus:text-slate-900 focus:placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-[#7FD1CB]/60 transition-colors" data-testid="home-search-input" />
              <kbd className="hidden md:inline absolute right-2.5 top-1/2 -translate-y-1/2 text-[10.5px] text-white/60 border border-white/25 rounded px-1.5 leading-[18px]">/</kbd>
            </div>
            <button type="submit" className="h-10 px-4 rounded-lg text-[13px] font-semibold bg-white text-slate-900 hover:bg-[#E4F1F0] shrink-0">검색</button>
          </form>
        </div>
      } />
      {/* 인사 · 요약 · 전체 검색 — 배너로 옮김(검색) · 인사 줄은 없앰 */}

      <div className="grid grid-cols-1 xl:grid-cols-12 gap-4">
        <div className="xl:col-span-8 min-w-0 space-y-4">
          {/* 공지 · 필수 */}
          <section className="bg-white rounded-xl border border-slate-200 overflow-hidden t365-portlet" data-testid="notice-strip">
            <div className="t365-portlet-head">
              <span className="w-6 h-6 rounded-md flex items-center justify-center shrink-0" style={{ background: "#FDEEE6" }}><Megaphone size={13} style={{ color: "#C2410C" }} /></span>
              <h2 className="text-[15px] font-bold text-slate-900 tracking-[-0.01em]">공지 · 필수</h2>
              {ctx.isAgent && (todo.length
                ? <span className="text-[11px] font-bold px-2 rounded-full leading-5 text-white" style={{ background: "#C2410C" }} data-testid="todo-required">확인 필요 {todo.length}건</span>
                : <span className="text-[11px] font-medium px-2 rounded-full leading-5 bg-emerald-50 text-emerald-700" data-testid="todo-required">모두 확인 완료</span>)}
              <span className="text-[11.5px] text-slate-400 hidden md:inline truncate">{ctx.isAgent ? "필수 자료는 열어 보면 자동으로 조회확인됩니다" : "꼭 읽어야 하는 공지와 필수 교육자료입니다"}</span>
              {notice.length > NOTICE_MAX && <button onClick={() => onSearch("", "notice")} className="ml-auto text-[12px] text-slate-400 hover:text-slate-700 whitespace-nowrap shrink-0" data-testid="notice-more">더보기 <ChevronRight size={12} className="inline -mt-0.5" /></button>}
            </div>
            {notice.length > 0 && <HomeColHead>
              <span className="w-[104px] shrink-0 flex items-center">구분</span><span className="w-[132px] shrink-0 hidden sm:flex items-center">게시판</span><span className="flex-1 flex items-center">제목</span>
              <span className="w-[68px] shrink-0 hidden md:flex items-center justify-end">작성일</span>{ctx.isAgent && <span className="w-[96px] shrink-0 flex items-center justify-end">조회확인</span>}
            </HomeColHead>}
            {notice.length ? notice.slice(0, NOTICE_MAX).map((p) => {
              const c = catMap[p.Category]; const r = myRow(p);
              return (
                <button key={p.id} onClick={() => openPost(p)} data-notice={p.id} title={p.Title} className="t365-cols w-full text-left px-4 h-11 flex items-stretch gap-3 border-t border-[#E9EEF3] first:border-t-0 even:bg-slate-50/70 hover:!bg-[#EEF6F5] min-w-0">
                  <span className="w-[104px] shrink-0 flex items-center gap-1">{p.IsPinned && <NoticePill />}{p.RequireConfirm && <ReqPill />}</span>
                  <BoardCell cat={c} />
                  <span className="min-w-0 flex-1 flex items-center gap-1.5">
                    <span className={`min-w-0 truncate text-[13.5px] ${r ? "text-slate-600" : "font-semibold text-slate-900"}`}>{p.Title}</span>
                    <PostMarks p={p} compact />
                  </span>
                  <span className="text-[11.5px] text-slate-400 tabular-nums shrink-0 hidden md:flex items-center justify-end w-[68px]">{shortDate(p.PublishedAt || p._created)}</span>
                  {ctx.isAgent && <span className="shrink-0 w-[96px] flex items-center justify-end">
                    {ctx.isAgent ? (p.RequireConfirm ? (r && r.ConfirmedAt ? <ConfirmedPill /> : <UnconfirmedPill />) : <span className="text-[11.5px] text-slate-300">-</span>) : null}
                  </span>}
                </button>
              );
            }) : <SmallEmpty icon={CheckCircle2}>지금 걸려 있는 공지 · 필수 자료가 없습니다.</SmallEmpty>}
          </section>

          {/* 최근 게시물 — 모든 게시판을 하나의 목록으로 */}
          <section className="bg-white rounded-xl border border-slate-200 overflow-hidden t365-portlet" data-testid="recent-board">
            <div className="t365-portlet-head">
              <span className="w-6 h-6 rounded-md flex items-center justify-center shrink-0" style={{ background: BRAND.accentSoft }}><LayoutList size={13} style={{ color: BRAND.accent }} /></span>
              <h2 className="text-[15px] font-bold text-slate-900 tracking-[-0.01em]">최근 게시물</h2>
              <span className="text-[11.5px] text-slate-400 hidden sm:inline">모든 게시판 · 굵은 제목 = 안 읽은 글</span>
              <button onClick={() => setTab("all")} className="ml-auto text-[12px] text-slate-400 hover:text-slate-700 inline-flex items-center shrink-0" data-testid="recent-more">전체 게시물<ChevronRight size={13} /></button>
            </div>
            {vis.length > 0 && <HomeColHead>
              <span className="w-[132px] shrink-0 hidden sm:flex items-center">게시판</span><span className="flex-1 flex items-center">제목</span>
              <span className="w-[108px] shrink-0 hidden md:flex items-center">작성자</span><span className="w-[68px] shrink-0 flex items-center justify-end">작성일</span>
            </HomeColHead>}
            {vis.length ? vis.slice(0, 12).map((p) => {
              const c = catMap[p.Category]; const rd = !!myRow(p);
              return (
                <button key={p.id} onClick={() => openPost(p)} data-wpost={p.id} title={p.Title} className="t365-cols w-full text-left px-4 h-11 flex items-stretch gap-3 border-t border-[#E9EEF3] first:border-t-0 even:bg-slate-50/70 hover:!bg-[#EEF6F5] min-w-0">
                  <BoardCell cat={c} />
                  <span className="min-w-0 flex-1 flex items-center gap-1.5">
                    {p.IsPinned && <NoticePill />}{p.RequireConfirm && <ReqPill />}
                    <span className={`min-w-0 truncate text-[13.5px] ${rd ? "text-slate-600" : "font-semibold text-slate-900"}`}>{p.Title}</span>
                    <PostMarks p={p} compact />
                  </span>
                  <span className="w-[108px] text-[12px] text-slate-500 shrink-0 hidden md:flex items-center min-w-0"><span className="truncate">{p.AuthorName || ""}</span></span>
                  <span className="w-[68px] text-[11.5px] text-slate-400 tabular-nums shrink-0 flex items-center justify-end">{shortDate(p.PublishedAt || p._created)}</span>
                </button>
              );
            }) : <SmallEmpty>아직 올라온 글이 없습니다.</SmallEmpty>}
          </section>
        </div>

        {/* 오른쪽 작은 상자 */}
        <aside className="xl:col-span-4 space-y-3 min-w-0">
          {ctx.isAgent && (
            <WidgetCard icon={BookOpenCheck} tint="#C2410C" title="내 확인 대기" testid="w-todo" right={todo.length ? <span className="text-[11px] font-bold px-1.5 rounded-full leading-[18px] text-white" style={{ background: "#C2410C" }}>{todo.length}</span> : null}>
              {todo.length ? todo.slice(0, 5).map((p) => (
                <button key={p.id} onClick={() => openPost(p)} title={p.Title} className="w-full text-left px-4 h-10 flex items-center gap-2 border-t border-slate-100 first:border-t-0 hover:bg-orange-50/40">
                  <span className="w-1.5 h-1.5 rounded-full shrink-0" style={{ background: "#C2410C" }}></span>
                  <span className="truncate text-[13px] text-slate-800 flex-1">{p.Title}</span>
                  <UnconfirmedPill />
                </button>
              )) : <SmallEmpty icon={CheckCircle2}>필수 자료를 모두 확인했습니다.</SmallEmpty>}
            </WidgetCard>
          )}
          <WidgetCard icon={TrendingUp} title="많이 본 글" tint="#2563EB" testid="w-popular" tone="soft">
            {popular.length ? (
              <ol className="[&>li:first-child>button]:border-t-0">
                {popular.map(({ p, v }, i) => (
                  <li key={p.id}>
                    <button onClick={() => openPost(p)} title={p.Title} className="w-full text-left px-4 h-11 flex items-center gap-2.5 hover:bg-slate-50 border-t border-slate-100">
                      <span className={`w-5 h-5 rounded-md flex items-center justify-center text-[11.5px] font-bold tabular-nums shrink-0 ${i < 3 ? "text-white" : "text-slate-500 bg-white border border-slate-200"}`} style={i < 3 ? { background: BRAND.accent } : undefined}>{i + 1}</span>
                      <span className="truncate text-[13px] text-slate-700 flex-1">{p.Title}</span>
                      <span className="text-[11px] text-slate-400 tabular-nums shrink-0 inline-flex items-center gap-0.5"><Eye size={11} />{v}</span>
                    </button>
                  </li>
                ))}
              </ol>
            ) : <SmallEmpty icon={Eye}>아직 조회 기록이 없습니다.</SmallEmpty>}
          </WidgetCard>
        </aside>
      </div>
      {/* 홈에서 누른 글은 홈 위 팝업으로(게시판으로 옮겨 가지 않음) — 위 · 아래 단추는 홈 목록(최신순) 기준 */}
      {openId && (open
        ? <PostDetail key={open.id} ctx={ctx} post={open} siblings={vis} listLabel="Overview" onOpen={(id) => setOpenId(id)} onBack={() => setOpenId(null)} onEdit={() => setEditing({ post: open })} suspended={!!editing} />
        : (
          <PostModalShell onClose={() => setOpenId(null)} label="게시물 없음" narrow>
            <div className="p-10 text-center">
              <FileText size={30} className="mx-auto text-slate-300 mb-3" />
              <div className="text-slate-600 text-sm mb-5">게시물을 찾을 수 없습니다 — 삭제되었거나 볼 수 없는 게시판입니다.</div>
              <button onClick={() => setOpenId(null)} className={btnCls} data-testid="btn-back"><ChevronLeft size={14} /> 닫기</button>
            </div>
          </PostModalShell>
        ))}
      {editing && <PostEditor ctx={ctx} post={editing.post} defaultCat={editing.post.Category} onClose={() => setEditing(null)} onSaved={async (id) => {
        setEditing(null); await ctx.reload(); toast("게시물을 수정했습니다");
        if (id) setOpenId(String(id));
      }} />}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* 게시판 목록 — 인트라넷 게시판 표                                        */
/* 위: 보기 탭(전체 · 안 읽은 글 · 공지 · 확인 필요) + 검색 · 글쓰기                  */
/* 가운데: 총 건수 · 분류 · 정렬 · 보기 방식(목록 / 요약) · 쪽당 글 수            */
/* 공지 글은 쪽마다 맨 위 · 검색어 강조 · 잘린 제목은 말풍선 · 쪽 번호(10쪽 묶음)       */
/* ------------------------------------------------------------------ */
function BoardTab({ ctx, catKey, openId, setOpenId, seed, onSeedUsed }) {
  const { posts, catMap, cats, readIdx, me } = ctx;
  const showRate = ctx.canView("status");
  const [q, setQ] = useState((seed && seed.q) || "");
  const [field, setField] = useState("tb");
  const [filter, setFilter] = useState((seed && seed.filter) || "all");
  const [catFilter, setCatFilter] = useState("");
  const [sort, setSort] = useState("new");
  const [page, setPage] = useState(1);
  const [editing, setEditing] = useState(null);
  const [view, setView] = usePref("view", "list", ["list", "summary"]);
  const [size, setSize] = usePref("size", "15", ["15", "30", "50"]);
  const searchRef = useRef(null);
  const firstRun = useRef(true);
  useEffect(() => { setPage(1); }, [q, field, filter, catFilter, catKey, sort, size]);
  useEffect(() => { if (firstRun.current) { firstRun.current = false; return; } setQ(""); setFilter("all"); setCatFilter(""); setSort("new"); }, [catKey]);
  useEffect(() => { if (seed && onSeedUsed) onSeedUsed(); }, []);   // 게시판 홈에서 넘긴 검색어 · 보기 탭은 처음 한 번만(다른 게시판을 다녀와도 다시 걸리지 않게)
  useEffect(() => {
    if (openId) return;
    const k = (e) => { if (e.key === "/" && !isTyping(e) && !e.ctrlKey && !e.metaKey && searchRef.current) { e.preventDefault(); searchRef.current.focus(); } };
    window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k);
  }, [openId]);
  const PAGE_SIZE = Number(size) || 15;
  const myRow = (p) => (readIdx.get(String(p.id)) || new Map()).get(normEmail(me.email));
  const scope = posts.filter((p) => (catKey ? p.Category === catKey : !!catMap[p.Category]));
  const numOf = new Map([...scope].sort((a, b) => postTs(a) - postTs(b) || Number(a.id) - Number(b.id)).map((p, i) => [p.id, i + 1]));   // 번호 = 게시 순서(APS 공통)
  const qq = q.trim().toLowerCase();
  const hit = (p) => {
    if (!qq) return true;
    const t = String(p.Title || "").toLowerCase(), b = (plainPreview(p.Body, 4000) + " " + parseFiles(p.AttachmentsJson).map((f) => f.name).join(" ")).toLowerCase(), a = String(p.AuthorName || "").toLowerCase();
    return field === "t" ? t.includes(qq) : field === "b" ? b.includes(qq) : field === "a" ? a.includes(qq) : t.includes(qq) || b.includes(qq);
  };
  const rateOf = (p) => (p.RequireConfirm ? confirmStats(p, readIdx, ctx.agents) : null);
  const isTodo = (p) => p.RequireConfirm && !(myRow(p) && myRow(p).ConfirmedAt);
  const passFilter = (p, f) => f === "all" ? true : f === "unread" ? !myRow(p) : f === "notice" ? (p.IsPinned || p.RequireConfirm) : f === "pinned" ? p.IsPinned : f === "todo" ? isTodo(p) : f === "required" ? p.RequireConfirm : true;
  const base = scope.filter((p) => !catFilter || p.Category === catFilter).filter(hit);
  const view0 = base.filter((p) => passFilter(p, filter));
  const sorter = sort === "old" ? (a, b) => -byNewest(a, b) : sort === "views" ? (a, b) => viewStats(readIdx, b.id).views - viewStats(readIdx, a.id).views || byNewest(a, b)
    : sort === "rate" ? (a, b) => ((rateOf(a) || {}).pct ?? 101) - ((rateOf(b) || {}).pct ?? 101) || byNewest(a, b) : byNewest;
  // 공지는 쪽마다 맨 위(검색 · 공지 보기 · 정렬을 바꿨을 때는 섞어서 그대로)
  const pinTop = filter === "all" || filter === "unread";
  const pinnedRows = pinTop && !qq ? view0.filter((p) => p.IsPinned).sort(byNewest) : [];
  const normalRows = (pinnedRows.length ? view0.filter((p) => !p.IsPinned) : view0).sort(sorter);
  const totalPages = Math.max(1, Math.ceil(normalRows.length / PAGE_SIZE));
  const pageSafe = Math.min(page, totalPages);
  const pageRows = normalRows.slice((pageSafe - 1) * PAGE_SIZE, pageSafe * PAGE_SIZE);
  const rows = [...pinnedRows.map((p) => ({ p, pin: true })), ...pageRows.map((p) => ({ p, pin: false }))];
  const canWriteHere = catKey ? ctx.canWrite(catKey) : cats.some((c) => ctx.canWrite(c.key));
  const open = openId ? posts.find((p) => String(p.id) === String(openId)) : null;

  // 글 보기는 목록 위의 큰 창(주소 #/cat/키/번호 로 바로 열림) — 목록은 뒤에 그대로(t365-ui2)
  const openOk = !!(open && (!catKey || open.Category === catKey) && catMap[open.Category]);
  const siblings = [...scope].sort(byNewest);
  const closeModal = () => setOpenId(null);

  const cnt = (f) => base.filter((p) => passFilter(p, f)).length;
  const tabs = [["all", "전체"], ["unread", "안 읽은 글"], ["notice", "공지 · 필수"], ctx.isAgent ? ["todo", "확인 필요"] : null].filter(Boolean);
  const ctrl = "h-9 border border-slate-300 rounded-lg text-[13px] bg-white focus:outline-none focus:ring-2 focus:ring-[#2F7B7A]/40";
  const StatusCell = ({ p }) => {
    if (ctx.isAgent) {
      const r = myRow(p);
      return r && r.ConfirmedAt ? <ConfirmedPill />
        : p.RequireConfirm ? <UnconfirmedPill />
        : <span className="text-[11.5px] text-slate-300">-</span>;
    }
    const s = rateOf(p);
    return s ? <MiniRate s={s} w={40} /> : <span className="text-[11.5px] text-slate-300">-</span>;
  };
  const showStatusCol = ctx.isAgent || showRate;
  const colCount = 5 + (catKey ? 0 : 1) + (showStatusCol ? 1 : 0);   // 빈 줄 colSpan 이 실제 열 수와 다르면 고정 표가 왼쪽으로 쏠린다(10-12 화면)
  const block = Math.floor((pageSafe - 1) / 10);
  const pages = Array.from({ length: Math.min(10, totalPages - block * 10) }, (_, i) => block * 10 + i + 1);
  const pgBtn = "min-w-[32px] h-8 px-2 rounded-md text-[13px] tabular-nums inline-flex items-center justify-center disabled:opacity-30";
  const emptyMsg = scope.length ? (qq ? <>「{q.trim()}」 검색 결과가 없습니다. <button onClick={() => setQ("")} className="font-medium underline underline-offset-2" style={{ color: BRAND.accent }}>검색어 지우기</button></> : filter === "unread" ? "안 읽은 글이 없습니다 — 모두 읽었습니다." : filter === "todo" ? "확인할 필수 자료가 없습니다." : "조건에 맞는 글이 없습니다.")
    : <>등록된 게시물이 없습니다.{canWriteHere && <> <button onClick={() => setEditing({})} className="font-medium underline underline-offset-2" style={{ color: BRAND.accent }}>첫 글 쓰기</button></>}</>;
  const TitleLine = ({ p, pin, big, inTable }) => {
    const unread = !myRow(p);
    return (
      <div className="flex items-center gap-1.5 min-w-0">
        {pin && !inTable && <NoticePill />}
        {p.RequireConfirm && <ReqPill />}
        <span className={`truncate ${big ? "text-[15px]" : "text-[14px]"} ${pin || unread ? "font-semibold text-slate-900" : "text-slate-600"}`} data-unread-title={unread ? "1" : undefined}><Hl text={p.Title} q={field === "t" || field === "tb" ? q : ""} /></span>
        <PostMarks p={p} compact />
      </div>
    );
  };

  return (
    <div className="w-full">
      <div className="bg-white rounded-xl border border-slate-200 overflow-hidden t365-portlet" data-testid="board">
        {/* 보기 탭 · 검색 · 글쓰기 */}
        <div className="px-3 md:px-4 border-b border-slate-200 flex flex-col md:flex-row md:items-center gap-2 md:gap-3 pt-2 md:pt-0">
          <div className="flex items-end gap-0.5 overflow-x-auto -mb-px order-2 md:order-1" role="tablist">
            {tabs.map(([k, label]) => {
              const on = filter === k || (k === "notice" && filter === "pinned") || (k === "notice" && filter === "required" && !ctx.isAgent);
              const n = cnt(k);
              return (
                <button key={k} role="tab" aria-selected={on} onClick={() => setFilter(k)} data-filter={k}
                  className={`relative px-2.5 md:px-3 h-12 text-[13.5px] whitespace-nowrap inline-flex items-center gap-1.5 border-b-2 ${on ? "text-slate-900 font-semibold" : "text-slate-500 hover:text-slate-800 border-transparent"}`}
                  style={on ? { borderColor: BRAND.accent } : undefined}>
                  {label}

            return (
              <button key={(pin ? "pin" : "") + p.id} onClick={() => setOpenId(p.id)} data-post={p.id} className={`w-full text-left px-4 ${view === "summary" ? "md:px-5 py-3.5" : "py-3"} border-t border-slate-100 first:border-t-0 block ${pin ? "bg-amber-50/50 hover:bg-amber-50" : "hover:bg-slate-50"}`}>
                <TitleLine p={p} pin={pin} big={view === "summary"} />
                {pv && <p className="text-[13px] text-slate-500 leading-relaxed mt-1 t365-clamp2 hidden md:block"><Hl text={pv} q={field === "b" || field === "tb" ? q : ""} /></p>}
                <div className="flex items-center gap-1.5 mt-1.5 text-[11.5px] text-slate-400 min-w-0">
                  {!catKey && <><CatTag cat={catMap[p.Category]} /><span>·</span></>}
                  <span className="truncate max-w-[110px]">{p.AuthorName || "-"}</span><span>·</span>
                  <span className="tabular-nums">{dateCell(p)}</span><span>·</span><span className="whitespace-nowrap">조회 {vs.views}</span>
                  {nf > 0 && <><span>·</span><span className="whitespace-nowrap inline-flex items-center gap-0.5"><Paperclip size={11} />{nf}</span></>}
                  {showStatusCol && (p.RequireConfirm || (myRow(p) && myRow(p).ConfirmedAt)) && <span className="ml-auto shrink-0"><StatusCell p={p} /></span>}

          }) : <div className="text-center text-slate-400 text-[13px] py-12">{emptyMsg}</div>}
        </div>

        {/* 쪽 번호 */}
        {totalPages > 1 && (
          <div className="px-4 py-3 border-t border-slate-100 flex justify-center">
            <div className="flex items-center gap-1" data-testid="pager">
              <button className={`${pgBtn} text-slate-500 hover:bg-slate-100`} disabled={pageSafe <= 1} onClick={() => setPage(1)} aria-label="처음"><ChevronsLeft size={15} /></button>
              <button className={`${pgBtn} text-slate-500 hover:bg-slate-100`} disabled={pageSafe <= 1} onClick={() => setPage(pageSafe - 1)} aria-label="이전"><ChevronLeft size={15} /></button>
              {pages.map((n) => <button key={n} onClick={() => setPage(n)} data-page={n} aria-current={n === pageSafe ? "page" : undefined} className={`${pgBtn} ${n === pageSafe ? "text-white font-semibold" : "text-slate-600 hover:bg-slate-100"}`} style={n === pageSafe ? { background: BRAND.accent } : undefined}>{n}</button>)}
              <button className={`${pgBtn} text-slate-500 hover:bg-slate-100`} disabled={pageSafe >= totalPages} onClick={() => setPage(pageSafe + 1)} aria-label="다음"><ChevronRight size={15} /></button>
              <button className={`${pgBtn} text-slate-500 hover:bg-slate-100`} disabled={pageSafe >= totalPages} onClick={() => setPage(totalPages)} aria-label="끝"><ChevronsRight size={15} /></button>
            </div>

        )}
      </div>
      {openId && (openOk
        ? <PostDetail key={open.id} ctx={ctx} post={open} siblings={siblings} listLabel={catKey ? (catMap[catKey] || {}).label : "전체 게시물"} onOpen={(id) => setOpenId(id)} onBack={closeModal} onEdit={() => setEditing({ post: open })} suspended={!!editing} />
        : (
          <PostModalShell onClose={closeModal} label="게시물 없음" narrow>
            <div className="p-10 text-center">
              <FileText size={30} className="mx-auto text-slate-300 mb-3" />

        ))}
      {editing && <PostEditor ctx={ctx} post={editing.post} defaultCat={catKey || catFilter} onClose={() => setEditing(null)} onSaved={async (id, savedCat) => {
        const wasEdit = !!(editing && editing.post); setEditing(null); await ctx.reload(); toast(wasEdit ? "게시물을 수정했습니다" : "게시물을 올렸습니다");
        if (!id) return;
        if (catKey && savedCat && savedCat !== catKey) ctx.goPost(savedCat, id);   // CRM 에서 글쓰기 → 일반게시판에 올린 경우(10-11 「게시물을 찾을 수 없습니다」)
        else setOpenId(id);
      }} />}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* 게시물 보기 — 목록 위 큰 창(게시판 글처럼): 머리 띠(분류 · 위치 · 수정/삭제 · 닫기) ·         */
/* 제목 · 정보 줄 · 읽기 폭 본문 · 동영상 16:9 · 첨부 상자 · 확인 현황(본사 · 관리, 접기) ·     */
/* 이전글/다음글(창 안에서 이동) · 아래 띠(Agent 조회확인 / 목록). Esc · 바깥 = 닫기, 포커스 가둠, 휴대폰은 전체 화면 */
/* ------------------------------------------------------------------ */
function PostModalShell({ onClose, children, label, suspended, narrow, panelClass, zClass, testid }) {
  const panel = useRef(null);
  useEffect(() => {
    const prev = document.activeElement;
    const t = setTimeout(() => { if (panel.current) panel.current.focus(); }, 30);
    const html = document.documentElement; const ov = html.style.overflow; html.style.overflow = "hidden";
    return () => { clearTimeout(t); html.style.overflow = ov; try { if (prev && prev.focus && document.contains(prev)) prev.focus(); } catch (e) {} };
  }, []);
  useEffect(() => {
    const k = (e) => {
      if (suspended || document.querySelector("[data-testid=ui-dialog]")) return;   // 위에 확인 창 · 글쓰기 창이 있으면 그쪽이 먼저
      if (e.key === "Escape") { e.preventDefault(); onClose(); return; }
      if (e.key === "Tab" && panel.current) {
        const f = [...panel.current.querySelectorAll("a[href], button, input, select, textarea, iframe, [tabindex]:not([tabindex='-1'])")].filter((x) => !x.disabled && x.offsetParent !== null);
        if (!f.length) return;
        const i = f.indexOf(document.activeElement);
        if (e.shiftKey ? i <= 0 : i === f.length - 1) { e.preventDefault(); f[e.shiftKey ? f.length - 1 : 0].focus(); }
      }
    };
    window.addEventListener("keydown", k);
    return () => window.removeEventListener("keydown", k);
  }, [suspended, onClose]);
  return (
    <div className={`fixed inset-0 ${zClass || "z-50"} bg-slate-950/60 backdrop-blur-[3px] t365-fade flex items-stretch md:items-center justify-center md:p-8`} onMouseDown={(e) => { if (e.target === e.currentTarget && !suspended) onClose(); }} data-testid={testid ? testid + "-backdrop" : "post-backdrop"}>
      <div ref={panel} tabIndex={-1} role="dialog" aria-modal="true" aria-label={label} data-testid={testid || "post-modal"}
        className={`bg-white w-full ${panelClass || (narrow ? "md:max-w-[520px] md:h-auto md:max-h-[90vh]" : "md:max-w-[960px] md:h-auto md:max-h-[90vh]")} h-full md:rounded-2xl flex flex-col outline-none t365-pop overflow-hidden ring-1 ring-black/10`} style={{ boxShadow: "0 32px 90px -18px rgba(2,6,23,.6), 0 12px 28px -12px rgba(2,6,23,.35)" }}>
        {children}
      </div>
    </div>
  );
}
function PostDetail({ ctx, post, siblings, listLabel, onOpen, onBack, onEdit, suspended }) {
  const { me, catMap, readIdx } = ctx;
  const cat = catMap[post.Category];
  const mine = (readIdx.get(String(post.id)) || new Map()).get(normEmail(me.email));
  const [busy, setBusy] = useState(false);
  const [autoState, setAutoState] = useState("");   // 자동 조회확인 — saving | error | ""
  const [deleting, setDeleting] = useState(false);
  const [videoSrc, setVideoSrc] = useState("");
  const scrollRef = useRef(null);
  const files = parseFiles(post.AttachmentsJson);
  const vfile = parseFiles(post.VideoFileJson)[0];
  const vurl = safeHttpsUrl(post.VideoUrl);
  const yt = youtubeId(post.VideoUrl);
  const vs = viewStats(readIdx, post.id);
  const showRate = ctx.canView("status");
  const cs = showRate ? confirmStats(post, readIdx, ctx.agents) : null;
  const idx = (siblings || []).findIndex((p) => String(p.id) === String(post.id));
  const newer = idx > 0 ? siblings[idx - 1] : null, older = idx >= 0 && idx < siblings.length - 1 ? siblings[idx + 1] : null;

  useEffect(() => {
    let alive = true;
    const autoConfirm = ctx.isAgent && !!post.RequireConfirm;
    setAutoState(autoConfirm && !(mine && mine.ConfirmedAt) ? "saving" : "");
    t365RecordView(post, me, { confirm: autoConfirm }).then((row) => { if (alive && row) { ctx.upsertRead(row); setAutoState(""); } })
      .catch((e) => { console.warn("[Training365] 열람 기록 실패:", e.message); if (alive) setAutoState(autoConfirm ? "error" : ""); });
    if (scrollRef.current) scrollRef.current.scrollTop = 0;
    return () => { alive = false; };
  }, [post.id]);

  const busyRef = useRef(false);
  async function confirmRead() {
    if (busyRef.current) return;
    busyRef.current = true; setBusy(true);
    try { const row = await t365Confirm(post, me); if (row) { ctx.upsertRead(row); setAutoState(""); toast("조회확인을 기록했습니다"); } }
    catch (e) { uiAlert(`조회확인을 저장하지 못했습니다 — ${e.message}\n잠시 후 다시 눌러 주세요.`); }
    busyRef.current = false; setBusy(false);
  }
  async function remove() {
    if (!(await uiConfirm(`「${post.Title}」 게시물을 삭제할까요?\n삭제하면 되돌릴 수 없고, 이 게시물의 조회확인 기록은 확인 현황에서 빠집니다.`, { title: "게시물 삭제", okText: "삭제", danger: true }))) return;
    setDeleting(true);
    try {
      await tDelete(T365_LISTS.posts, post.id, { cat: post.Category });
      t365Log("게시물", "삭제", post.Title, { info: { 카테고리: cat ? cat.label : post.Category, 게시물ID: post.id, 작성자: post.AuthorName || post.AuthorEmail || "" } });
      onBack();
      await ctx.reload();
    } catch (e) { uiAlert(e.message); }
    setDeleting(false);
  }
  async function playVideo() { try { setVideoSrc(await tFileUrl(vfile)); } catch (e) { uiAlert(`동영상을 열 수 없습니다 — ${e.message}`); } }
  const totalSize = files.reduce((a, f) => a + (Number(f.size) || 0), 0);
  const Dot = () => <span className="text-slate-300">·</span>;
  const edit = ctx.canEditPost(post);
  const confirmed = !!(mine && mine.ConfirmedAt);

  return (
    <PostModalShell onClose={onBack} label={post.Title} suspended={suspended} panelClass="md:max-w-[960px] md:h-[min(88vh,920px)]">
      {/* 머리 띠 — 게시판 색 줄 · 게시판 · 위치 · 이전/다음 · 수정 · 삭제 · 닫기 */}
      <div className="shrink-0 h-[3px]" style={{ background: cat ? cat.color : BRAND.accent }} aria-hidden="true"></div>
      <div className="shrink-0 h-12 px-3 md:px-5 flex items-center gap-2 text-white" style={{ background: "#1A2B4C" }} data-testid="post-titlebar">
        {cat && <span className="inline-flex items-center gap-2 text-[13px] font-semibold shrink-0"><CatIconBox cat={{ ...cat, soft: "#FFFFFF" }} size={24} icon={13} />{cat.label}</span>}
        {idx >= 0 && siblings.length > 1 && <span className="text-[11.5px] text-white/55 tabular-nums hidden sm:inline">{listLabel !== (cat && cat.label) ? `${listLabel} · ` : ""}{idx + 1} / {siblings.length}</span>}
        <span className="ml-auto inline-flex items-center gap-0.5 shrink-0">
          <button onClick={() => newer && onOpen(newer.id)} disabled={!newer} title={newer ? `다음글 · ${newer.Title}` : "다음 글이 없습니다"} aria-label="다음글" className="w-8 h-8 rounded-lg flex items-center justify-center text-white/75 hover:bg-white/10 hover:text-white disabled:opacity-30 disabled:hover:bg-transparent" data-testid="hd-newer"><ChevronUp size={17} /></button>
          <button onClick={() => older && onOpen(older.id)} disabled={!older} title={older ? `이전글 · ${older.Title}` : "이전 글이 없습니다"} aria-label="이전글" className="w-8 h-8 rounded-lg flex items-center justify-center text-white/75 hover:bg-white/10 hover:text-white disabled:opacity-30 disabled:hover:bg-transparent" data-testid="hd-older"><ChevronDown size={17} /></button>

      </div>

      <div ref={scrollRef} className="flex-1 overflow-y-auto overscroll-contain bg-white" data-testid="post-scroll">
        <article className="min-h-full flex flex-col" data-testid="article">
          {/* 제목 · 정보 */}
          <header className="px-5 md:px-10 pt-6 pb-5 border-b border-slate-200 bg-white">
            {(post.IsPinned || post.RequireConfirm) && (
              <div className="flex items-center gap-1 mb-2">
                {post.IsPinned && <NoticePill />}
