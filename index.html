      {saving && <BlockingOverlay message={saving} />}
      {savedPopup != null && (
        <Modal title="반영 완료" onClose={() => setSavedPopup(null)}>
          <div className="text-center py-4"><CheckCircle2 size={32} className="mx-auto text-emerald-500 mb-3" /><div className="text-sm text-slate-600">{savedPopup}명의 변경사항이 저장되었습니다.</div></div>
          <div className="flex justify-end"><button onClick={() => setSavedPopup(null)} className="px-4 py-2 text-sm rounded-lg text-white" style={{ background: BRAND.accent }}>확인</button></div>
        </Modal>
      )}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* 카테고리 관리 — key 는 고정, 이름 · 설명 · 순서 · 사용만(선택 목록 training365_Categories) */
/* ------------------------------------------------------------------ */
function CategoriesTab({ ctx, catRows, listStatus, reload }) {
  const missing = !listStatus || !listStatus.categories || listStatus.categories.missing || listStatus.categories.error;
  const base = mergeCategories(catRows, true);
  const [draft, setDraft] = useState(() => base.map((c) => ({ key: c.key, label: c.label, desc: c.desc, order: c.order, active: c.active })));
  const [saving, setSaving] = useState(false);
  useEffect(() => { setDraft(mergeCategories(catRows, true).map((c) => ({ key: c.key, label: c.label, desc: c.desc, order: c.order, active: c.active }))); }, [catRows]);
  const counts = {}; ctx.posts.forEach((p) => { counts[p.Category] = (counts[p.Category] || 0) + 1; });
  const dirty = draft.filter((d) => { const b = base.find((x) => x.key === d.key); return b && (b.label !== d.label || b.desc !== d.desc || Number(b.order) !== Number(d.order) || b.active !== d.active); });
  const set = (key, k, v) => setDraft((prev) => prev.map((d) => (d.key === key ? { ...d, [k]: v } : d)));
  async function save() {
    if (draft.some((d) => !String(d.label).trim())) { alert("카테고리 이름을 비울 수 없습니다."); return; }
    if (!draft.some((d) => d.active)) { alert("사용하는 카테고리가 하나 이상 있어야 합니다."); return; }
    setSaving(true);
    try {
      const fresh = await tListAll(T365_LISTS.categories);
      for (const d of dirty) {
        const row = fresh.find((r) => String(r.Key || "").trim() === d.key);
        const b = base.find((x) => x.key === d.key);
        const f = { Title: String(d.label).trim().slice(0, 60), Key: d.key, Description: String(d.desc || "").trim().slice(0, 300), SortOrder: Number(d.order) || 0, Active: !!d.active };
        if (row) await tUpdate(T365_LISTS.categories, row.id, f); else await tCreate(T365_LISTS.categories, f);
        const changes = {};
        if (b.label !== f.Title) changes["이름"] = [b.label, f.Title];
        if (b.desc !== f.Description) changes["설명"] = [b.desc, f.Description];
        if (Number(b.order) !== f.SortOrder) changes["순서"] = [b.order, f.SortOrder];
        if (b.active !== f.Active) changes["사용"] = [b.active, f.Active];
        t365Log("카테고리", "수정", `${f.Title} (${d.key})`, { changes });
      }
      await reload();
    } catch (e) { alert(e.message); }
    setSaving(false);
  }
  return (
    <div className="w-full">
      {missing ? (
        <div className="rounded-xl border px-4 py-3 mb-4 text-xs leading-relaxed bg-blue-50 border-blue-100 text-blue-900 flex items-start gap-2.5" data-testid="cat-missing">
          <AlertTriangle size={15} className="shrink-0 mt-0.5 text-blue-500" />
          <div>카테고리 설정 목록({T365_LISTS.categories})이 없어 <b>기본 7개 카테고리</b>를 그대로 씁니다. 이름 · 설명 · 순서 · 사용 여부를 바꾸려면 SETUP_KO.md 의 표대로 목록을 만든 뒤 새로고침하세요. 게시판 기능은 이 목록 없이도 모두 동작합니다.</div>
        </div>
      ) : (
        <div className="bg-slate-50 text-slate-500 text-xs px-4 py-3 rounded-lg mb-4 flex items-start gap-2 leading-relaxed border border-slate-200">
          <Tags size={14} className="shrink-0 mt-0.5 text-slate-400" />
          <div>카테고리 7개의 이름 · 설명 · 순서 · 사용 여부를 바꿉니다. 카테고리 키(게시물에 저장되는 값)는 바꿀 수 없습니다. <b className="text-slate-600">사용을 끄면</b> 메뉴 · 목록 · Overview 에서 숨겨지고 게시물은 지워지지 않습니다.</div>
        </div>
      )}
      <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-sm" style={{ minWidth: 820 }}>
            <thead className="bg-slate-50 text-slate-500 text-xs"><tr>{["순서", "카테고리", "키", "이름", "설명", "사용", "게시물"].map((h) => <th key={h} className="text-left font-medium px-3 py-2.5 border-b border-slate-200 whitespace-nowrap">{h}</th>)}</tr></thead>
            <tbody>
              {[...draft].sort((a, b) => a.order - b.order).map((d) => {
                const def = T365_DEFAULT_CATEGORIES.find((c) => c.key === d.key); const Icon = def.icon;
                const isDirty = dirty.some((x) => x.key === d.key);
                return (
                  <tr key={d.key} className={`border-t border-slate-100 ${isDirty ? "bg-amber-50/70" : ""}`} data-catrow={d.key}>
                    <td className="px-3 py-2 w-20"><input type="number" value={d.order} disabled={missing} onChange={(e) => set(d.key, "order", e.target.value)} className="w-16 h-8 border border-slate-200 rounded-md px-2 text-[13px] disabled:bg-slate-50" /></td>
                    <td className="px-3 py-2 w-12"><div className="w-8 h-8 rounded-lg flex items-center justify-center" style={{ background: def.soft }}><Icon size={16} style={{ color: def.color }} /></div></td>
                    <td className="px-3 py-2 text-[12px] text-slate-400 font-mono w-24">{d.key}</td>
                    <td className="px-3 py-2 w-56"><input value={d.label} disabled={missing} maxLength={60} onChange={(e) => set(d.key, "label", e.target.value)} className="w-full h-8 border border-slate-200 rounded-md px-2 text-[13px] disabled:bg-slate-50" data-cat-label={d.key} /></td>
                    <td className="px-3 py-2"><input value={d.desc} disabled={missing} maxLength={300} onChange={(e) => set(d.key, "desc", e.target.value)} className="w-full h-8 border border-slate-200 rounded-md px-2 text-[13px] disabled:bg-slate-50" /></td>
                    <td className="px-3 py-2 w-14 text-center"><input type="checkbox" checked={d.active} disabled={missing} onChange={(e) => set(d.key, "active", e.target.checked)} className="w-4 h-4" /></td>
                    <td className="px-3 py-2 w-16 text-[12.5px] text-slate-500 tabular-nums">{counts[d.key] || 0}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
        <div className="px-4 py-3 border-t border-slate-100 flex items-center justify-end gap-2">
          {dirty.length > 0 && <button onClick={() => setDraft(base.map((c) => ({ key: c.key, label: c.label, desc: c.desc, order: c.order, active: c.active })))} className="text-xs px-3 py-2 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50">변경 취소</button>}
          <button onClick={save} disabled={missing || !dirty.length || saving} className="px-4 py-2 rounded-lg text-sm font-medium text-white disabled:opacity-40" style={{ background: BRAND.accent }} data-testid="cat-save">{dirty.length ? `반영 (${dirty.length}개)` : "반영"}</button>
        </div>
      </div>
      {saving && <BlockingOverlay message="저장하고 있습니다..." />}
    </div>
  );
}
// 기본 7개 + 목록 값(이름 · 설명 · 순서 · 사용). includeInactive=false 면 사용 중인 것만, 순서대로
function mergeCategories(catRows, includeInactive) {
  const out = T365_DEFAULT_CATEGORIES.map((c, i) => {
    const r = (catRows || []).find((x) => String(x.Key || "").trim() === c.key);
    return { ...c, label: (r && String(r.Title || "").trim()) || c.label, desc: r && r.Description != null && String(r.Description).trim() ? String(r.Description).trim() : c.desc,
      order: r && r.SortOrder != null && r.SortOrder !== "" ? Number(r.SortOrder) : (i + 1) * 10, active: r ? r.Active !== false : true };
  }).sort((a, b) => a.order - b.order);
  return includeInactive ? out : out.filter((c) => c.active);
}

/* ------------------------------------------------------------------ */
/* 접속 기록 — 계정별 로그인 · 로그아웃 시각(로그아웃 없으면 「세션 종료(추정)」 · 마지막 활동) */
/* ------------------------------------------------------------------ */
function AccessLogTab({ ctx }) {
  const today = kstToday();
  const [from, setFrom] = useState(dayAdd(today, -6));
  const [to, setTo] = useState(today);
  const [rows, setRows] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [roleF, setRoleF] = useState("");
  const [statusF, setStatusF] = useState("");
  const [q, setQ] = useState("");
  const [mode, setMode] = useState("session");
  const [page, setPage] = useState(1);
  const [detail, setDetail] = useState(null);
  const [loaded, setLoaded] = useState("");
  const PAGE_SIZE = 25;
  async function load(f = from, t = to) {
    if (!f || !t || f > t) { alert("조회 기간을 확인해 주세요."); return; }
    if (dayAdd(f, 92) < t) { alert("한 번에 93일까지 조회할 수 있습니다."); return; }
    setLoading(true); setError("");
    const fi = kstDayStartIso(f), ti = kstDayStartIso(dayAdd(t, 1));
    try {
      let list;
      try { list = await tListAll(T365_LISTS.access, `&$filter=fields/LoginAt ge '${fi}' and fields/LoginAt lt '${ti}'`); }
      catch (e) { if (isMissingListError(e)) throw e; list = await tListAll(T365_LISTS.access); }   // LoginAt 인덱스가 없을 때 — 전체를 읽어 화면에서 거른다
      setRows(list.filter((r) => r.LoginAt && r.LoginAt >= fi && r.LoginAt < ti).sort((a, b) => String(b.LoginAt).localeCompare(String(a.LoginAt))));
      setLoaded(`${f} ~ ${t}`); setPage(1);
    } catch (e) { setError(isMissingListError(e) ? "접속 기록 목록이 아직 없습니다 — 관리자 준비 안내를 확인해 주세요." : e.message); setRows([]); }
    setLoading(false);
  }
  useEffect(() => { load(); }, []);
  useEffect(() => { setPage(1); }, [roleF, statusF, q, mode]);
  const now = Date.now();
  const uMap = new Map(ctx.users.map((u) => [normEmail(u.Email), u]));
  const enrich = (r) => { const st = sessionStatus(r, now); const end = st.end ? Date.parse(st.end) : now; return { ...r, st, dur: (end || now) - (Date.parse(r.LoginAt) || now) }; };
  const qq = q.trim().toLowerCase();
  const view = (rows || []).map(enrich)
    .filter((r) => !roleF || r.Role === roleF).filter((r) => !statusF || r.st.label === statusF)
    .filter((r) => !qq || [r.UserEmail, r.UserName, r.Company, r.Device].some((v) => String(v || "").toLowerCase().includes(qq)));
  const byUser = Object.values(view.reduce((m, r) => {
    const k = normEmail(r.UserEmail); const u = uMap.get(k);
    const o = m[k] || (m[k] = { email: k, name: r.UserName || (u && u.Title) || k, company: r.Company || (u && u.Company) || "", role: r.Role, n: 0, last: null, lastEnd: null, logouts: 0, inferred: 0, total: 0 });
    o.n++; o.total += Math.max(0, r.dur); if (r.st.label === "로그아웃") o.logouts++; if (r.st.inferred) o.inferred++;
    if (!o.last || r.LoginAt > o.last.LoginAt) o.last = r;
    return m;
  }, {})).sort((a, b) => String(b.last.LoginAt).localeCompare(String(a.last.LoginAt)));
  const list = mode === "user" ? byUser : view;
  const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  const pageSafe = Math.min(page, totalPages);
  const pageRows = list.slice((pageSafe - 1) * PAGE_SIZE, pageSafe * PAGE_SIZE);
  const cnt = (l) => view.filter((r) => r.st.label === l).length;
  function exportExcel() {
    const data = view.map((r, i) => ({ 번호: view.length - i, "로그인(KST)": fmtDate(r.LoginAt), 이름: r.UserName || "", 메일: r.UserEmail || "", "회사/지점": r.Company || "", 역할: r.Role || "", 종료: r.st.label, "로그아웃/종료(KST)": r.st.end ? fmtDate(r.st.end) : "", "마지막 활동(KST)": fmtDate(r.LastActivityAt), "접속 시간(분)": Math.max(0, Math.round(r.dur / 60e3)), 기기: r.Device || "", 세션: r.Title || "" }));
    const users = byUser.map((u) => ({ 이름: u.name, 메일: u.email, "회사/지점": u.company, 역할: u.role, 접속: u.n, 로그아웃: u.logouts, "세션 종료(추정)": u.inferred, "마지막 로그인(KST)": fmtDate(u.last.LoginAt), "접속 시간 합(분)": Math.round(u.total / 60e3) }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(data.length ? data : [{ 안내: "조회 결과가 없습니다." }]), "접속기록");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(users.length ? users : [{ 안내: "조회 결과가 없습니다." }]), "사용자별");
    XLSX.writeFile(wb, `Training365_접속기록_${from}_${to}.xlsx`);
    t365Log("접속 기록", "Excel 내보내기", `${from} ~ ${to}`, { info: { 건수: data.length } });
  }
  function preset(days) { const f = days === 1 ? today : dayAdd(today, -(days - 1)); setFrom(f); setTo(today); load(f, today); }
  const ctrl = "h-9 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-[#2F7B7A]/40";
  const td = "px-3 py-[6px] text-[12.5px] leading-5 whitespace-nowrap overflow-hidden text-ellipsis";
  const curLen = Math.round((new Date(to + "T00:00:00Z") - new Date(from + "T00:00:00Z")) / 864e5) + 1;
  return (
    <div className="w-full">
      <div className="bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 mb-4 text-xs text-slate-500 flex items-start gap-2.5 leading-relaxed">
        <LogIn size={15} className="text-slate-400 shrink-0 mt-0.5" />
        <div>로그인(권한 확인 통과 시점)마다 한 줄이 생기고, 「로그아웃」 버튼을 누르면 로그아웃 시각이 남습니다. 로그아웃 없이 창을 닫거나 {Math.round(T365_TIMING.idleEndMs / 60e3)}분 넘게 활동이 없으면 <b className="text-amber-700">세션 종료(추정)</b>으로 보고 <b className="text-slate-600">마지막 활동 시각</b>을 종료 시각으로 씁니다(활동 신호 {Math.round(T365_TIMING.heartbeatMs / 60e3)}분 간격). 등록되지 않은 계정의 시도는 <b className="text-red-600">접근 차단</b>으로 남습니다.</div>
      </div>
      <div className="grid grid-cols-2 lg:grid-cols-5 gap-3 mb-4" data-testid="access-summary">
        {[["접속", view.length, "건"], ["사용자", byUser.length, "명"], ["로그아웃", cnt("로그아웃"), "건"], ["세션 종료(추정)", cnt("세션 종료(추정)"), "건"], ["접속 중", cnt("접속 중"), "건"]].map(([l, v, s], i) => (
          <div key={l} className={`bg-white rounded-xl border border-slate-200 shadow-sm px-4 py-3 ${i === 4 ? "col-span-2 lg:col-span-1" : ""}`}><div className="text-[11.5px] text-slate-500">{l}</div><div className="text-xl font-bold text-slate-800 tabular-nums mt-0.5">{v}<span className="text-sm font-normal text-slate-400">{s}</span></div></div>
        ))}
      </div>
      <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <div className="px-4 py-3 border-b border-slate-100 flex items-center gap-2 flex-wrap">
          <div className="flex items-center rounded-lg border border-slate-300 overflow-hidden h-9">
            {[[1, "오늘"], [7, "7일"], [30, "30일"]].map(([n, label], i) => { const on = to === today && curLen === n; return <button key={n} onClick={() => preset(n)} disabled={loading} className={`px-3 h-full text-sm ${i ? "border-l border-slate-300" : ""} ${on ? "text-white" : "text-slate-600 bg-white hover:bg-slate-50"}`} style={on ? { background: BRAND.accent } : undefined}>{label}</button>; })}
          </div>
          <div className="flex items-center gap-1 w-full sm:w-auto">
            <input type="date" value={from} max={to} onChange={(e) => setFrom(e.target.value)} className={`${ctrl} px-2 min-w-0 flex-1 sm:flex-none`} />
            <span className="text-slate-400 text-xs">~</span>
            <input type="date" value={to} min={from} max={today} onChange={(e) => setTo(e.target.value)} className={`${ctrl} px-2 min-w-0 flex-1 sm:flex-none`} />
            <button onClick={() => load()} disabled={loading} className="h-9 text-sm px-4 rounded-lg text-white disabled:opacity-50" style={{ background: BRAND.accent }}>조회</button>
          </div>
          <select value={roleF} onChange={(e) => setRoleF(e.target.value)} className={`${ctrl} px-3 w-[calc(50%-4px)] sm:w-32`} data-testid="access-role"><option value="">전체 역할</option>{[...T365_ROLES, "권한 없음"].map((r) => <option key={r}>{r}</option>)}</select>
          <select value={statusF} onChange={(e) => setStatusF(e.target.value)} className={`${ctrl} px-3 w-[calc(50%-4px)] sm:w-40`} data-testid="access-status"><option value="">전체 상태</option>{["로그아웃", "세션 종료(추정)", "접속 중", "접근 차단"].map((r) => <option key={r}>{r}</option>)}</select>
          <div className="relative w-full sm:w-52"><Search size={15} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400" /><input value={q} onChange={(e) => setQ(e.target.value)} placeholder="이름 · 메일 · 회사 · 기기" className={`${ctrl} pl-8 pr-3 w-full`} data-testid="access-q" /></div>
          <div className="flex items-center rounded-lg border border-slate-300 overflow-hidden h-9 sm:ml-auto">
            {[["session", "세션별"], ["user", "사용자별"]].map(([k, l], i) => <button key={k} onClick={() => setMode(k)} className={`px-3 h-full text-sm ${i ? "border-l border-slate-300" : ""} ${mode === k ? "bg-slate-800 text-white" : "bg-white text-slate-600 hover:bg-slate-50"}`}>{l}</button>)}
          </div>
          <button onClick={exportExcel} disabled={!view.length} className={btnCls} data-testid="access-export"><Download size={14} /> Excel 내보내기</button>
        </div>
        <div className="overflow-x-auto">
          {mode === "session" ? (
            <table className="w-full table-fixed" style={{ minWidth: 1080 }} data-testid="access-table">
              <colgroup><col style={{ width: 156 }} /><col style={{ width: 230 }} /><col style={{ width: 150 }} /><col style={{ width: 78 }} /><col style={{ width: 128 }} /><col style={{ width: 142 }} /><col style={{ width: 92 }} /><col /></colgroup>
              <thead className="bg-slate-50 text-slate-500 text-[11.5px]"><tr>{["로그인(KST)", "사용자", "회사/지점", "역할", "종료", "로그아웃 · 종료(KST)", "접속 시간", "기기"].map((h) => <th key={h} className="px-3 py-2 font-medium text-left whitespace-nowrap border-b border-slate-200">{h}</th>)}</tr></thead>

                  : error ? <tr><td colSpan={8} className="text-center text-red-500 text-sm py-12">{error}</td></tr>
                  : pageRows.length ? pageRows.map((r) => (
                    <tr key={r.id} onClick={() => setDetail(r)} className="border-t border-slate-100 first:border-t-0 hover:bg-slate-50 cursor-pointer" data-session={r.Title}>
                      <td className={`${td} text-slate-600 tabular-nums`}>{fmtDate(r.LoginAt)}</td>
                      <td className={td} title={r.UserEmail}><span className="text-slate-800">{r.UserName || r.UserEmail}</span> <span className="text-slate-400 text-[11.5px]">{r.UserEmail}</span></td>
                      <td className={`${td} text-slate-600`}>{r.Company || "-"}</td>

  const canEditPost = (p) => isAdmin || (canWrite(p.Category) && normEmail(p.AuthorEmail) === normEmail(me.email));

  async function reload() {
    setLoading(true);
    const wrap = (pr) => pr.then((v) => ({ v }), (e) => ({ e }));
    const [p, r, u, c] = await Promise.all([wrap(tListAll(T365_LISTS.posts)), wrap(tListAll(T365_LISTS.reads)), wrap(tListAll(T365_LISTS.users)), wrap(tListAll(T365_LISTS.categories))]);
    if (p.e) { setPosts([]); setPostsErr(isMissingListError(p.e) ? "missing" : p.e.message); } else { setPosts(p.v); setPostsErr(""); }
    if (r.e) { setReads([]); console.warn("[Training365] 조회 기록 읽기 실패:", r.e.message); } else setReads(r.v);
    if (c.e) setCatRows([]); else setCatRows(c.v);
    if (u.e) { setUsersLoaded(false); console.warn("[Training365] 사용자 목록 읽기 실패:", u.e.message); }
    else {
      setUsers(u.v); setUsersLoaded(true);
      // 다시 읽은 목록에서 내 행이 사라졌거나 사용 중지 · 역할 없음이면(설정 관리자 제외) 바로 막는다
      if (!boot.isCfgAdmin) {
        const mine = u.v.find((x) => boot.me.ids.includes(normEmail(x.Email)) && x.Active !== false);
        if (!mine || !T365_ROLES.includes(mine.Role)) setDenied(!mine ? "not-registered" : "no-role");
      }
    }
    const adminNow = boot.isCfgAdmin || (!u.e && (u.v.find((x) => boot.me.ids.includes(normEmail(x.Email)) && x.Active !== false) || {}).Role === "관리자");
    if (adminNow) {
      const since = new Date(Date.now() - 45 * 864e5).toISOString();
      tListAll(T365_LISTS.access, `&$filter=fields/LoginAt ge '${since}'`).catch((e) => (isMissingListError(e) ? [] : tListAll(T365_LISTS.access)))
        .then((v) => setAccessRows(v || []), () => setAccessRows([]));
      tCheckLists().then(setListStatus, () => setListStatus(null));
    }
    setLoading(false); setHasLoadedOnce(true);
  }
  useEffect(() => { reload(); }, []);

  function setTab(t, post = null, push = true) {
    setTabRaw(t); setOpenPostRaw(post);
    const h = hashOf(t, post);
    try { if (window.location.hash !== h) (push ? history.pushState : history.replaceState).call(history, null, "", h); } catch (e) {}
    const m = document.querySelector("main"); if (m) m.scrollTop = 0;
  }
  const setOpenId = (id) => setTab(tab, id ? String(id) : null);
  const openPost = (p) => setTab(catMap[p.Category] ? "cat:" + p.Category : "all", String(p.id));
  useEffect(() => { const on = () => { const x = parseHash(); setTabRaw(x.tab); setOpenPostRaw(x.post); }; window.addEventListener("popstate", on); return () => window.removeEventListener("popstate", on); }, []);
  const upsertRead = (row) => setReads((prev) => { const i = prev.findIndex((x) => x.Title === row.Title); if (i < 0) return [...prev, row]; const n = prev.slice(); n[i] = { ...n[i], ...row }; return n; });

  const ctx = { me, role, isAdmin, isAgent, canWrite, canEditPost, cats, catMap, users, agents, posts, readIdx, upsertRead, reload };

  // 화면 접근 — 관리 화면은 관리자만, 확인 현황은 Agent 제외, 카테고리는 사용 중인 것만
  const tabAllowed = (t) => t === "overview" || t === "all" || (t.startsWith("cat:") && !!catMap[t.slice(4)]) || (t === "status" && !isAgent && !!role) || (T365_ADMIN_TABS.includes(t) && isAdmin);
  useEffect(() => { if (hasLoadedOnce && !tabAllowed(tab)) setTab("overview", null, false); }, [hasLoadedOnce, tab, isAdmin, catRows]);

  // 사이드바 접기 · 휴대폰 서랍 — MKQR 과 같은 동작(선택은 이 브라우저에 기억)
  const [sideCollapsed, setSideCollapsed] = useState(() => { try { const v = localStorage.getItem("t365.sideCollapsed"); if (v === "1" || v === "0") return v === "1"; } catch (e) {} return window.innerWidth < 1100; });
  const toggleSide = () => setSideCollapsed((v) => { const nv = !v; try { localStorage.setItem("t365.sideCollapsed", nv ? "1" : "0"); } catch (e) {} return nv; });

  const [isMobile, setIsMobile] = useState(() => { try { return window.matchMedia(MOBILE_Q).matches; } catch (e) { return false; } });

  const drawerCloseRef = useRef(null);
  useEffect(() => { if (!drawerOpen) return; const tm = setTimeout(() => { if (drawerCloseRef.current) drawerCloseRef.current.focus(); }, 60); return () => clearTimeout(tm); }, [drawerOpen]);
  useEffect(() => {
    let mq; try { mq = window.matchMedia(MOBILE_Q); } catch (e) { return; }
    const on = () => { setIsMobile(mq.matches); if (!mq.matches) setDrawerOpen(false); };
    mq.addEventListener ? mq.addEventListener("change", on) : mq.addListener(on);
    return () => { mq.removeEventListener ? mq.removeEventListener("change", on) : mq.removeListener(on); };
  }, []);
  useEffect(() => { if (!drawerOpen) return; const k = (e) => { if (e.key === "Escape") setDrawerOpen(false); }; window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k); }, [drawerOpen]);
  const railCollapsed = sideCollapsed && !isMobile;
  const [sideTip, setSideTip] = useState(null);
  const showSideTip = (e, label) => { if (!railCollapsed) return; const r = e.currentTarget.getBoundingClientRect(); setSideTip({ label, y: r.top + r.height / 2 }); };
  useEffect(() => { setSideTip(null); }, [sideCollapsed]);

  if (denied) return <AccessDenied ident={boot.me} reason={denied} contacts={[]} />;

  const myRead = (p) => (readIdx.get(String(p.id)) || new Map()).get(normEmail(me.email));
  const badgeFor = (key) => {
    const list = posts.filter((p) => p.Category === key);
    if (isAgent) { const todo = list.filter((p) => p.RequireConfirm && !(myRead(p) && myRead(p).ConfirmedAt)).length; if (todo) return { n: todo, color: "#C2410C" }; }
    const n = list.filter((p) => !myRead(p)).length; return n ? { n, color: "#DC2626" } : null;
  };
  const homeNav = [{ id: "overview", label: "Overview", icon: LayoutDashboard }, { id: "all", label: "전체 게시물", icon: LayoutList }];
  const boardNav = cats.map((c) => ({ id: "cat:" + c.key, label: c.label, icon: c.icon || FileText, badge: badgeFor(c.key) }));
  const statusNav = !isAgent ? [{ id: "status", label: "조회확인 현황", icon: BarChart3 }] : [];
  const adminNav = isAdmin ? [
    { id: "users", label: "사용자 · 역할 관리", icon: Users }, { id: "categories", label: "카테고리 관리", icon: Tags },
    { id: "access", label: "접속 기록", icon: LogIn }, { id: "activity", label: "활동 이력", icon: History },
  ] : [];
  const groups = [["TRAINING365", homeNav], ["게시판", boardNav], ...(statusNav.length ? [["확인 현황", statusNav]] : []), ...(adminNav.length ? [["관리자 전용", adminNav]] : [])];
  const nav = [...homeNav, ...boardNav, ...statusNav, ...adminNav];
  const cur = nav.find((n) => n.id === tab) || homeNav[0];
  const roleLabel = [role || "권한 확인 중", me.company].filter(Boolean).join(" · ");
  const showAps = !me.isGuest && !isExternalEmail(me.email) && role !== "Agent";
  const curCat = tab.startsWith("cat:") ? catMap[tab.slice(4)] : null;
  const meta = curCat ? [curCat.icon, curCat.desc, curCat] : ({
    overview: [LayoutDashboard, isAgent ? "새 글 · 확인이 필요한 필수 교육자료 · 게시판별 소식을 한눈에 봅니다" : "게시판 소식과 Agent 조회확인 현황을 한눈에 봅니다"],
    all: [LayoutList, "모든 카테고리의 게시물을 한 번에 찾아봅니다 — 카테고리 · 안 읽은 글 · 중요 필터와 검색"],
    status: [BarChart3, "게시물마다 대상 Agent 중 몇 명이 「조회확인」을 눌렀는지 봅니다 — 눌러서 누가 · 언제 확인했는지 확인"],
    users: [Users, "로그인할 수 있는 사용자와 역할(Agent · 본사 · 작성자 · 관리자)을 등록 · 변경합니다. 변경은 활동 이력에 남습니다."],
    categories: [Tags, "게시판 7개의 이름 · 설명 · 순서 · 사용 여부를 관리합니다"],
    access: [LogIn, "계정별 로그인 · 로그아웃 시각과 세션 종료(추정)를 조회하고 Excel 로 내보냅니다"],
    activity: [History, "게시물 · 사용자 · 카테고리 관리 이력을 날짜별로 조회합니다 (기본 최근 3일)"],
  }[tab] || [LayoutDashboard, ""]);

  return (
    <div className="h-screen flex overflow-hidden" style={{ background: "#F5F6F8" }}>
      {isMobile && drawerOpen && <div className="fixed inset-0 z-[55]" style={{ background: "rgba(15,23,42,.45)" }} onClick={() => setDrawerOpen(false)} aria-hidden="true"></div>}
      <aside className="t365-side shrink-0 flex flex-col h-full overflow-hidden" aria-hidden={isMobile && !drawerOpen ? true : undefined}
        style={isMobile
          ? { background: BRAND.navy, width: 256, position: "fixed", top: 0, bottom: 0, left: 0, zIndex: 60, transform: drawerOpen ? "translateX(0)" : "translateX(-100%)", visibility: drawerOpen ? "visible" : "hidden", boxShadow: drawerOpen ? "0 10px 40px rgba(0,0,0,.35)" : "none", transition: "transform .28s cubic-bezier(.4,0,.2,1), visibility .28s" }
          : { background: BRAND.navy, width: railCollapsed ? 72 : 256 }}>
        {railCollapsed ? (
          <div className="pt-5 pb-4 flex justify-center">
            <div className="w-10 h-10 bg-white rounded-lg flex items-center justify-center text-[11px] font-extrabold tracking-tight select-none" style={{ color: BRAND.navy }} title="Star Truck Korea · Training365">STK</div>
          </div>
        ) : (
          <div className="px-4 pt-5 pb-4 relative" style={{ width: 256, paddingRight: isMobile ? 48 : undefined }}>
            {isMobile && (
              <button ref={drawerCloseRef} onClick={() => setDrawerOpen(false)} aria-label="메뉴 닫기" title="메뉴 닫기" className="absolute top-6 right-2 w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:text-white hover:bg-white/10"><X size={16} /></button>
            )}
            <div className="bg-white rounded-lg px-3 py-2 flex items-center justify-center"><img src={LOGO_SRC} alt="Star Truck Korea" style={{ width: "100%", height: "auto", display: "block" }} /></div>
            <p className="text-[13px] font-medium text-slate-300 tracking-tight mt-3 text-center whitespace-nowrap">Training365 · Sales Agent 소통 채널</p>
          </div>
        )}
        <nav className="t365-side-nav flex-1 px-3 py-4 overflow-y-auto overflow-x-hidden" onScroll={() => setSideTip(null)}>
          {groups.map(([label, items], gi) => (
            <div key={label} className="mb-4">
              {railCollapsed ? (gi > 0 && <div className="mx-2 mb-3 border-t border-white/10"></div>) : <p className="text-[11px] tracking-wider text-slate-500 font-semibold px-3 mb-1.5 whitespace-nowrap">{label}</p>}
              {items.map((n) => {
                const active = tab === n.id;
                return (
                  <button key={n.id} data-nav={n.id} aria-label={n.label} onClick={() => { setSideTip(null); setTab(n.id); if (isMobile) setDrawerOpen(false); }}
                    className="relative w-full flex items-center text-left gap-2.5 px-3 py-2.5 rounded-lg text-sm mb-0.5 transition-colors whitespace-nowrap min-h-[40px]"
                    style={{ backgroundColor: active ? BRAND.navySoft : "transparent", color: active ? "#fff" : "#B7C0D1", borderLeft: active ? `3px solid ${BRAND.accent}` : "3px solid transparent" }}
                    onMouseEnter={(e) => { if (!active) e.currentTarget.style.backgroundColor = BRAND.navyHover; showSideTip(e, n.label); }}
                    onMouseLeave={(e) => { if (!active) e.currentTarget.style.backgroundColor = "transparent"; setSideTip(null); }}>
                    <n.icon size={17} className="shrink-0" />
                    {!railCollapsed && <span className="leading-snug flex-1 truncate">{n.label}</span>}
                    {n.badge && (railCollapsed ? (
                      <span className="absolute top-1 left-[26px] text-[9px] leading-none font-bold rounded-full px-1 min-w-[16px] h-[16px] flex items-center justify-center" style={{ backgroundColor: n.badge.color, color: "#fff", boxShadow: `0 0 0 2px ${BRAND.navy}` }}>{n.badge.n > 99 ? "99+" : n.badge.n}</span>
                    ) : (
                      <span className="shrink-0 text-[11px] font-semibold rounded-full px-1.5 min-w-[18px] text-center" style={{ backgroundColor: n.badge.color, color: "#fff" }} data-badge={n.id}>{n.badge.n > 99 ? "99+" : n.badge.n}</span>
                    ))}
                  </button>
                );
              })}
            </div>
          ))}
        </nav>
        {railCollapsed ? (
          <div className="py-3 border-t border-white/10 flex justify-center">
            <button onClick={() => setContactOpen(true)} title="문의하기" aria-label="문의하기" className="w-9 h-9 rounded-lg flex items-center justify-center text-slate-400 hover:text-white hover:bg-white/10 transition-colors"><HelpCircle size={16} /></button>
          </div>
        ) : (
          <div className="px-4 py-3 border-t border-white/10 whitespace-nowrap" style={{ width: 256 }}>
            {isMobile && (
              <div className="flex items-center gap-2 mb-3 pb-3 border-b border-white/10">
                <div className="min-w-0 flex-1 leading-tight"><div className="text-sm text-slate-200 truncate">{me.shortName}</div><div className="text-[11px] text-slate-500 truncate">{roleLabel}</div></div>
                <button onClick={t365Logout} className="shrink-0 flex items-center gap-1 text-xs font-medium text-slate-300 border border-white/15 rounded-lg px-2.5 py-1.5 hover:text-white hover:border-white/40" data-testid="btn-logout-m"><LogOut size={13} /> 로그아웃</button>
              </div>
            )}
            <p className="text-[10px] uppercase tracking-wider text-slate-500 font-semibold mb-1">문의</p>
            <button onClick={() => setContactOpen(true)} className="flex items-center gap-1.5 text-xs text-slate-400 hover:text-white transition-colors" data-testid="btn-contact"><HelpCircle size={12} className="shrink-0" /><span>문의하기 · 담당자 연락처</span></button>
          </div>
        )}
      </aside>
      {railCollapsed && sideTip && (
        <div className="fixed z-[70] pointer-events-none px-2.5 py-1.5 rounded-md text-xs font-medium text-white shadow-lg whitespace-nowrap" style={{ left: 80, top: sideTip.y, transform: "translateY(-50%)", background: "#1E293B" }}>
          <span className="absolute w-2 h-2 rotate-45" style={{ left: -4, top: "calc(50% - 4px)", background: "#1E293B" }}></span>
          <span className="relative">{sideTip.label}</span>
        </div>
      )}
      <div className="flex-1 flex flex-col min-w-0">
        <div className="h-14 shrink-0 bg-white border-b border-slate-100 flex items-center justify-between gap-2 px-4 md:px-6">
          <div className="flex items-center gap-2 text-sm text-slate-400 min-w-0">
            {isMobile ? (
              <button onClick={() => setDrawerOpen(true)} title="메뉴 열기" aria-label="메뉴 열기" aria-expanded={drawerOpen} className="shrink-0 -ml-1.5 w-9 h-9 rounded-lg flex items-center justify-center text-slate-500 hover:text-slate-800 hover:bg-slate-100 transition-colors"><Menu size={20} /></button>
            ) : (
              <button onClick={toggleSide} title={sideCollapsed ? "메뉴 펼치기" : "메뉴 접기"} aria-label={sideCollapsed ? "메뉴 펼치기" : "메뉴 접기"} aria-expanded={!sideCollapsed} className="shrink-0 -ml-2 w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition-colors">
                {sideCollapsed ? <ArrowRightFromLine size={17} /> : <ArrowLeftToLine size={17} />}
              </button>
            )}
            <span className="shrink-0 w-px h-4 bg-slate-200 mr-1 hidden md:block"></span>
            <span className="shrink-0 hidden md:inline">Star Truck Korea</span>
            <span className="hidden md:inline">/</span>
            <span className="text-slate-700 font-medium truncate">{cur.label}</span>
          </div>
          <div className="flex items-center gap-2 md:gap-4 shrink-0">
            <div className="leading-tight text-sm text-slate-500 hidden md:block text-right" title={[me.name, me.email].filter(Boolean).join("\n")}>
              <div>{me.shortName}</div>
              <div className="text-[11px] text-slate-400">{roleLabel}</div>
            </div>
            {showAps && (
              <a href="https://aps.startruckkorea.com/" target="_self" title="APS 로 돌아가기" className="flex items-center gap-1.5 text-xs font-medium text-slate-500 border border-slate-200 rounded-lg px-2.5 md:px-3 py-1.5 hover:border-teal-400 hover:text-teal-600 transition-colors whitespace-nowrap">📬 돌아가기</a>
            )}
            <button onClick={t365Logout} data-testid="btn-logout" className={`${isMobile && showAps ? "hidden" : "block"} text-xs font-medium text-slate-500 border border-slate-200 rounded-lg px-3 py-1.5 hover:border-red-300 hover:text-red-500 transition-colors whitespace-nowrap`}>로그아웃</button>
          </div>
        </div>
        <main className="t365-main-scroll flex-1 p-4 md:p-6 overflow-y-auto">
          <div className="max-w-[1600px] mx-auto">
            {!(openPostId && (tab.startsWith("cat:") || tab === "all")) && (
              <PageHeader icon={meta[0]} title={cur.label} subtitle={meta[1]} tint={meta[2]} />
            )}
            {isAdmin && <SetupNotice status={listStatus} />}
            {!isAdmin && postsErr && (
              <div className="rounded-xl border px-4 py-3 mb-5 text-sm bg-amber-50 border-amber-200 text-amber-900 flex items-center gap-2" data-testid="board-unavailable"><AlertTriangle size={16} className="text-amber-500 shrink-0" />게시판을 준비하고 있습니다. 잠시 후 다시 확인해 주세요.</div>
            )}
            {!hasLoadedOnce ? (
              <div className="bg-white rounded-xl border border-slate-200 py-16 text-center text-slate-400 text-sm"><div className="w-6 h-6 mx-auto mb-2 rounded-full border-2 border-slate-200 animate-spin" style={{ borderTopColor: BRAND.accent }}></div>불러오는 중...</div>
            ) : !tabAllowed(tab) ? (
              <div className="bg-white rounded-xl border p-10 text-center"><ShieldCheck size={28} className="mx-auto text-slate-300 mb-2" /><div className="text-slate-500 text-sm">이 화면에 대한 접근 권한이 없습니다.</div></div>
            ) : (
              <>
                {tab === "overview" && <OverviewTab ctx={ctx} openPost={openPost} setTab={(t) => setTab(t)} accessRows={isAdmin ? accessRows : null} />}
                {(tab === "all" || tab.startsWith("cat:")) && <BoardTab ctx={ctx} catKey={tab === "all" ? null : tab.slice(4)} openId={openPostId} setOpenId={setOpenId} />}
                {tab === "status" && <ConfirmStatusTab ctx={ctx} openPost={openPost} />}
                {tab === "users" && <UsersTab ctx={ctx} users={users} configAdmins={boot.configAdmins} accessRows={accessRows} reload={reload} />}
                {tab === "categories" && <CategoriesTab ctx={ctx} catRows={catRows} listStatus={listStatus} reload={reload} />}
                {tab === "access" && <AccessLogTab ctx={ctx} />}
                {tab === "activity" && <ActivityLogTab />}
              </>
            )}
            <div className="text-center mt-10 pt-5 border-t border-slate-200 text-[11px] text-slate-400 leading-relaxed">
              <div>© 2026 Star Truck Korea · Training365</div>
              <div>This system is internally developed by Star Truck Korea IT Dept. Unauthorized access is strictly prohibited.</div>
            </div>
          </div>
        </main>
      </div>
      {contactOpen && <ContactModal ctx={ctx} onClose={() => setContactOpen(false)} />}
      {loading && hasLoadedOnce && <div className="fixed top-3 left-1/2 -translate-x-1/2 z-[80] bg-slate-800 text-white text-xs px-3 py-1.5 rounded-full shadow-lg" role="status">새로 불러오는 중...</div>}
    </div>
  );
}

// 권한 없음 — MKQR · SSC 와 같은 카드. 등록되지 않은 계정은 관리자에게 등록 요청, 목록을 못 읽으면 다시 시도
function AccessDenied({ ident, reason }) {
  const retry = reason === "users-error";
  const internal = ident && !ident.isGuest && !isExternalEmail(ident.email);
  const msg = {
    "not-registered": <>Training365 는 <strong>등록된 Sales Agent 와 본사 담당자</strong>만<br />이용할 수 있습니다.<br /><br />관리자에게 계정 등록을 요청해 주세요.<br />등록되면 같은 계정으로 다시 로그인하면 됩니다.</>,
    "inactive": <>이 계정은 <strong>사용 중지</strong> 상태입니다.<br /><br />다시 사용하려면 관리자에게 요청해 주세요.</>,
    "no-role": <>이 계정에 <strong>역할이 지정되지 않았습니다</strong>.<br /><br />관리자에게 역할(Agent · 본사 등) 지정을 요청해 주세요.</>,
    "users-error": <>권한 정보를 불러오지 못했습니다.<br />잠시 후 다시 시도해 주세요.<br /><br />계속되면 관리자 또는 IT 에 알려 주세요.</>,
  }[reason] || <>접근 권한이 없습니다. 관리자에게 요청해 주세요.</>;
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "center", minHeight: "100vh", padding: 16, boxSizing: "border-box", background: "linear-gradient(145deg,#0f2744 0%,#0078d4 100%)" }} data-testid="access-denied">
      <div style={{ background: "#fff", borderRadius: 20, padding: "44px 36px", textAlign: "center", boxShadow: "0 24px 60px rgba(0,0,0,.22)", maxWidth: 420, width: "100%", boxSizing: "border-box" }}>
        <div style={{ fontSize: "3rem", marginBottom: 14 }}>📚</div>
        <div style={{ fontSize: "1.15rem", fontWeight: 800, color: "#0f2744", marginBottom: 6 }}>Training365</div>
        <div style={{ fontSize: ".82rem", color: "#0078d4", fontWeight: 600, marginBottom: 20 }}>Sales Agent 소통 채널 · Star Truck Korea</div>
        <div style={{ background: "#f8faff", borderRadius: 10, padding: "16px 18px", marginBottom: 18, textAlign: "left", border: "1px solid #e0eaff" }}>
          <div style={{ fontSize: ".85rem", fontWeight: 700, color: "#1e3a5f", marginBottom: 6 }}>{retry ? "⚠️ 권한 확인 실패" : "🔒 권한 없음 — 관리자에게 요청"}</div>
          <div style={{ fontSize: ".8rem", color: "#374151", lineHeight: 1.8 }}>{msg}</div>
        </div>
        {ident && ident.email && <div style={{ fontSize: ".75rem", color: "#64748b", marginBottom: 6, wordBreak: "break-all" }}>현재 계정: <b>{ident.email}</b></div>}
        <div style={{ fontSize: ".75rem", color: "#94a3b8", marginBottom: 20 }}>문의: <a href={`mailto:${T365_IT_MAIL}`} style={{ color: "#0078d4", textDecoration: "none" }}>{T365_IT_MAIL}</a></div>
        <div style={{ display: "flex", gap: 8, justifyContent: "center", flexWrap: "wrap" }}>
          {retry ? (
            <button onClick={() => window.location.reload()} style={{ background: "#0078d4", color: "#fff", border: "none", borderRadius: 10, padding: "10px 24px", fontSize: ".85rem", fontWeight: 600, cursor: "pointer" }}>다시 시도</button>
          ) : internal ? (
            <a href="https://aps.startruckkorea.com/" target="_self" style={{ textDecoration: "none", display: "inline-flex", alignItems: "center", gap: 7, background: "#0078d4", color: "#fff", borderRadius: 10, padding: "10px 24px", fontSize: ".85rem", fontWeight: 600 }}><span style={{ fontSize: "1rem", lineHeight: 1 }}>📬</span><span>돌아가기</span></a>
          ) : null}
          <button onClick={t365Logout} data-testid="denied-logout" style={{ background: "#fff", color: "#0f2744", border: "1px solid #cbd5e1", borderRadius: 10, padding: "10px 20px", fontSize: ".85rem", fontWeight: 600, cursor: "pointer" }}>다른 계정으로 로그인</button>
        </div>
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* 시작 — 로그인 → 「권한 확인」 화면 → /me · 사이트 · 설정 · 사용자 목록 → 판정 → 통과한 계정에만 앱    */
/* 판정 전에는 아무 내용도 보이지 않는다(SSC · MKQR 과 같음). 판정 규칙(fail-closed):                       */
/*  · 설정 파일 관리자(TRAINING365_ADMIN_N · ADMIN_SP · ADMIN_SP_N · IT_MANAGER) + IT 고정 계정 → 관리자       */
/*  · 그 밖에는 training365_Users 에 등록 · 사용 중 · 역할이 4개 중 하나여야만. 목록을 못 읽으면 막는다      */
/* ------------------------------------------------------------------ */
async function t365Boot(account) {
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("loading").style.display = "flex";
  let me = null;
  try { me = await apiGet("/me?$select=mail,userPrincipalName,otherMails,userType,displayName"); } catch (e) { console.warn("[Training365] /me 조회 실패:", e.message); }
  const ident = buildIdentity(account, me);
  _tLogUser = { email: ident.email, name: ident.shortName };
  try {
    const site = await apiGet(`/sites/${SITE_PATH}`);
    _siteId = site.id;
  } catch (e) {
    document.getElementById("loading").style.display = "none";
    document.getElementById("login-screen").style.display = "flex";
    showLoginErr("연결에 실패했습니다 — 권한이 없거나 네트워크 오류입니다. 계속되면 " + T365_IT_MAIL + " 로 문의해 주세요.");
    return;
  }
  const wrap = (pr) => pr.then((v) => ({ v }), (e) => ({ e }));
  const [cfgR, usersR] = await Promise.all([wrap(loadSystemConfig()), wrap(tListAll(T365_LISTS.users))]);
  if (cfgR.e) console.warn("[Training365] 설정 파일 읽기 실패(게스트는 정상) — 관리자는 IT 고정 계정 · 사용자 목록 기준:", cfgR.e.message);
  const configAdmins = configAdminEmails(cfgR.v || {});
  const isCfgAdmin = ident.ids.some((id) => configAdmins.includes(id));
  const users = usersR.v || [];
  const mine = users.filter((u) => ident.ids.includes(normEmail(u.Email)));
  const myRow = mine.find((u) => u.Active !== false) || mine[0] || null;
  let role = null, reason = "";
  if (isCfgAdmin) role = "관리자";
  else if (usersR.e) reason = "users-error";
  else if (!myRow) reason = "not-registered";
  else if (myRow.Active === false) reason = "inactive";
  else if (!T365_ROLES.includes(myRow.Role)) reason = "no-role";
  else role = myRow.Role;
  const email = myRow ? normEmail(myRow.Email) : ident.email;
  const company = (myRow && myRow.Company) || "";
  _tLogUser = { email, name: (myRow && myRow.Title) || ident.shortName };
  // 접속 기록 — 통과 · 차단 모두. 기록 실패(목록 없음 · 권한)는 화면을 막지 않는다
  try { await T365Session.start({ email, name: (myRow && myRow.Title) || ident.shortName, role: role || "", company }); }
  catch (e) { console.warn("[Training365] 접속 기록 실패:", e.message); }
  const loadingEl = document.getElementById("loading"); if (loadingEl) loadingEl.remove();
  const root = createRoot(document.getElementById("root"));
  if (!role) { root.render(<AccessDenied ident={{ ...ident, email }} reason={reason} />); return; }
  T365Session.startTimers();
  root.render(<App boot={{ me: { ...ident, email, name: (myRow && myRow.Title) || ident.shortName, company }, role, isCfgAdmin, configAdmins, users, usersLoaded: !usersR.e }} />);
}

(async function initMsal() {
  const btn = document.getElementById("btn-login");
  try {
    await msalApp.initialize();
    const resp = await msalApp.handleRedirectPromise();
    if (resp && resp.account) { msalApp.setActiveAccount(resp.account); await t365Boot(resp.account); return; }
    const accounts = msalApp.getAllAccounts();
    if (accounts.length) { msalApp.setActiveAccount(accounts[0]); await t365Boot(accounts[0]); return; }
    if (btn) { btn.disabled = false; btn.textContent = "Microsoft 365 계정으로 로그인"; }
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = "Microsoft 365 계정으로 로그인"; }
    showLoginErr(e.message);
  }
})();

document.getElementById("btn-login").onclick = async () => {
  try {
    if (window !== window.top) { window.open(window.location.href, "_blank"); return; }
    await msalApp.loginRedirect({ scopes: MSAL_SCOPES, prompt: "select_account" });
  } catch (e) { showLoginErr(e.message); }
};
</script>
